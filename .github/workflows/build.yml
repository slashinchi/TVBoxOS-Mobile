name: TVBox Mobile Build

on:
  push:
    branches: [main, patched]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android API 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build APK
        run: |
          chmod +x gradlew
          mkdir -p build
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build/gradle-build.log

      - name: Report Gradle failure
        if: failure()
        run: |
          failure_line=$(grep -m 1 -E 'Execution failed for task|^e: | error: ' build/gradle-build.log || true)
          if [ -z "$failure_line" ]; then
            failure_line=$(tail -n 1 build/gradle-build.log)
          fi
          echo "::error title=Gradle build failure::$failure_line"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TVBox-Mobile
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TVBox-Mobile-gradle-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TVBox-Mobile-build-log
          path: build/gradle-build.log
          if-no-files-found: warn
          retention-days: 14

  build-signed-rc:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/patched' && github.actor == 'slashinchi'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/rc-pipeline.yml
    with:
      release_sha: ${{ github.sha }}
      source_sha: ${{ github.sha }}
      mode: manual-local
      upstream_sha: ''
      upstream_version: ''
      upstream_code: ''
      expected_version_name: ''
      expected_version_code: ''
      release_debt: ''
      candidate_pr: ''
      provenance_marker: ''

  publish-github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release-signing
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android API 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Verify tag ancestry on patched
        run: |
          git fetch origin patched
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/patched"; then
            echo "::error::Tag commit ${GITHUB_SHA} is not an ancestor of origin/patched"
            exit 1
          fi
          echo "Tag ${GITHUB_SHA} is an ancestor of origin/patched"

      - name: Verify release version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          app_version=$(sed -nE "s/^[[:space:]]*versionName '([^']+)'/\1/p" app/build.gradle | head -1)
          if [ "$app_version" != "$version" ]; then
            echo "::error::Tag ${TAG_NAME} does not match app version ${app_version}"
            exit 1
          fi

      - name: Verify signing configuration fail-fast
        env:
          TVBOX_KEYSTORE_BASE64: ${{ secrets.TVBOX_KEYSTORE_BASE64 }}
          TVBOX_KEY_ALIAS: ${{ secrets.TVBOX_KEY_ALIAS }}
          TVBOX_KEY_PASSWORD: ${{ secrets.TVBOX_KEY_PASSWORD }}
          TVBOX_STORE_PASSWORD: ${{ secrets.TVBOX_STORE_PASSWORD }}
          TVBOX_SIGNER_SHA256: ${{ vars.TVBOX_SIGNER_SHA256 }}
        run: |
          missing=""
          [ -z "$TVBOX_KEYSTORE_BASE64" ] && missing="$missing TVBOX_KEYSTORE_BASE64"
          [ -z "$TVBOX_KEY_ALIAS" ] && missing="$missing TVBOX_KEY_ALIAS"
          [ -z "$TVBOX_KEY_PASSWORD" ] && missing="$missing TVBOX_KEY_PASSWORD"
          [ -z "$TVBOX_STORE_PASSWORD" ] && missing="$missing TVBOX_STORE_PASSWORD"
          [ -z "$TVBOX_SIGNER_SHA256" ] && missing="$missing TVBOX_SIGNER_SHA256"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing configuration:$missing"
            exit 1
          fi

      - name: Restore release signing key
        env:
          TVBOX_KEYSTORE_BASE64: ${{ secrets.TVBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TVBOX_KEYSTORE_BASE64" ]; then
            echo "::error::Missing TVBOX_KEYSTORE_BASE64. Configure the fixed signing key before publishing a release."
            exit 1
          fi
          printf '%s' "$TVBOX_KEYSTORE_BASE64" | base64 --decode > TVBoxOSC.jks
          chmod 600 TVBoxOSC.jks
          if [ ! -s TVBoxOSC.jks ]; then
            echo "::error::Decoded keystore is empty or invalid"
            exit 1
          fi

      - name: Build release artifact
        env:
          TVBOX_KEY_ALIAS: ${{ secrets.TVBOX_KEY_ALIAS }}
          TVBOX_KEY_PASSWORD: ${{ secrets.TVBOX_KEY_PASSWORD }}
          TVBOX_STORE_PASSWORD: ${{ secrets.TVBOX_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Verify release APK identity
        env:
          TVBOX_SIGNER_SHA256: ${{ vars.TVBOX_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p build
          BT="$ANDROID_HOME/build-tools/34.0.0"
          apks=("$PWD"/app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release APK, found ${#apks[@]}"
            exit 1
          fi
          apk="${apks[0]}"
          echo "APK: $apk"
          "$BT/apksigner" verify --verbose --print-certs "$apk" | tee build/apk-signature.txt
          actual_sha=$(grep -m 1 -E 'certificate SHA-256 digest' build/apk-signature.txt | awk '{print $NF}' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]' | tr -d ':')
          expected_sha=$(printf '%s' "$TVBOX_SIGNER_SHA256" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]' | tr -d ':')
          if [[ ! "$expected_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::TVBOX_SIGNER_SHA256 is not a 64-char hex fingerprint"
            exit 1
          fi
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "::error::Signer fingerprint mismatch. Expected ${expected_sha}, got ${actual_sha}"
            exit 1
          fi
          badging=$("$BT/aapt2" dump badging "$apk")
          pkg=$(echo "$badging" | sed -nE "s/^package: name='([^']+)'.*/\1/p" | head -1)
          vcode=$(echo "$badging" | sed -nE "s/^package:.*versionCode='([^']+)'.*/\1/p" | head -1)
          vname=$(echo "$badging" | sed -nE "s/^package:.*versionName='([^']+)'.*/\1/p" | head -1)
          apk_sha=$(sha256sum "$apk" | awk '{print $1}')
          {
            echo "signer_sha256=${actual_sha}"
            echo "apk_sha256=${apk_sha}"
            echo "package=${pkg}"
            echo "versionCode=${vcode}"
            echo "versionName=${vname}"
            echo "commit=${GITHUB_SHA}"
          } | tee build/rc-identity.txt
          [ "$pkg" = "com.github.tvbox.osc" ] || { echo "::error::package mismatch"; exit 1; }
          expected_vcode=$(sed -nE "s/^[[:space:]]*versionCode ([0-9]+).*/\1/p" app/build.gradle | head -1)
          expected_vname=$(sed -nE "s/^[[:space:]]*versionName '([^']+)'.*/\1/p" app/build.gradle | head -1)
          [ "$vcode" = "$expected_vcode" ] || { echo "::error::versionCode mismatch (apk=${vcode} expected=${expected_vcode})"; exit 1; }
          [ "$vname" = "$expected_vname" ] || { echo "::error::versionName mismatch (apk=${vname} expected=${expected_vname})"; exit 1; }

      - name: Create update manifest
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          GITHUB_REPOSITORY="${{ github.repository }}" ./scripts/sync_release_metadata.sh "$TAG_NAME"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            update.json

      - name: Publish update manifest
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin patched
          git checkout -B patched origin/patched
          GITHUB_REPOSITORY="${{ github.repository }}" ./scripts/sync_release_metadata.sh --skip-version-check "$TAG_NAME"
          if git diff --quiet -- update.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: sync release metadata for ${TAG_NAME} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:patched; then exit 0; fi
            git pull --rebase origin patched
          done
          echo "::error::Unable to publish update manifest after three attempts"
          exit 1

      - name: Cleanup signing key
        if: always()
        run: rm -f TVBoxOSC.jks
