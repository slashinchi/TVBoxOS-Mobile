name: TVBox Mobile Build

on:
  push:
    branches: [main, patched]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          mkdir -p build
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build/gradle-build.log

      - name: Report Gradle failure
        if: failure()
        run: |
          failure_line=$(grep -m 1 -E 'Execution failed for task|^e: | error: ' build/gradle-build.log || true)
          if [ -z "$failure_line" ]; then
            failure_line=$(tail -n 1 build/gradle-build.log)
          fi
          echo "::error title=Gradle build failure::$failure_line"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Mobile
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Mobile-gradle-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Mobile-build-log
          path: build/gradle-build.log
          if-no-files-found: warn
          retention-days: 14

  build-signed-rc:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Verify patched branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/patched" ]; then
            echo "::error::Signed RC only allowed on patched, got ${GITHUB_REF}"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify signing configuration fail-fast
        env:
          TVBOX_KEYSTORE_BASE64: ${{ secrets.TVBOX_KEYSTORE_BASE64 }}
          TVBOX_KEY_ALIAS: ${{ secrets.TVBOX_KEY_ALIAS }}
          TVBOX_KEY_PASSWORD: ${{ secrets.TVBOX_KEY_PASSWORD }}
          TVBOX_STORE_PASSWORD: ${{ secrets.TVBOX_STORE_PASSWORD }}
          TVBOX_SIGNER_SHA256: ${{ vars.TVBOX_SIGNER_SHA256 }}
        run: |
          missing=""
          [ -z "$TVBOX_KEYSTORE_BASE64" ] && missing="$missing TVBOX_KEYSTORE_BASE64"
          [ -z "$TVBOX_KEY_ALIAS" ] && missing="$missing TVBOX_KEY_ALIAS"
          [ -z "$TVBOX_KEY_PASSWORD" ] && missing="$missing TVBOX_KEY_PASSWORD"
          [ -z "$TVBOX_STORE_PASSWORD" ] && missing="$missing TVBOX_STORE_PASSWORD"
          [ -z "$TVBOX_SIGNER_SHA256" ] && missing="$missing TVBOX_SIGNER_SHA256"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing configuration:$missing"
            exit 1
          fi

      - name: Restore signing key
        env:
          TVBOX_KEYSTORE_BASE64: ${{ secrets.TVBOX_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$TVBOX_KEYSTORE_BASE64" | base64 --decode > TVBoxOSC.jks
          chmod 600 TVBoxOSC.jks

      - name: Build signed release APK
        env:
          TVBOX_KEY_ALIAS: ${{ secrets.TVBOX_KEY_ALIAS }}
          TVBOX_KEY_PASSWORD: ${{ secrets.TVBOX_KEY_PASSWORD }}
          TVBOX_STORE_PASSWORD: ${{ secrets.TVBOX_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p build
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build/gradle-build.log

      - name: Verify APK identity
        env:
          TVBOX_SIGNER_SHA256: ${{ vars.TVBOX_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          apks=("$PWD"/app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release APK, found ${#apks[@]}"
            exit 1
          fi
          apk="${apks[0]}"
          echo "APK: $apk"
          "$BT/apksigner" verify --verbose --print-certs "$apk" | tee build/apk-signature.txt
          actual_sha=$(grep -m 1 -E 'certificate SHA-256 digest' build/apk-signature.txt | awk '{print $NF}')
          if [ -z "$actual_sha" ] || [ "$actual_sha" != "$TVBOX_SIGNER_SHA256" ]; then
            echo "::error::Signer fingerprint mismatch. Expected ${TVBOX_SIGNER_SHA256}, got ${actual_sha}"
            exit 1
          fi
          badging=$("$BT/aapt2" dump badging "$apk")
          pkg=$(echo "$badging" | sed -nE "s/^package: name='([^']+)'.*/\1/p" | head -1)
          vcode=$(echo "$badging" | sed -nE "s/^package:.*versionCode='([^']+)'.*/\1/p" | head -1)
          vname=$(echo "$badging" | sed -nE "s/^package:.*versionName='([^']+)'.*/\1/p" | head -1)
          echo "package=$pkg versionCode=$vcode versionName=$vname" | tee build/rc-identity.txt
          [ "$pkg" = "com.github.tvbox.osc" ] || { echo "::error::package mismatch"; exit 1; }
          [ "$vcode" = "23601" ] || { echo "::error::versionCode mismatch"; exit 1; }
          [ "$vname" = "2.1.26.1" ] || { echo "::error::versionName mismatch"; exit 1; }

      - name: Upload signed RC APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Mobile-RC-v2.1.26.1
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload RC identity report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Mobile-RC-identity
          path: build/rc-identity.txt
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing key
        if: always()
        run: rm -f TVBoxOSC.jks

      - name: Report Gradle failure
        if: failure()
        run: |
          failure_line=$(grep -m 1 -E 'Execution failed for task|^e: | error: ' build/gradle-build.log || true)
          if [ -z "$failure_line" ]; then
            failure_line=$(tail -n 1 build/gradle-build.log || true)
          fi
          if [ -n "$failure_line" ]; then
            echo "::error title=Gradle build failure::$failure_line"
          fi

  publish-github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          app_version=$(sed -nE "s/^[[:space:]]*versionName '([^']+)'/\1/p" app/build.gradle)
          if [ "$app_version" != "$version" ]; then
            echo "::error::Tag ${TAG_NAME} does not match app version ${app_version}"
            exit 1
          fi

      - name: Restore release signing key
        env:
          TVBOX_KEYSTORE_BASE64: ${{ secrets.TVBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TVBOX_KEYSTORE_BASE64" ]; then
            echo "::error::Missing TVBOX_KEYSTORE_BASE64. Configure the fixed signing key before publishing a release."
            exit 1
          fi
          printf '%s' "$TVBOX_KEYSTORE_BASE64" | base64 --decode > TVBoxOSC.jks

      - name: Build release artifact
        env:
          TVBOX_KEY_ALIAS: ${{ secrets.TVBOX_KEY_ALIAS }}
          TVBOX_KEY_PASSWORD: ${{ secrets.TVBOX_KEY_PASSWORD }}
          TVBOX_STORE_PASSWORD: ${{ secrets.TVBOX_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Create update manifest
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          GITHUB_REPOSITORY="${{ github.repository }}" ./scripts/sync_release_metadata.sh "$TAG_NAME"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/*.apk
            update.json

      - name: Publish update manifest
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          GITHUB_REPOSITORY="${{ github.repository }}" ./scripts/sync_release_metadata.sh --skip-version-check "$TAG_NAME"
          if git diff --quiet -- update.json README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json README.md
          git commit -m "chore: sync release metadata for ${TAG_NAME} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "::error::Unable to publish update manifest after three attempts"
          exit 1
