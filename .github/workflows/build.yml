name: TVBox Mobile Build

on:
  push:
    branches: [main, patched]
  pull_request:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: android-build-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android API 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Stage pinned legacy dependencies
        run: |
          set -euo pipefail
          legacy_repo="$RUNNER_TEMP/tvbox-legacy-maven"
          python3 scripts/legacy_staging.py stage \
            --manifest gradle/legacy-dependencies.lock.json \
            --output "$legacy_repo"
          python3 scripts/legacy_staging.py verify \
            --manifest gradle/legacy-dependencies.lock.json \
            --output "$legacy_repo"
          echo "TVBOX_LEGACY_REPO=$legacy_repo" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build APK
        run: |
          chmod +x gradlew
          mkdir -p build
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build/gradle-build.log

      - name: Report Gradle failure
        if: failure()
        run: |
          failure_line=$(grep -m 1 -E 'Execution failed for task|^e: | error: ' build/gradle-build.log || true)
          if [ -z "$failure_line" ]; then
            failure_line=$(tail -n 1 build/gradle-build.log)
          fi
          echo "::error title=Gradle build failure::$failure_line"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TVBox-Mobile
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TVBox-Mobile-gradle-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TVBox-Mobile-build-log
          path: build/gradle-build.log
          if-no-files-found: warn
          retention-days: 14
