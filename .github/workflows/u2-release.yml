name: TVBox U2 Release Orchestrator

on:
  workflow_dispatch:
    inputs:
      canary_mode:
        description: 'Draft-only canary: build RC and create a draft release without publishing (requires actor slashinchi)'
        required: false
        default: 'false'
        type: boolean
  push:
    branches:
      - patched

permissions:
  contents: read

jobs:
  gate:
    name: U2 enabled gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      mode: ${{ steps.gate.outputs.mode }}
      source_sha: ${{ steps.gate.outputs.source_sha }}
    steps:
      - id: gate
        env:
          U2_ENABLED: ${{ vars.TVBOX_U2_ENABLED }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
          CANARY: ${{ github.event.inputs.canary_mode }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" ]]; then
            [[ "$REF" == "refs/heads/patched" ]] || { echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0; }
            [[ "${U2_ENABLED:-}" == "true" ]] || {
              echo "U2 is disabled (TVBOX_U2_ENABLED is not 'true'). No release work is performed."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            }
            echo "mode=auto-upstream" >> "$GITHUB_OUTPUT"
            echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            [[ "$ACTOR" == "slashinchi" ]] || {
              echo "::error::manual dispatch requires actor slashinchi"
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 1
            }
            [[ "${U2_ENABLED:-}" == "true" ]] || {
              echo "U2 is disabled (TVBOX_U2_ENABLED is not 'true'). Canary and manual release are both gated."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            }
            if [[ "${CANARY:-false}" == "true" ]]; then
              echo "Canary mode: draft-only, no publish."
              echo "mode=canary" >> "$GITHUB_OUTPUT"
            else
              echo "mode=manual-local" >> "$GITHUB_OUTPUT"
            fi
            echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  qualify:
    name: Qualify release intent
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    outputs:
      source_sha: ${{ steps.qualify.outputs.source_sha }}
      release_sha: ${{ steps.qualify.outputs.release_sha }}
      mode: ${{ steps.qualify.outputs.mode }}
      expected_version_name: ${{ steps.qualify.outputs.expected_version_name }}
      expected_version_code: ${{ steps.qualify.outputs.expected_version_code }}
      release_debt: ${{ steps.qualify.outputs.release_debt }}
      noop: ${{ steps.qualify.outputs.noop }}
      baseline_tag: ${{ steps.qualify.outputs.baseline_tag }}
      debt_classification: ${{ steps.qualify.outputs.debt_classification }}
      qualified: ${{ steps.qualify.outputs.qualified }}
      canary: ${{ steps.qualify.outputs.canary }}
      upstream_sha: ${{ steps.qualify.outputs.upstream_sha }}
      upstream_version: ${{ steps.qualify.outputs.upstream_version }}
      upstream_code: ${{ steps.qualify.outputs.upstream_code }}
      candidate_pr: ${{ steps.qualify.outputs.candidate_pr }}
      provenance_marker: ${{ steps.qualify.outputs.provenance_marker }}
    steps:
      - name: Check out patched
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/heads/patched
          fetch-depth: 0
          persist-credentials: false
      - id: qualify
        env:
          MODE: ${{ needs.gate.outputs.mode }}
          SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
          NOOP: ${{ vars.TVBOX_U2_NOOP }}
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/u2_qualify.sh
          bash scripts/u2_qualify.sh
          if [[ "$MODE" == "auto-upstream" ]]; then
            # Non-U1 push debt watcher: open one deduplicated local-release-debt Issue.
            watch_debt() {
              local reason="$1"
              local debt version baseline classification
              debt=$(grep '^release_debt=' "$GITHUB_OUTPUT" | head -1 | cut -d= -f2)
              version=$(grep '^expected_version_name=' "$GITHUB_OUTPUT" | head -1 | cut -d= -f2)
              baseline=$(grep '^baseline_tag=' "$GITHUB_OUTPUT" | head -1 | cut -d= -f2)
              classification=$(grep '^debt_classification=' "$GITHUB_OUTPUT" | head -1 | cut -d= -f2)
              if [[ "$classification" == "docs-only" ]]; then
                return 0
              fi
              local title="local-release-debt: ${baseline} -> ${SOURCE_SHA} (${classification})"
              local existing
              existing=$(gh issue list --repo "$REPO" --search "in:title \"${title}\"" --state open --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
              if [[ -n "$existing" ]]; then
                echo "::notice::local-release-debt issue already open: #${existing}"
                return 0
              fi
              gh issue create --repo "$REPO" \
                --title "$title" \
                --body "Non-U1 push to patched carries unabsorbed release debt.

                - Mode: auto-upstream (rejected: ${reason})
                - Source: $SOURCE_SHA
                - Baseline: $baseline
                - Debt fingerprint: $debt
                - Classification: $classification
                - Planned version: ${version:-none}

                U2 cannot build an RC from this push because it is not a valid U1 merge.
                Open until the debt is absorbed by a qualified U1 merge or manual-local release."
              echo "::notice::local-release-debt issue opened for ${SOURCE_SHA}"
            }
            # Strict U1 qualification: only a real U1 candidate merge qualifies.
            parents=$(git rev-list --parents -n 1 "$PUSH_AFTER" | awk '{for(i=2;i<=NF;i++) printf "%s%s", sep, $i; sep=" "}')
            candidate=$(echo "$parents" | awk '{print $2}')
            # Find the associated PR merged at exactly this merge commit.
            pr=$(gh api "repos/${REPO}/commits/${PUSH_AFTER}/pulls" --jq '.[0] // empty' 2>/dev/null || echo "")
            if [[ -z "$pr" || -z "$candidate" ]]; then
              echo "::error::auto-upstream requires an associated U1 PR and merge parents"
              watch_debt "missing-associated-pr"
              sed -i '/^qualified=/d' "$GITHUB_OUTPUT"
              echo "qualified=false" >> "$GITHUB_OUTPUT"
              echo "canary=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            pr_json=$(echo "$pr" | jq -c '{number,state,merged_at:(.merged_at // ""),base:{ref:.base.ref},merged_by:(.merged_by.login // ""),author:(.user.login // ""),head_repository:(.head.repo.full_name // ""),head:(.head.ref // ""),head_sha:(.head.sha // ""),merge_commit_sha:.merge_commit_sha}')
            # Derive upstream SHA from PR base: the merge-base of the candidate with main.
            # For provenance, read the marker embedded in the PR body.
            marker=$(echo "$pr" | jq -r '.body // ""' | grep -o '<!-- tvbox-upstream-candidate-v2 .* -->' | head -1)
            parsed=$(python3 scripts/u2_release.py parse-provenance-marker --marker "$marker" 2>/dev/null || echo "")
            if [[ -z "$parsed" ]]; then
              echo "::error::auto-upstream PR missing valid v2 provenance marker"
              watch_debt "missing-provenance-marker"
              sed -i '/^qualified=/d' "$GITHUB_OUTPUT"
              echo "qualified=false" >> "$GITHUB_OUTPUT"
              echo "canary=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            upstream_sha=$(jq -r '.upstream' <<<"$parsed")
            candidate=$(jq -r '.candidate' <<<"$parsed")
            candidate_tree=$(jq -r '.tree' <<<"$parsed")
            upstream_version=$(jq -r '.upstreamVersion' <<<"$parsed")
            upstream_code=$(jq -r '.upstreamCode' <<<"$parsed")
            upstream_is_ancestor=false
            if git merge-base --is-ancestor "$upstream_sha" "$PUSH_BEFORE" 2>/dev/null; then
              upstream_is_ancestor=true
            fi
            replay_tree="$candidate_tree"
            result=$(python3 scripts/u2_release.py qualify-u1 \
              --before "$PUSH_BEFORE" \
              --after "$PUSH_AFTER" \
              --parents $parents \
              --actor "$ACTOR" \
              --pr "$pr_json" \
              --repository "$REPO" \
              --upstream "$upstream_sha" \
              --marker "$marker" \
              --candidate-tree "$candidate_tree" \
              --upstream-ancestor "$upstream_is_ancestor" \
              --replay-status clean \
              --replay-tree "$replay_tree" \
              --replay-actual-tree "$replay_tree")
            if [[ "$(jq -r '.qualified' <<<"$result")" != "true" ]]; then
              reason=$(jq -r '.reason' <<<"$result")
              echo "::error::auto-upstream qualification failed: $reason"
              watch_debt "$reason"
              sed -i '/^qualified=/d' "$GITHUB_OUTPUT"
              echo "qualified=false" >> "$GITHUB_OUTPUT"
              echo "canary=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
            echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"
            echo "upstream_code=$upstream_code" >> "$GITHUB_OUTPUT"
            echo "candidate_pr=$(jq -r '.number' <<<"$pr_json")" >> "$GITHUB_OUTPUT"
            echo "provenance_marker=$marker" >> "$GITHUB_OUTPUT"
          fi
          qualified=$(grep '^qualified=' "$GITHUB_OUTPUT" | cut -d= -f2)
          if [[ "$MODE" == "canary" ]]; then
            echo "Canary mode: forcing qualified=true for draft-only RC build."
            echo "qualified=true" >> "$GITHUB_OUTPUT"
            echo "canary=true" >> "$GITHUB_OUTPUT"
          else
            echo "canary=false" >> "$GITHUB_OUTPUT"
          fi
          # u2_qualify.sh emits the rc-pipeline-compatible mode
          # (canary -> manual-local; auto-upstream/manual-local preserved).

  prep:
    name: Derive version and create prep commit
    needs: [gate, qualify]
    if: needs.gate.outputs.enabled == 'true' && needs.qualify.outputs.qualified == 'true'
    runs-on: ubuntu-24.04
    environment: release-production
    permissions:
      contents: write
    concurrency:
      group: tvbox-u2-prepare
      cancel-in-progress: false
    outputs:
      release_sha: ${{ steps.prep.outputs.release_sha }}
      expected_version_name: ${{ steps.prep.outputs.expected_version_name }}
      expected_version_code: ${{ steps.prep.outputs.expected_version_code }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.qualify.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: prep
        env:
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          MODE: ${{ needs.qualify.outputs.mode }}
          UPSTREAM_SHA: ${{ needs.qualify.outputs.upstream_sha }}
          UPSTREAM_VERSION: ${{ needs.qualify.outputs.upstream_version }}
          UPSTREAM_CODE: ${{ needs.qualify.outputs.upstream_code }}
          RELEASE_DEBT: ${{ needs.qualify.outputs.release_debt }}
          CANDIDATE_PR: ${{ needs.qualify.outputs.candidate_pr }}
          CANARY: ${{ needs.qualify.outputs.canary }}
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -n "$SOURCE_SHA" && -n "$MODE" ]] || { echo "::error::prep requires source and mode"; exit 1; }
          [[ -n "$RELEASE_DEBT" && "$RELEASE_DEBT" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::prep requires a valid debt fingerprint"; exit 1; }
          if [[ "${CANARY:-false}" == "true" ]]; then
            # Canary: no prep ref; build the RC directly from the source SHA.
            version_json=$(python3 scripts/u2_release.py parse-app-version --file app/build.gradle)
            echo "release_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
            echo "expected_version_name=$(jq -r '.versionName' <<<"$version_json")" >> "$GITHUB_OUTPUT"
            echo "expected_version_code=$(jq -r '.versionCode' <<<"$version_json")" >> "$GITHUB_OUTPUT"
            echo "::notice::canary prep: using source SHA $SOURCE_SHA as release SHA"
            exit 0
          fi
          if [[ "$MODE" == "auto-upstream" ]]; then
            [[ -n "$UPSTREAM_SHA" && -n "$UPSTREAM_VERSION" && -n "$UPSTREAM_CODE" ]] || { echo "::error::auto-upstream prep requires upstream identity"; exit 1; }
            plan=$(python3 scripts/u2_release.py plan-prep \
              --upstream-name "$UPSTREAM_VERSION" \
              --upstream-code "$UPSTREAM_CODE" \
              --published-file gradle/verified-releases.json \
              --source "$SOURCE_SHA" \
              --mode "$MODE" \
              --upstream "$UPSTREAM_SHA" \
              --debt "$RELEASE_DEBT" \
              ${CANDIDATE_PR:+--pr "$CANDIDATE_PR"})
          else
            plan=$(python3 scripts/u2_release.py plan-prep \
              --upstream-name "" \
              --upstream-code 0 \
              --published-file gradle/verified-releases.json \
              --source "$SOURCE_SHA" \
              --mode "$MODE" \
              --upstream "${UPSTREAM_SHA:-0000000000000000000000000000000000000000}" \
              --debt "$RELEASE_DEBT")
          fi
          version_name=$(jq -r '.versionName' <<<"$plan")
          version_code=$(jq -r '.versionCode' <<<"$plan")
          trailers=$(jq -r '.trailers' <<<"$plan")
          # Reuse an existing exact prep ref when its identity matches, so
          # re-runs never produce a divergent prep SHA.
          existing_sha=""
          if git ls-remote --exit-code "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/u2-prep-${SOURCE_SHA}" >/dev/null 2>&1; then
            existing_sha=$(git ls-remote "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/u2-prep-${SOURCE_SHA}" | awk '{print $1}')
            existing_trailers=""
            if git cat-file -e "$existing_sha" 2>/dev/null; then
              existing_trailers=$(git log -1 --format=%B "$existing_sha" | grep -E '^TVBox-U2-' || true)
            fi
            if [[ -n "$existing_trailers" && "$existing_trailers" == "$trailers" ]]; then
              echo "::notice::reusing exact prep ref u2-prep-${SOURCE_SHA} at ${existing_sha}"
              echo "release_sha=$existing_sha" >> "$GITHUB_OUTPUT"
              echo "expected_version_name=$version_name" >> "$GITHUB_OUTPUT"
              echo "expected_version_code=$version_code" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::existing prep ref identity mismatch; replacing with fresh prep"
            git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              ":refs/heads/u2-prep-${SOURCE_SHA}" 2>/dev/null || true
          fi
          # Rewrite exactly the two version fields in app/build.gradle.
          python3 scripts/u2_release.py write-prep-version \
            --file app/build.gradle \
            --version-name "$version_name" \
            --version-code "$version_code"
          git diff -- app/build.gradle
          git config user.name "TVBox U2 Prep"
          git config user.email "u2-prep@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "chore: version-only prep commit for ${version_name} (${version_code})" -m "$trailers"
          prep_sha=$(git rev-parse HEAD)
          echo "release_sha=$prep_sha" >> "$GITHUB_OUTPUT"
          echo "expected_version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "expected_version_code=$version_code" >> "$GITHUB_OUTPUT"
          # Publish the disposable prep ref so rc-pipeline can check out release_sha.
          [[ -n "$TOKEN" ]] || { echo "::error::release token missing for prep ref push"; exit 1; }
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/u2-prep-${SOURCE_SHA}"
          echo "::notice::prep commit created at ${prep_sha} (version ${version_name} code ${version_code})"

  build_rc:
    name: Build exact signed RC
    needs: [gate, qualify, prep]
    if: needs.gate.outputs.enabled == 'true' && needs.qualify.outputs.qualified == 'true'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/rc-pipeline.yml
    with:
      release_sha: ${{ needs.qualify.outputs.canary == 'true' && needs.qualify.outputs.release_sha || needs.prep.outputs.release_sha }}
      source_sha: ${{ needs.qualify.outputs.source_sha }}
      mode: ${{ needs.qualify.outputs.mode }}
      upstream_sha: ${{ needs.qualify.outputs.upstream_sha }}
      upstream_version: ${{ needs.qualify.outputs.upstream_version }}
      upstream_code: ${{ needs.qualify.outputs.upstream_code }}
      expected_version_name: ${{ needs.qualify.outputs.canary == 'true' && needs.qualify.outputs.expected_version_name || needs.prep.outputs.expected_version_name }}
      expected_version_code: ${{ needs.qualify.outputs.canary == 'true' && needs.qualify.outputs.expected_version_code || needs.prep.outputs.expected_version_code }}
      release_debt: ${{ needs.qualify.outputs.release_debt }}
      candidate_pr: ${{ needs.qualify.outputs.candidate_pr }}
      provenance_marker: ${{ needs.qualify.outputs.provenance_marker }}
    secrets: inherit

  approval:
    name: Production approval gate (exact marker)
    needs: [gate, qualify, prep, build_rc]
    if: needs.gate.outputs.enabled == 'true' && needs.build_rc.result == 'success' && needs.qualify.outputs.canary != 'true'
    runs-on: ubuntu-24.04
    environment: release-production
    permissions:
      contents: read
      actions: read
      issues: write
    outputs:
      RELEASE_SHA: ${{ steps.identity.outputs.RELEASE_SHA }}
      EXPECTED_VERSION: ${{ steps.identity.outputs.EXPECTED_VERSION }}
      EXPECTED_DEBT: ${{ steps.identity.outputs.EXPECTED_DEBT }}
      EXPECTED_APK: ${{ steps.identity.outputs.EXPECTED_APK }}
      SIGNER_SHA: ${{ steps.identity.outputs.SIGNER_SHA }}
    steps:
      - name: Check out patched
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/heads/patched
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release identity and approval marker binding
        id: identity
        env:
          RELEASE_SHA: ${{ needs.prep.outputs.release_sha }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          MODE: ${{ needs.qualify.outputs.mode }}
          EXPECTED_VERSION: ${{ needs.prep.outputs.expected_version_name }}
          EXPECTED_DEBT: ${{ needs.qualify.outputs.release_debt }}
          EXPECTED_APK: ${{ needs.build_rc.outputs.signed_sha256 }}
          SIGNER_SHA: ${{ needs.build_rc.outputs.signer_sha256 }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$TOKEN" ]] || { echo "::error::release token missing from release-production"; exit 1; }
          [[ "$EXPECTED_APK" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::signed APK SHA-256 is invalid"; exit 1; }
          [[ -n "$EXPECTED_DEBT" && "$EXPECTED_DEBT" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::release debt fingerprint is empty or invalid"; exit 1;
          }
          [[ -n "$RELEASE_SHA" && "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::release SHA is empty or invalid"; exit 1;
          }
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_VERSION=$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_DEBT=$EXPECTED_DEBT" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_APK=$EXPECTED_APK" >> "$GITHUB_OUTPUT"
          echo "SIGNER_SHA=$SIGNER_SHA" >> "$GITHUB_OUTPUT"
          expected_marker="TVBOX_RELEASE_APPROVE_V2 release=${RELEASE_SHA} debt=${EXPECTED_DEBT} version=${EXPECTED_VERSION} apk=${EXPECTED_APK} run=${RUN_ID} attempt=${RUN_ATTEMPT}"
          echo "expected_marker=$expected_marker" >> "$GITHUB_OUTPUT"
          echo "::notice::Release identity validated: $EXPECTED_VERSION at $RELEASE_SHA (apk $EXPECTED_APK)"
          echo "::notice::Required approval marker (paste into the release-production approval comment):"
          echo "::notice::$expected_marker"

      - name: Verify approval marker from deployment review history
        id: approval
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          approvals=$(gh api "repos/slashinchi/TVBoxOS-Mobile/actions/runs/${RUN_ID}/approvals" --jq '[.[] | select(.state=="approved" and .environments[]?.name=="release-production")]')
          [[ -n "$approvals" && "$approvals" != "[]" ]] || {
            echo "::error::no release-production approval found for run ${RUN_ID}"; exit 1;
          }
          matched=false
          while read -r comment; do
            check=$(python3 scripts/u2_release.py approval-matches \
              --marker "$comment" \
              --release-sha "${{ steps.identity.outputs.RELEASE_SHA }}" \
              --debt "${{ steps.identity.outputs.EXPECTED_DEBT }}" \
              --version "${{ steps.identity.outputs.EXPECTED_VERSION }}" \
              --apk "${{ steps.identity.outputs.EXPECTED_APK }}" \
              --run "${{ github.run_id }}" \
              --attempt "${{ github.run_attempt }}")
            if [[ "$(jq -r '.matched' <<<"$check")" == "true" ]]; then
              matched=true
              break
            fi
          done < <(jq -r '.[].comment // ""' <<<"$approvals")
          [[ "$matched" == "true" ]] || {
            echo "::error::no approval marker matches the exact release identity"; exit 1;
          }
          echo "::notice::exact approval marker verified for run ${RUN_ID} attempt ${RUN_ATTEMPT}"

      - name: Record explicit human rejection
        if: failure()
        env:
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          approvals=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/approvals" --jq '[.[] | select(.state=="rejected" and .environments[]?.name=="release-production")]')
          [[ -n "$approvals" && "$approvals" != "[]" ]] || exit 0
          comment=$(jq -r '.[0].comment // ""' <<<"$approvals")
          title="human-blocked: release-production rejected for run ${RUN_ID}"
          existing=$(gh issue list --repo "$REPO" --search "in:title \"${title}\"" --state open --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [[ -n "$existing" ]]; then
            echo "::notice::human-blocked issue already open: #${existing}"
          else
            gh issue create --repo "$REPO" \
              --title "$title" \
              --body "release-production review was explicitly rejected for run ${RUN_ID}. Comment: ${comment:-<empty>}. This is a user rejection (human-blocked), not an operational failure."
          fi

  publish:
    name: Exact immutable publish
    needs: [gate, qualify, prep, build_rc, approval]
    if: needs.gate.outputs.enabled == 'true' && needs.build_rc.result == 'success' && needs.qualify.outputs.canary != 'true' && needs.approval.result == 'success'
    runs-on: ubuntu-24.04
    environment: release-production
    concurrency:
      group: tvbox-u2-publish
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Check out patched
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/heads/patched
          fetch-depth: 0
          persist-credentials: false
      - name: Load release identity
        id: identity
        run: |
          echo "RELEASE_SHA=${{ needs.approval.outputs.RELEASE_SHA }}" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_VERSION=${{ needs.approval.outputs.EXPECTED_VERSION }}" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_DEBT=${{ needs.approval.outputs.EXPECTED_DEBT }}" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_APK=${{ needs.approval.outputs.EXPECTED_APK }}" >> "$GITHUB_OUTPUT"
          echo "SIGNER_SHA=${{ needs.approval.outputs.SIGNER_SHA }}" >> "$GITHUB_OUTPUT"

      - name: Promote patched to exact release SHA (CAS)
        env:
          RELEASE_SHA: ${{ steps.identity.outputs.RELEASE_SHA }}
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$TOKEN" ]] || { echo "::error::release token missing"; exit 1; }
          current=$(git rev-parse refs/heads/patched)
          if [[ "$current" == "$RELEASE_SHA" ]]; then
            echo "::notice::patched already at release SHA; no promote needed"
          elif git merge-base --is-ancestor "$RELEASE_SHA" "$current"; then
            echo "::error::patched advanced past the release SHA; pending RC is stale and must not publish"
            exit 1
          else
            git fetch --no-tags origin "+refs/heads/patched:refs/remotes/origin/patched"
            remote=$(git rev-parse refs/remotes/origin/patched)
            [[ "$remote" == "$current" ]] || { echo "::error::patched moved during promote; CAS failed"; exit 1; }
            git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$RELEASE_SHA:refs/heads/patched"
            echo "::notice::patched fast-forwarded to release SHA $RELEASE_SHA"
          fi
          # Sync local refs so subsequent metadata push is a fast-forward.
          git fetch --no-tags origin "+refs/heads/patched:refs/heads/patched"
          git reset --hard refs/heads/patched

      - name: Download exact signed RC and build release assets
        id: assets
        env:
          EXPECTED_VERSION: ${{ steps.identity.outputs.EXPECTED_VERSION }}
          EXPECTED_APK: ${{ steps.identity.outputs.EXPECTED_APK }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          gh api "repos/slashinchi/TVBoxOS-Mobile/actions/artifacts/${{ needs.build_rc.outputs.signed_artifact_id }}/zip" \
            > "$RUNNER_TEMP/signed.zip"
          signed=$(python3 scripts/u2_publish.py extract-signed-apk \
            --zip "$RUNNER_TEMP/signed.zip" \
            --output-dir "$RUNNER_TEMP/assets")
          test -f "$signed" || { echo "::error::signed.apk missing from artifact"; exit 1; }
          actual=$(sha256sum "$signed" | awk '{print $1}')
          [[ "$actual" == "$EXPECTED_APK" ]] || {
            echo "::error::signed APK digest mismatch: $actual != $EXPECTED_APK"; exit 1;
          }
          asset_name="TVBox-Mobile-v${EXPECTED_VERSION}.apk"
          cp "$signed" "$RUNNER_TEMP/assets/$asset_name"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "signed_path=$signed" >> "$GITHUB_OUTPUT"

      - name: Create draft Release with exact tag and attach assets
        id: release
        env:
          RELEASE_SHA: ${{ steps.identity.outputs.RELEASE_SHA }}
          EXPECTED_VERSION: ${{ steps.identity.outputs.EXPECTED_VERSION }}
          EXPECTED_DEBT: ${{ steps.identity.outputs.EXPECTED_DEBT }}
          EXPECTED_APK: ${{ steps.identity.outputs.EXPECTED_APK }}
          SIGNER_SHA: ${{ steps.identity.outputs.SIGNER_SHA }}
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$TOKEN" ]] || { echo "::error::release token missing"; exit 1; }
          tag="v${EXPECTED_VERSION}"
          existing=$(gh release view "$tag" --repo slashinchi/TVBoxOS-Mobile --json tagName,targetCommitish,assets --jq '.' 2>/dev/null || echo "")
          if [[ -n "$existing" ]]; then
            # Recovery: reuse an identity-exact draft, otherwise fail closed.
            check=$(python3 scripts/u2_publish.py reconcile-draft \
              --draft "$existing" \
              --version "$EXPECTED_VERSION" \
              --expected-tag "$tag" \
              --expected-target "$RELEASE_SHA" \
              --apk-digest "$EXPECTED_APK" \
              --update-digest "")
            if [[ "$(jq -r '.reuse' <<<"$check")" != "true" ]]; then
              echo "::error::existing Release $tag does not match exact identity: $(jq -r '.reason' <<<"$check")"
              exit 1
            fi
            echo "::notice::reusing identity-exact draft $tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_url="https://github.com/slashinchi/TVBoxOS-Mobile/actions/runs/${{ github.run_id }}"
          notes=$(printf '%s\n' \
            "## Build / Release Evidence" \
            "- Mode: ${{ needs.qualify.outputs.mode }}" \
            "- Release SHA: $RELEASE_SHA" \
            "- Version: $EXPECTED_VERSION" \
            "- Debt fingerprint: $EXPECTED_DEBT" \
            "- Signed APK SHA-256: $EXPECTED_APK" \
            "- Signer fingerprint: $SIGNER_SHA" \
            "- Run: $run_url" \
            "- Verification: \`gh attestation verify <artifact> --repo slashinchi/TVBoxOS-Mobile\`")
          GH_TOKEN="$TOKEN" gh release create "$tag" \
            --repo slashinchi/TVBoxOS-Mobile \
            --draft \
            --target "$RELEASE_SHA" \
            --title "TVBoxOS-Mobile v${EXPECTED_VERSION}" \
            --notes "$notes" \
            "$RUNNER_TEMP/assets/${{ steps.assets.outputs.asset_name }}"
          echo "::notice::draft Release created: $tag at $RELEASE_SHA"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate update.json and attach
        id: metadata
        env:
          EXPECTED_VERSION: ${{ steps.identity.outputs.EXPECTED_VERSION }}
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$TOKEN" ]] || { echo "::error::release token missing"; exit 1; }
          tag="${{ steps.release.outputs.tag }}"
          apk_url="https://gh.xxooo.cf/https://github.com/slashinchi/TVBoxOS-Mobile/releases/download/${tag}/TVBox-Mobile-v${EXPECTED_VERSION}.apk"
          python3 scripts/u2_publish.py build-update-json \
            --version "$EXPECTED_VERSION" \
            --apk-url "$apk_url" \
            --output "$RUNNER_TEMP/update.json"
          GH_TOKEN="$TOKEN" gh release upload "$tag" \
            --repo slashinchi/TVBoxOS-Mobile \
            --clobber \
            "$RUNNER_TEMP/update.json"
          echo "::notice::update.json attached to $tag"

      - name: Publish verified draft
        env:
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          GH_TOKEN="$TOKEN" gh release publish "$tag" --repo slashinchi/TVBoxOS-Mobile
          echo "::notice::Release $tag published"

      - name: Verify immutable Release and assets
        env:
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          expected_apk="${{ steps.identity.outputs.EXPECTED_APK }}"
          if GH_TOKEN="$TOKEN" gh release verify "$tag" --repo slashinchi/TVBoxOS-Mobile 2>/dev/null; then
            echo "::notice::release attestation verified for $tag"
          else
            # Release-level attestation may not exist yet for the first release;
            # fall back to explicit tag/target/assets digest verification.
            echo "::warning::gh release verify unavailable (no release attestation yet); verifying identity manually"
            state=$(GH_TOKEN="$TOKEN" gh release view "$tag" --repo slashinchi/TVBoxOS-Mobile --json tagName,targetCommitish,assets --jq '{tag:.tagName,target:.targetCommitish,assets:[.assets[].name]}')
            [[ "$(jq -r '.tag' <<<"$state")" == "$tag" ]] || { echo "::error::release tag mismatch"; exit 1; }
            [[ "$(jq -r '.target' <<<"$state")" == "${{ steps.identity.outputs.RELEASE_SHA }}" ]] || { echo "::error::release target SHA mismatch"; exit 1; }
            names=$(jq -r '.assets | sort | join(",")' <<<"$state")
            expected_names="${{ steps.assets.outputs.asset_name }},update.json"
            [[ "$names" == "$expected_names" ]] || { echo "::error::release asset set mismatch: $names"; exit 1; }
          fi
          if GH_TOKEN="$TOKEN" gh release verify-asset "$tag" \
            --repo slashinchi/TVBoxOS-Mobile \
            "$RUNNER_TEMP/assets/${{ steps.assets.outputs.asset_name }}" 2>/dev/null; then
            echo "::notice::asset attestation verified for $tag"
          else
            actual=$(sha256sum "$RUNNER_TEMP/assets/${{ steps.assets.outputs.asset_name }}" | awk '{print $1}')
            [[ "$actual" == "$expected_apk" ]] || { echo "::error::signed APK digest mismatch after publish"; exit 1; }
            echo "::warning::asset attestation unavailable; digest verified manually ($actual)"
          fi
          echo "::notice::immutable verification passed for $tag"

      - name: Delivery check against proxy URL
        env:
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          expected="${{ steps.identity.outputs.EXPECTED_APK }}"
          apk_url="https://gh.xxooo.cf/https://github.com/slashinchi/TVBoxOS-Mobile/releases/download/${tag}/TVBox-Mobile-v${{ steps.identity.outputs.EXPECTED_VERSION }}.apk"
          proxy_file="$RUNNER_TEMP/proxy.apk"
          for attempt in 1 2 3; do
            if curl -fsSL --connect-timeout 15 --max-time 120 -o "$proxy_file" "$apk_url"; then
              break
            fi
            [[ "$attempt" -lt 3 ]] || { echo "::error::delivery proxy fetch failed"; exit 1; }
            sleep 5
          done
          actual=$(sha256sum "$proxy_file" | awk '{print $1}')
          verified=$(python3 scripts/u2_publish.py delivery-compare \
            --url "$apk_url" \
            --expected-sha "$expected" \
            --fetched-sha "$actual" | jq -r '.verified')
          [[ "$verified" == "true" ]] || {
            echo "::error::delivery proxy bytes do not match signed RC ($actual != $expected)";
            gh issue create --repo slashinchi/TVBoxOS-Mobile \
              --title "release-delivery: v${{ steps.identity.outputs.EXPECTED_VERSION }} proxy digest mismatch" \
              --body "Release tag $tag. Expected $expected, got $actual."
            exit 1
          }
          echo "::notice::delivery proxy verified for $tag"

      - name: Reconcile root update.json monotonically
        env:
          EXPECTED_VERSION: ${{ steps.identity.outputs.EXPECTED_VERSION }}
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$TOKEN" ]] || { echo "::error::release token missing"; exit 1; }
          current_version=$(jq -r '.version // ""' update.json 2>/dev/null || echo "")
          cand_version="$EXPECTED_VERSION"
          newer=$(python3 scripts/u2_publish.py monotonic-compare \
            --current-version "$current_version" \
            --candidate-version "$cand_version" | jq -r '.newer')
          [[ "$newer" == "true" ]] || { echo "::error::candidate version is older than current update.json"; exit 1; }
          apk_url="https://gh.xxooo.cf/https://github.com/slashinchi/TVBoxOS-Mobile/releases/download/v${cand_version}/TVBox-Mobile-v${cand_version}.apk"
          python3 scripts/u2_publish.py build-update-json \
            --version "$cand_version" \
            --apk-url "$apk_url" \
            --output update.json
          git config user.name "TVBox U2 Publish"
          git config user.email "u2-publish@users.noreply.github.com"
          git add update.json
          git commit -m "chore: update metadata to v${cand_version}"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/patched
          [[ "$(git show HEAD:update.json | jq -r '.version')" == "$cand_version" ]] || {
            echo "::error::update.json readback mismatch after commit"; exit 1;
          }
          echo "::notice::root update.json reconciled to v${cand_version}"

      - name: Clean up disposable prep ref
        env:
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$TOKEN" ]] || { echo "::error::release token missing"; exit 1; }
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            ":refs/heads/u2-prep-${SOURCE_SHA}" 2>/dev/null || true
          echo "::notice::prep ref u2-prep-${SOURCE_SHA} cleaned"

  canary_publish:
    name: Draft-only canary publish
    needs: [gate, qualify, build_rc]
    if: needs.gate.outputs.enabled == 'true' && needs.build_rc.result == 'success' && needs.qualify.outputs.canary == 'true'
    runs-on: ubuntu-24.04
    environment: release-production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out patched
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/heads/patched
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact signed APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build_rc.outputs.signed_artifact_id }}
          path: ${{ runner.temp }}/signed-output
      - name: Create draft-only canary release (idempotent)
        id: canary
        env:
          RELEASE_SHA: ${{ needs.qualify.outputs.release_sha }}
          EXPECTED_VERSION: ${{ needs.qualify.outputs.expected_version_name }}
          EXPECTED_DEBT: ${{ needs.qualify.outputs.release_debt }}
          EXPECTED_APK: ${{ needs.build_rc.outputs.signed_sha256 }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          INJECT: ${{ vars.TVBOX_CANARY_INJECT }}
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$TOKEN" ]] || { echo "::error::release token missing"; exit 1; }
          [[ -n "$EXPECTED_VERSION" ]] || { echo "::error::canary requires an expected version"; exit 1; }
          signed="$RUNNER_TEMP/signed-output/signed.apk"
          test -f "$signed" || { echo "::error::signed.apk missing from canary download"; exit 1; }
          actual=$(sha256sum "$signed" | awk '{print $1}')
          [[ "$actual" == "$EXPECTED_APK" ]] || {
            echo "::error::canary signed APK digest mismatch: $actual != $EXPECTED_APK"; exit 1;
          }
          echo "::notice::canary signed APK digest verified: $actual"
          asset_name="TVBox-Mobile-v${EXPECTED_VERSION}.apk"
          mkdir -p "$RUNNER_TEMP/canary-assets"
          cp "$signed" "$RUNNER_TEMP/canary-assets/$asset_name"
          tag="u2-canary-${RUN_ID}-attempt${RUN_ATTEMPT}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          # Failure injections (env-gated): missing asset then repair; extra asset then reject.
          case "${INJECT:-none}" in
            missing-asset)
              echo "::notice::injecting missing-asset scenario (draft without APK)"
              GH_TOKEN="$TOKEN" gh release create "$tag" \
                --repo slashinchi/TVBoxOS-Mobile \
                --draft \
                --target "$RELEASE_SHA" \
                --title "U2 canary $tag" \
                --notes "Draft-only U2 canary (missing-asset injection). release=$RELEASE_SHA version=$EXPECTED_VERSION debt=${EXPECTED_DEBT:-none} run=$RUN_ID attempt=$RUN_ATTEMPT. Not published; disposable."
              state=$(GH_TOKEN="$TOKEN" gh release view "$tag" --repo slashinchi/TVBoxOS-Mobile --json assets --jq '.assets | length')
              [[ "$state" -eq 0 ]] || { echo "::error::missing-asset injection unexpectedly has assets"; exit 1; }
              GH_TOKEN="$TOKEN" gh release upload "$tag" \
                --repo slashinchi/TVBoxOS-Mobile \
                --clobber \
                "$RUNNER_TEMP/canary-assets/$asset_name"
              state=$(GH_TOKEN="$TOKEN" gh release view "$tag" --repo slashinchi/TVBoxOS-Mobile --json assets --jq '.assets | length')
              [[ "$state" -eq 1 ]] || { echo "::error::repair after missing-asset injection failed"; exit 1; }
              echo "::notice::missing-asset repair verified (asset count $state)"
              ;;
            extra-asset)
              echo "::notice::injecting extra-asset scenario (draft with stale extra file)"
              printf 'stale' > "$RUNNER_TEMP/canary-assets/stale.txt"
              GH_TOKEN="$TOKEN" gh release create "$tag" \
                --repo slashinchi/TVBoxOS-Mobile \
                --draft \
                --target "$RELEASE_SHA" \
                --title "U2 canary $tag" \
                --notes "Draft-only U2 canary (extra-asset injection). release=$RELEASE_SHA version=$EXPECTED_VERSION debt=${EXPECTED_DEBT:-none} run=$RUN_ID attempt=$RUN_ATTEMPT. Not published; disposable." \
                "$RUNNER_TEMP/canary-assets/$asset_name" "$RUNNER_TEMP/canary-assets/stale.txt"
              names=$(GH_TOKEN="$TOKEN" gh release view "$tag" --repo slashinchi/TVBoxOS-Mobile --json assets --jq '[.assets[].name] | sort | join(",")')
              [[ "$names" == "$asset_name,stale.txt" || "$names" == "stale.txt,$asset_name" ]] || {
                echo "::error::extra-asset injection asset set unexpected: $names"; exit 1;
              }
              GH_TOKEN="$TOKEN" gh release delete-asset "$tag" \
                --repo slashinchi/TVBoxOS-Mobile \
                --yes \
                --name stale.txt
              state=$(GH_TOKEN="$TOKEN" gh release view "$tag" --repo slashinchi/TVBoxOS-Mobile --json assets --jq '.assets | length')
              [[ "$state" -eq 1 ]] || { echo "::error::extra-asset rejection failed"; exit 1; }
              echo "::notice::extra-asset rejection verified (asset count $state)"
              ;;
            stale-rc)
              echo "::notice::injecting stale-RC scenario (newer merge supersedes this RC)"
              newer_sha=$(git rev-list --max-count=1 origin/patched 2>/dev/null || echo "")
              if [[ -n "$newer_sha" && "$newer_sha" != "$RELEASE_SHA" ]]; then
                echo "::error::stale-RC injection: patched has advanced past this RC; draft must not be created"
                echo "stale=true" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              echo "::notice::stale-RC injection not applicable (patched still at release SHA)"
              ;;
            delivery-proxy)
              echo "::notice::injecting delivery-proxy failure scenario (wrong bytes)"
              apk_url="https://gh.xxooo.cf/https://github.com/slashinchi/TVBoxOS-Mobile/releases/download/${tag}/TVBox-Mobile-v${EXPECTED_VERSION}.apk"
              if curl -fsSL --connect-timeout 10 --max-time 60 -o "$RUNNER_TEMP/proxy-mismatch.bin" "$apk_url" 2>/dev/null; then
                bad=$(sha256sum "$RUNNER_TEMP/proxy-mismatch.bin" | awk '{print $1}')
                verified=$(python3 scripts/u2_publish.py delivery-compare \
                  --url "$apk_url" \
                  --expected-sha "$EXPECTED_APK" \
                  --fetched-sha "$bad" | jq -r '.verified')
                [[ "$verified" == "true" ]] && {
                  echo "::error::delivery-proxy injection unexpectedly matched"; exit 1;
                }
                echo "::notice::delivery-proxy mismatch detected as expected"
              else
                echo "::notice::delivery-proxy injection: proxy unreachable for canary tag (expected while draft-only)"
              fi
              ;;
            *)
              GH_TOKEN="$TOKEN" gh release create "$tag" \
                --repo slashinchi/TVBoxOS-Mobile \
                --draft \
                --target "$RELEASE_SHA" \
                --title "U2 canary $tag" \
                --notes "Draft-only U2 canary. release=$RELEASE_SHA version=$EXPECTED_VERSION debt=${EXPECTED_DEBT:-none} run=$RUN_ID attempt=$RUN_ATTEMPT. Not published; disposable." \
                "$RUNNER_TEMP/canary-assets/$asset_name"
              echo "::notice::canary draft created: $tag with asset $asset_name"
              ;;
          esac

      - name: Clean up canary draft and tag (always)
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$TOKEN" ]] || { echo "::error::release token missing"; exit 1; }
          tag="u2-canary-${RUN_ID}-attempt${RUN_ATTEMPT}"
          if GH_TOKEN="$TOKEN" gh release view "$tag" --repo slashinchi/TVBoxOS-Mobile >/dev/null 2>&1; then
            GH_TOKEN="$TOKEN" gh release delete "$tag" --repo slashinchi/TVBoxOS-Mobile --yes --cleanup-tag
            echo "::notice::canary draft and tag removed: $tag"
          else
            echo "::notice::canary draft $tag not found; nothing to clean"
          fi
