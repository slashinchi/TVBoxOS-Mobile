name: TVBox U2 Release Orchestrator

on:
  workflow_dispatch:
    inputs:
      canary_mode:
        description: 'Draft-only canary: build RC and create a draft release without publishing (requires actor slashinchi)'
        required: false
        default: 'false'
        type: boolean
  push:
    branches:
      - patched

permissions:
  contents: read

jobs:
  gate:
    name: U2 enabled gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      mode: ${{ steps.gate.outputs.mode }}
      source_sha: ${{ steps.gate.outputs.source_sha }}
    steps:
      - id: gate
        env:
          U2_ENABLED: ${{ vars.TVBOX_U2_ENABLED }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
          CANARY: ${{ github.event.inputs.canary_mode }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" ]]; then
            [[ "$REF" == "refs/heads/patched" ]] || { echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0; }
            [[ "${U2_ENABLED:-}" == "true" ]] || {
              echo "U2 is disabled (TVBOX_U2_ENABLED is not 'true'). No release work is performed."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            }
            echo "mode=auto-upstream" >> "$GITHUB_OUTPUT"
            echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            [[ "$ACTOR" == "slashinchi" ]] || {
              echo "::error::manual dispatch requires actor slashinchi"
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 1
            }
            if [[ "${CANARY:-false}" == "true" ]]; then
              echo "Canary mode: draft-only, no publish."
              echo "mode=canary" >> "$GITHUB_OUTPUT"
            else
              [[ "${U2_ENABLED:-}" == "true" ]] || {
                echo "U2 is disabled (TVBOX_U2_ENABLED is not 'true'). No release work is performed."
                echo "enabled=false" >> "$GITHUB_OUTPUT"
                exit 0
              }
              echo "mode=manual-local" >> "$GITHUB_OUTPUT"
            fi
            echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  qualify:
    name: Qualify release intent
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.qualify.outputs.source_sha }}
      release_sha: ${{ steps.qualify.outputs.release_sha }}
      mode: ${{ steps.qualify.outputs.mode }}
      expected_version_name: ${{ steps.qualify.outputs.expected_version_name }}
      expected_version_code: ${{ steps.qualify.outputs.expected_version_code }}
      release_debt: ${{ steps.qualify.outputs.release_debt }}
    steps:
      - name: Check out patched
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/heads/patched
          fetch-depth: 0
          persist-credentials: false
      - id: qualify
        env:
          MODE: ${{ needs.gate.outputs.mode }}
          SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
        run: |
          set -euo pipefail
          echo "Qualifying ${MODE} release intent at ${SOURCE_SHA}"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "release_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          pipeline_mode="$MODE"
          if [[ "$MODE" == "canary" ]]; then
            pipeline_mode="manual-local"
          fi
          echo "mode=$pipeline_mode" >> "$GITHUB_OUTPUT"
          version_json=$(python3 scripts/u2_release.py parse-app-version --file app/build.gradle)
          version_name=$(jq -r '.versionName' <<<"$version_json")
          version_code=$(jq -r '.versionCode' <<<"$version_json")
          echo "expected_version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "expected_version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "release_debt=" >> "$GITHUB_OUTPUT"

  build_rc:
    name: Build exact signed RC
    needs: [gate, qualify]
    if: needs.gate.outputs.enabled == 'true'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/rc-pipeline.yml
    with:
      release_sha: ${{ needs.qualify.outputs.release_sha }}
      source_sha: ${{ needs.qualify.outputs.source_sha }}
      mode: ${{ needs.qualify.outputs.mode }}
      upstream_sha: ''
      upstream_version: ''
      upstream_code: ''
      expected_version_name: ${{ needs.qualify.outputs.expected_version_name }}
      expected_version_code: ${{ needs.qualify.outputs.expected_version_code }}
      release_debt: ${{ needs.qualify.outputs.release_debt }}
      candidate_pr: ''
      provenance_marker: ''
    secrets: inherit

  publish:
    name: Production approval and exact immutable publish
    needs: [gate, qualify, build_rc]
    if: needs.gate.outputs.enabled == 'true' && needs.build_rc.result == 'success' && needs.gate.outputs.mode != 'canary'
    runs-on: ubuntu-24.04
    environment: release-production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out patched
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/heads/patched
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release identity and approval binding
        id: identity
        env:
          RELEASE_SHA: ${{ needs.qualify.outputs.release_sha }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          MODE: ${{ needs.qualify.outputs.mode }}
          EXPECTED_VERSION: ${{ needs.qualify.outputs.expected_version_name }}
          EXPECTED_DEBT: ${{ needs.qualify.outputs.release_debt }}
          EXPECTED_APK: ${{ needs.build_rc.outputs.signed_sha256 }}
          SIGNER_SHA: ${{ needs.build_rc.outputs.signer_sha256 }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$TOKEN" ]] || { echo "::error::release token missing from release-production"; exit 1; }
          [[ "$EXPECTED_APK" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::signed APK SHA-256 is invalid"; exit 1; }
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_VERSION=$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_DEBT=$EXPECTED_DEBT" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_APK=$EXPECTED_APK" >> "$GITHUB_OUTPUT"
          echo "SIGNER_SHA=$SIGNER_SHA" >> "$GITHUB_OUTPUT"
          echo "Release identity validated: $EXPECTED_VERSION at $RELEASE_SHA (apk $EXPECTED_APK)"

  canary_publish:
    name: Draft-only canary publish
    needs: [gate, qualify, build_rc]
    if: needs.gate.outputs.enabled == 'true' && needs.build_rc.result == 'success' && needs.gate.outputs.mode == 'canary'
    runs-on: ubuntu-24.04
    environment: release-production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out patched
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/heads/patched
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact signed APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build_rc.outputs.signed_artifact_id }}
          path: ${{ runner.temp }}/signed-output
      - name: Create draft-only canary release
        env:
          RELEASE_SHA: ${{ needs.qualify.outputs.release_sha }}
          EXPECTED_VERSION: ${{ needs.qualify.outputs.expected_version_name }}
          EXPECTED_DEBT: ${{ needs.qualify.outputs.release_debt }}
          EXPECTED_APK: ${{ needs.build_rc.outputs.signed_sha256 }}
          RUN_ID: ${{ github.run_id }}
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$TOKEN" ]] || { echo "::error::release token missing"; exit 1; }
          [[ -n "$EXPECTED_VERSION" ]] || { echo "::error::canary requires an expected version"; exit 1; }
          signed="$RUNNER_TEMP/signed-output/signed.apk"
          test -f "$signed" || { echo "::error::signed.apk missing from canary download"; exit 1; }
          actual=$(sha256sum "$signed" | awk '{print $1}')
          [[ "$actual" == "$EXPECTED_APK" ]] || {
            echo "::error::canary signed APK digest mismatch: $actual != $EXPECTED_APK"; exit 1;
          }
          echo "::notice::canary signed APK digest verified: $actual"
          tag="u2-canary-${RUN_ID}"
          GH_TOKEN="$TOKEN" gh release create "$tag" \
            --repo slashinchi/TVBoxOS-Mobile \
            --draft \
            --target "$RELEASE_SHA" \
            --title "U2 canary $tag" \
            --notes "Draft-only U2 canary. release=$RELEASE_SHA version=$EXPECTED_VERSION debt=${EXPECTED_DEBT:-none} run=$RUN_ID. Not published; disposable." \
            "$signed"
          echo "::notice::canary draft created: $tag"
