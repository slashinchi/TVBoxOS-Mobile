name: TVBox U2 Release Orchestrator

on:
  workflow_dispatch:
    inputs:
      canary_mode:
        description: 'Draft-only canary: build RC and create a draft release without publishing (requires actor slashinchi)'
        required: false
        default: 'false'
        type: boolean
  push:
    branches:
      - patched

permissions:
  contents: read

jobs:
  gate:
    name: U2 enabled gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      mode: ${{ steps.gate.outputs.mode }}
      source_sha: ${{ steps.gate.outputs.source_sha }}
    steps:
      - id: gate
        env:
          U2_ENABLED: ${{ vars.TVBOX_U2_ENABLED }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
          CANARY: ${{ github.event.inputs.canary_mode }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" ]]; then
            [[ "$REF" == "refs/heads/patched" ]] || { echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0; }
            [[ "${U2_ENABLED:-}" == "true" ]] || {
              echo "U2 is disabled (TVBOX_U2_ENABLED is not 'true'). No release work is performed."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            }
            echo "mode=auto-upstream" >> "$GITHUB_OUTPUT"
            echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            [[ "$ACTOR" == "slashinchi" ]] || {
              echo "::error::manual dispatch requires actor slashinchi"
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 1
            }
            [[ "${U2_ENABLED:-}" == "true" ]] || {
              echo "U2 is disabled (TVBOX_U2_ENABLED is not 'true'). Canary and manual release are both gated."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            }
            if [[ "${CANARY:-false}" == "true" ]]; then
              echo "Canary mode: draft-only, no publish."
              echo "mode=canary" >> "$GITHUB_OUTPUT"
            else
              echo "mode=manual-local" >> "$GITHUB_OUTPUT"
            fi
            echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  qualify:
    name: Qualify release intent
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.qualify.outputs.source_sha }}
      release_sha: ${{ steps.qualify.outputs.release_sha }}
      mode: ${{ steps.qualify.outputs.mode }}
      expected_version_name: ${{ steps.qualify.outputs.expected_version_name }}
      expected_version_code: ${{ steps.qualify.outputs.expected_version_code }}
      release_debt: ${{ steps.qualify.outputs.release_debt }}
      noop: ${{ steps.qualify.outputs.noop }}
      baseline_tag: ${{ steps.qualify.outputs.baseline_tag }}
      debt_classification: ${{ steps.qualify.outputs.debt_classification }}
      qualified: ${{ steps.qualify.outputs.qualified }}
      canary: ${{ steps.qualify.outputs.canary }}
    steps:
      - name: Check out patched
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/heads/patched
          fetch-depth: 0
          persist-credentials: false
      - id: qualify
        env:
          MODE: ${{ needs.gate.outputs.mode }}
          SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
          NOOP: ${{ vars.TVBOX_U2_NOOP }}
        run: |
          set -euo pipefail
          chmod +x scripts/u2_qualify.sh
          bash scripts/u2_qualify.sh
          qualified=$(grep '^qualified=' "$GITHUB_OUTPUT" | cut -d= -f2)
          if [[ "$MODE" == "canary" ]]; then
            echo "Canary mode: forcing qualified=true for draft-only RC build."
            echo "qualified=true" >> "$GITHUB_OUTPUT"
            echo "canary=true" >> "$GITHUB_OUTPUT"
          else
            echo "canary=false" >> "$GITHUB_OUTPUT"
          fi
          # u2_qualify.sh emits the rc-pipeline-compatible mode
          # (canary -> manual-local; auto-upstream/manual-local preserved).

  build_rc:
    name: Build exact signed RC
    needs: [gate, qualify]
    if: needs.gate.outputs.enabled == 'true' && needs.qualify.outputs.qualified == 'true'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/rc-pipeline.yml
    with:
      release_sha: ${{ needs.qualify.outputs.release_sha }}
      source_sha: ${{ needs.qualify.outputs.source_sha }}
      mode: ${{ needs.qualify.outputs.mode }}
      upstream_sha: ''
      upstream_version: ''
      upstream_code: ''
      expected_version_name: ${{ needs.qualify.outputs.expected_version_name }}
      expected_version_code: ${{ needs.qualify.outputs.expected_version_code }}
      release_debt: ${{ needs.qualify.outputs.release_debt }}
      candidate_pr: ''
      provenance_marker: ''
    secrets: inherit

  publish:
    name: Production approval and exact immutable publish
    needs: [gate, qualify, build_rc]
    if: needs.gate.outputs.enabled == 'true' && needs.build_rc.result == 'success' && needs.qualify.outputs.canary != 'true'
    runs-on: ubuntu-24.04
    environment: release-production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out patched
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/heads/patched
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release identity and approval marker binding
        id: identity
        env:
          RELEASE_SHA: ${{ needs.qualify.outputs.release_sha }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          MODE: ${{ needs.qualify.outputs.mode }}
          EXPECTED_VERSION: ${{ needs.qualify.outputs.expected_version_name }}
          EXPECTED_DEBT: ${{ needs.qualify.outputs.release_debt }}
          EXPECTED_APK: ${{ needs.build_rc.outputs.signed_sha256 }}
          SIGNER_SHA: ${{ needs.build_rc.outputs.signer_sha256 }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$TOKEN" ]] || { echo "::error::release token missing from release-production"; exit 1; }
          [[ "$EXPECTED_APK" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::signed APK SHA-256 is invalid"; exit 1; }
          [[ -n "$EXPECTED_DEBT" && "$EXPECTED_DEBT" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::release debt fingerprint is empty or invalid"; exit 1;
          }
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_VERSION=$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_DEBT=$EXPECTED_DEBT" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_APK=$EXPECTED_APK" >> "$GITHUB_OUTPUT"
          echo "SIGNER_SHA=$SIGNER_SHA" >> "$GITHUB_OUTPUT"
          expected_marker="TVBOX_RELEASE_APPROVE_V2 release=${RELEASE_SHA} debt=${EXPECTED_DEBT} version=${EXPECTED_VERSION} apk=${EXPECTED_APK} run=${RUN_ID} attempt=${RUN_ATTEMPT}"
          echo "expected_marker=$expected_marker" >> "$GITHUB_OUTPUT"
          echo "::notice::Release identity validated: $EXPECTED_VERSION at $RELEASE_SHA (apk $EXPECTED_APK)"

      - name: Verify approval marker from deployment review history
        id: approval
        env:
          RUN_ID: ${{ github.run_id }}
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$TOKEN" ]] || { echo "::error::release token missing"; exit 1; }
          approvals=$(gh api "repos/slashinchi/TVBoxOS-Mobile/actions/runs/${RUN_ID}/approvals" --jq '[.[] | select(.state=="approved" and .environments[]?.name=="release-production")]')
          [[ -n "$approvals" && "$approvals" != "[]" ]] || {
            echo "::error::no release-production approval found for run ${RUN_ID}"; exit 1;
          }
          comment=$(jq -r '.[0].comment // ""' <<<"$approvals")
          [[ -n "$comment" ]] || { echo "::error::approval comment is empty; exact marker required"; exit 1; }
          matched=$(python3 scripts/u2_release.py approval-matches \
            --marker "$comment" \
            --release-sha "${{ steps.identity.outputs.RELEASE_SHA }}" \
            --debt "${{ steps.identity.outputs.EXPECTED_DEBT }}" \
            --version "${{ steps.identity.outputs.EXPECTED_VERSION }}" \
            --apk "${{ steps.identity.outputs.EXPECTED_APK }}" \
            --run "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}")
          jq -e '.matched == true' <<<"$matched" >/dev/null || {
            echo "::error::approval marker does not match the exact release identity"; exit 1;
          }
          echo "::notice::exact approval marker verified for run ${RUN_ID} attempt ${RUN_ATTEMPT}"

  canary_publish:
    name: Draft-only canary publish
    needs: [gate, qualify, build_rc]
    if: needs.gate.outputs.enabled == 'true' && needs.build_rc.result == 'success' && needs.qualify.outputs.canary == 'true'
    runs-on: ubuntu-24.04
    environment: release-production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out patched
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/heads/patched
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact signed APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build_rc.outputs.signed_artifact_id }}
          path: ${{ runner.temp }}/signed-output
      - name: Create draft-only canary release
        env:
          RELEASE_SHA: ${{ needs.qualify.outputs.release_sha }}
          EXPECTED_VERSION: ${{ needs.qualify.outputs.expected_version_name }}
          EXPECTED_DEBT: ${{ needs.qualify.outputs.release_debt }}
          EXPECTED_APK: ${{ needs.build_rc.outputs.signed_sha256 }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$TOKEN" ]] || { echo "::error::release token missing"; exit 1; }
          [[ -n "$EXPECTED_VERSION" ]] || { echo "::error::canary requires an expected version"; exit 1; }
          signed="$RUNNER_TEMP/signed-output/signed.apk"
          test -f "$signed" || { echo "::error::signed.apk missing from canary download"; exit 1; }
          actual=$(sha256sum "$signed" | awk '{print $1}')
          [[ "$actual" == "$EXPECTED_APK" ]] || {
            echo "::error::canary signed APK digest mismatch: $actual != $EXPECTED_APK"; exit 1;
          }
          echo "::notice::canary signed APK digest verified: $actual"
          asset_name="TVBox-Mobile-v${EXPECTED_VERSION}.apk"
          cp "$signed" "$RUNNER_TEMP/$asset_name"
          tag="u2-canary-${RUN_ID}-attempt${RUN_ATTEMPT}"
          GH_TOKEN="$TOKEN" gh release create "$tag" \
            --repo slashinchi/TVBoxOS-Mobile \
            --draft \
            --target "$RELEASE_SHA" \
            --title "U2 canary $tag" \
            --notes "Draft-only U2 canary. release=$RELEASE_SHA version=$EXPECTED_VERSION debt=${EXPECTED_DEBT:-none} run=$RUN_ID attempt=$RUN_ATTEMPT. Not published; disposable." \
            "$RUNNER_TEMP/$asset_name"
          echo "::notice::canary draft created: $tag with asset $asset_name"
