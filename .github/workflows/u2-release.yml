name: TVBox U2 Release Orchestrator

on:
  workflow_dispatch:
  push:
    branches:
      - patched

permissions:
  contents: read

jobs:
  gate:
    name: U2 enabled gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      mode: ${{ steps.gate.outputs.mode }}
      source_sha: ${{ steps.gate.outputs.source_sha }}
    steps:
      - id: gate
        env:
          U2_ENABLED: ${{ vars.TVBOX_U2_ENABLED }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" ]]; then
            [[ "$REF" == "refs/heads/patched" ]] || { echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0; }
            [[ "${U2_ENABLED:-}" == "true" ]] || {
              echo "U2 is disabled (TVBOX_U2_ENABLED is not 'true'). No release work is performed."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            }
            echo "mode=auto-upstream" >> "$GITHUB_OUTPUT"
            echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            [[ "$ACTOR" == "slashinchi" ]] || {
              echo "::error::manual dispatch requires actor slashinchi"
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 1
            }
            [[ "$REF" == "refs/heads/patched" ]] || {
              echo "::error::manual dispatch must target current live patched HEAD"
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 1
            }
            [[ "${U2_ENABLED:-}" == "true" ]] || {
              echo "U2 is disabled (TVBOX_U2_ENABLED is not 'true'). Manual release is gated."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            }
            echo "mode=manual-local" >> "$GITHUB_OUTPUT"
            echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  qualify:
    name: Qualify release intent
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    outputs:
      source_sha: ${{ steps.qualify.outputs.source_sha }}
      release_sha: ${{ steps.qualify.outputs.release_sha }}
      mode: ${{ steps.qualify.outputs.mode }}
      expected_version_name: ${{ steps.qualify.outputs.expected_version_name }}
      expected_version_code: ${{ steps.qualify.outputs.expected_version_code }}
      release_debt: ${{ steps.qualify.outputs.release_debt }}
      noop: ${{ steps.qualify.outputs.noop }}
      baseline_tag: ${{ steps.qualify.outputs.baseline_tag }}
      debt_classification: ${{ steps.qualify.outputs.debt_classification }}
      qualified: ${{ steps.qualify.outputs.qualified }}
      upstream_sha: ${{ steps.qualify.outputs.upstream_sha }}
      upstream_version: ${{ steps.qualify.outputs.upstream_version }}
      upstream_code: ${{ steps.qualify.outputs.upstream_code }}
      candidate_pr: ${{ steps.qualify.outputs.candidate_pr }}
      provenance_marker: ${{ steps.qualify.outputs.provenance_marker }}
    steps:
      - name: Check out patched
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/heads/patched
          fetch-depth: 0
          persist-credentials: false
      - id: qualify
        env:
          MODE: ${{ needs.gate.outputs.mode }}
          SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
          NOOP: ${{ vars.TVBOX_U2_NOOP }}
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/u2_qualify.sh
          bash scripts/u2_qualify.sh
          if [[ "$MODE" == "auto-upstream" ]]; then
            # Non-U1 push debt watcher: open one deduplicated local-release-debt Issue.
            watch_debt() {
              local reason="$1"
              local debt version baseline classification
              debt=$(grep '^release_debt=' "$GITHUB_OUTPUT" | head -1 | cut -d= -f2)
              version=$(grep '^expected_version_name=' "$GITHUB_OUTPUT" | head -1 | cut -d= -f2)
              baseline=$(grep '^baseline_tag=' "$GITHUB_OUTPUT" | head -1 | cut -d= -f2)
              classification=$(grep '^debt_classification=' "$GITHUB_OUTPUT" | head -1 | cut -d= -f2)
              if [[ "$classification" == "docs-only" ]]; then
                return 0
              fi
              local title="local-release-debt: ${baseline} -> patched (${classification})"
              local existing
              existing=$(gh issue list --repo "$REPO" --search "in:title \"${title}\"" --state open --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
              if [[ -n "$existing" ]]; then
                echo "::notice::local-release-debt issue already open: #${existing}"
                return 0
              fi
              gh issue create --repo "$REPO" \
                --title "$title" \
                --body "Non-U1 push to patched carries unabsorbed release debt.

                - Mode: auto-upstream (rejected: ${reason})
                - Source: $SOURCE_SHA
                - Baseline: $baseline
                - Debt fingerprint: $debt
                - Classification: $classification
                - Planned version: ${version:-none}

                U2 cannot build an RC from this push because it is not a valid U1 merge.
                Open until the debt is absorbed by a qualified U1 merge or manual-local release."
              echo "::notice::local-release-debt issue opened for ${SOURCE_SHA}"
            }
            # Strict U1 qualification: only a real U1 candidate merge qualifies.
            parents=$(git rev-list --parents -n 1 "$PUSH_AFTER" | awk '{for(i=2;i<=NF;i++) printf "%s%s", sep, $i; sep=" "}')
            candidate=$(echo "$parents" | awk '{print $2}')
            # Find the associated PR merged at exactly this merge commit.
            pr=$(gh api "repos/${REPO}/commits/${PUSH_AFTER}/pulls" --jq '.[0] // empty' 2>/dev/null || echo "")
            if [[ -z "$pr" || -z "$candidate" ]]; then
              echo "::error::auto-upstream requires an associated U1 PR and merge parents"
              watch_debt "missing-associated-pr"
              sed -i '/^qualified=/d' "$GITHUB_OUTPUT"
              echo "qualified=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            pr_json=$(echo "$pr" | jq -c '{number,state,merged_at:.merged_at,base:(.base // {}),merged_by:(.merged_by.login // ""),author:(.user.login // ""),head_repository:(.head.repo.full_name // ""),head:(.head.ref // ""),head_sha:(.head.sha // ""),merge_commit_sha:.merge_commit_sha}')
            # For provenance, read the marker embedded in the PR body.
            marker=$(echo "$pr" | jq -r '.body // ""' | grep -o '<!-- tvbox-upstream-candidate-v2 .* -->' | head -1)
            parsed=$(python3 scripts/u2_release.py parse-provenance-marker --marker "$marker" 2>/dev/null || echo "")
            if [[ -z "$parsed" ]]; then
              echo "::error::auto-upstream PR missing valid v2 provenance marker"
              watch_debt "missing-provenance-marker"
              sed -i '/^qualified=/d' "$GITHUB_OUTPUT"
              echo "qualified=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            upstream_sha=$(jq -r '.upstream' <<<"$parsed")
            candidate=$(jq -r '.candidate' <<<"$parsed")
            candidate_tree=$(jq -r '.tree' <<<"$parsed")
            upstream_version=$(jq -r '.upstreamVersion' <<<"$parsed")
            upstream_code=$(jq -r '.upstreamCode' <<<"$parsed")
            upstream_is_ancestor=false
            if git merge-base --is-ancestor "$upstream_sha" "$candidate" 2>/dev/null; then
              upstream_is_ancestor=true
            fi
            replay_tree="$candidate_tree"
            actual_tree=$(git rev-parse "${PUSH_AFTER}^{tree}")
            result=$(python3 scripts/u2_release.py qualify-u1 \
              --before "$PUSH_BEFORE" \
              --after "$PUSH_AFTER" \
              --parents $parents \
              --actor "$ACTOR" \
              --pr "$pr_json" \
              --repository "$REPO" \
              --upstream "$upstream_sha" \
              --marker "$marker" \
              --candidate-tree "$candidate_tree" \
              --upstream-ancestor "$upstream_is_ancestor" \
              --replay-status clean \
              --replay-tree "$replay_tree" \
              --replay-actual-tree "$actual_tree")
            if [[ "$(jq -r '.qualified' <<<"$result")" != "true" ]]; then
              reason=$(jq -r '.reason' <<<"$result")
              echo "::error::auto-upstream qualification failed: $reason"
              watch_debt "$reason"
              sed -i '/^qualified=/d' "$GITHUB_OUTPUT"
              echo "qualified=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
            echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"
            echo "upstream_code=$upstream_code" >> "$GITHUB_OUTPUT"
            echo "candidate_pr=$(jq -r '.number' <<<"$pr_json")" >> "$GITHUB_OUTPUT"
            echo "provenance_marker=$marker" >> "$GITHUB_OUTPUT"
          fi
          qualified=$(grep '^qualified=' "$GITHUB_OUTPUT" | cut -d= -f2)
          [[ -n "$qualified" ]] || { echo "::error::qualify output missing qualified"; exit 1; }
          # u2_qualify.sh emits the rc-pipeline-compatible mode.

  prep:
    name: Derive version and create prep commit
    needs: [gate, qualify]
    if: needs.gate.outputs.enabled == 'true' && needs.qualify.outputs.qualified == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: tvbox-u2-prepare
      cancel-in-progress: false
    outputs:
      release_sha: ${{ steps.prep.outputs.release_sha }}
      expected_version_name: ${{ steps.prep.outputs.expected_version_name }}
      expected_version_code: ${{ steps.prep.outputs.expected_version_code }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.qualify.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: prep
        env:
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          MODE: ${{ needs.qualify.outputs.mode }}
          UPSTREAM_SHA: ${{ needs.qualify.outputs.upstream_sha }}
          UPSTREAM_VERSION: ${{ needs.qualify.outputs.upstream_version }}
          UPSTREAM_CODE: ${{ needs.qualify.outputs.upstream_code }}
          RELEASE_DEBT: ${{ needs.qualify.outputs.release_debt }}
          CANDIDATE_PR: ${{ needs.qualify.outputs.candidate_pr }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -n "$SOURCE_SHA" && -n "$MODE" ]] || { echo "::error::prep requires source and mode"; exit 1; }
          [[ -n "$RELEASE_DEBT" && "$RELEASE_DEBT" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::prep requires a valid debt fingerprint"; exit 1; }
          if [[ "$MODE" == "manual-local" ]]; then
            # Manual-local: rc-pipeline requires release_sha == source_sha == patched;
            # the version is already present in the working tree. No prep commit.
            version_json=$(python3 scripts/u2_release.py parse-app-version --file app/build.gradle)
            echo "release_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
            echo "expected_version_name=$(jq -r '.versionName' <<<"$version_json")" >> "$GITHUB_OUTPUT"
            echo "expected_version_code=$(jq -r '.versionCode' <<<"$version_json")" >> "$GITHUB_OUTPUT"
            echo "::notice::manual-local prep: using source SHA $SOURCE_SHA as release SHA (version from working tree)"
            exit 0
          fi
          if [[ "$MODE" == "auto-upstream" ]]; then
            [[ -n "$UPSTREAM_SHA" && -n "$UPSTREAM_VERSION" && -n "$UPSTREAM_CODE" ]] || { echo "::error::auto-upstream prep requires upstream identity"; exit 1; }
            plan=$(python3 scripts/u2_release.py plan-prep \
              --upstream-name "$UPSTREAM_VERSION" \
              --upstream-code "$UPSTREAM_CODE" \
              --published-file gradle/verified-releases.json \
              --source "$SOURCE_SHA" \
              --mode "$MODE" \
              --upstream "$UPSTREAM_SHA" \
              --debt "$RELEASE_DEBT" \
              ${CANDIDATE_PR:+--pr "$CANDIDATE_PR"})
          else
            plan=$(python3 scripts/u2_release.py plan-prep \
              --upstream-name "" \
              --upstream-code 0 \
              --published-file gradle/verified-releases.json \
              --source "$SOURCE_SHA" \
              --mode "$MODE" \
              --upstream "${UPSTREAM_SHA:-0000000000000000000000000000000000000000}" \
              --debt "$RELEASE_DEBT")
          fi
          version_name=$(jq -r '.versionName' <<<"$plan")
          version_code=$(jq -r '.versionCode' <<<"$plan")
          trailers=$(jq -r '.trailers' <<<"$plan")
          # Reuse an existing exact prep ref when its identity matches, so
          # re-runs never produce a divergent prep SHA.
          existing_sha=""
          if git ls-remote --exit-code "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/u2-prep-${SOURCE_SHA}" >/dev/null 2>&1; then
            existing_sha=$(git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/u2-prep-${SOURCE_SHA}" | awk '{print $1}')
            existing_trailers=""
            if git cat-file -e "$existing_sha" 2>/dev/null || git fetch --no-tags origin "+refs/heads/u2-prep-${SOURCE_SHA}:refs/remotes/origin/u2-prep-${SOURCE_SHA}" 2>/dev/null; then
              existing_trailers=$(git log -1 --format=%B "$existing_sha" | grep -E '^TVBox-U2-' || true)
            fi
            # Reuse only when the prep is an exact version-only child of the
            # source SHA: parent == SOURCE_SHA and no other path changed.
            prep_parent=$(git rev-parse "${existing_sha}^" 2>/dev/null || echo "")
            changed_paths=$(git diff-tree --no-commit-id --name-only -r "$existing_sha" 2>/dev/null | tr '\n' ' ' || echo "")
            if [[ -n "$existing_trailers" && "$existing_trailers" == "$trailers" \
              && "$prep_parent" == "$SOURCE_SHA" && "$changed_paths" == "app/build.gradle " ]]; then
              echo "::notice::reusing exact prep ref u2-prep-${SOURCE_SHA} at ${existing_sha}"
              echo "release_sha=$existing_sha" >> "$GITHUB_OUTPUT"
              echo "expected_version_name=$version_name" >> "$GITHUB_OUTPUT"
              echo "expected_version_code=$version_code" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::existing prep ref u2-prep-${SOURCE_SHA} identity mismatch (parent=$prep_parent paths=$changed_paths); refusing to delete or replace a divergent prep"
            exit 1
          fi
          # Rewrite exactly the two version fields in app/build.gradle.
          python3 scripts/u2_release.py write-prep-version \
            --file app/build.gradle \
            --version-name "$version_name" \
            --version-code "$version_code"
          git diff -- app/build.gradle
          git config user.name "TVBox U2 Prep"
          git config user.email "u2-prep@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "chore: version-only prep commit for ${version_name} (${version_code})" -m "$trailers"
          prep_sha=$(git rev-parse HEAD)
          echo "release_sha=$prep_sha" >> "$GITHUB_OUTPUT"
          echo "expected_version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "expected_version_code=$version_code" >> "$GITHUB_OUTPUT"
          # Publish the disposable prep ref so rc-pipeline can check out release_sha.
          [[ -n "$GITHUB_TOKEN" ]] || { echo "::error::GITHUB_TOKEN missing for prep ref push"; exit 1; }
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/u2-prep-${SOURCE_SHA}"
          echo "::notice::prep commit created at ${prep_sha} (version ${version_name} code ${version_code})"

  build_rc:
    name: Build exact signed RC
    needs: [gate, qualify, prep]
    if: needs.gate.outputs.enabled == 'true' && needs.qualify.outputs.qualified == 'true'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/rc-pipeline.yml
    with:
      release_sha: ${{ needs.prep.outputs.release_sha }}
      source_sha: ${{ needs.qualify.outputs.source_sha }}
      mode: ${{ needs.qualify.outputs.mode }}
      upstream_sha: ${{ needs.qualify.outputs.upstream_sha }}
      upstream_version: ${{ needs.qualify.outputs.upstream_version }}
      upstream_code: ${{ needs.qualify.outputs.upstream_code }}
      expected_version_name: ${{ needs.prep.outputs.expected_version_name }}
      expected_version_code: ${{ needs.prep.outputs.expected_version_code }}
      release_debt: ${{ needs.qualify.outputs.release_debt }}
      candidate_pr: ${{ needs.qualify.outputs.candidate_pr }}
      provenance_marker: ${{ needs.qualify.outputs.provenance_marker }}
    # No secrets: inherit. The signer inside rc-pipeline resolves its signing
    # secrets from its own `release-signing` Environment; caller secrets (e.g.
    # TVBOX_RELEASE_TOKEN) must never be passed into the RC build chain.

  rc_summary:
    name: Release evidence and approval marker
    needs: [gate, qualify, prep, build_rc]
    if: needs.gate.outputs.enabled == 'true' && needs.build_rc.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      RELEASE_SHA: ${{ steps.summary.outputs.RELEASE_SHA }}
      EXPECTED_VERSION: ${{ steps.summary.outputs.EXPECTED_VERSION }}
      EXPECTED_DEBT: ${{ steps.summary.outputs.EXPECTED_DEBT }}
      EXPECTED_APK: ${{ steps.summary.outputs.EXPECTED_APK }}
      SIGNER_SHA: ${{ steps.summary.outputs.SIGNER_SHA }}
      EXPECTED_MARKER: ${{ steps.summary.outputs.EXPECTED_MARKER }}
      SOURCE_SHA: ${{ steps.summary.outputs.SOURCE_SHA }}
      MODE: ${{ steps.summary.outputs.MODE }}
    steps:
      - name: Publish release evidence and exact approval marker (no environment)
        id: summary
        env:
          RELEASE_SHA: ${{ needs.prep.outputs.release_sha }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          MODE: ${{ needs.qualify.outputs.mode }}
          EXPECTED_VERSION: ${{ needs.prep.outputs.expected_version_name }}
          EXPECTED_DEBT: ${{ needs.qualify.outputs.release_debt }}
          EXPECTED_APK: ${{ needs.build_rc.outputs.signed_sha256 }}
          SIGNER_SHA: ${{ needs.build_rc.outputs.signer_sha256 }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_APK" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::signed APK SHA-256 is invalid"; exit 1; }
          [[ -n "$EXPECTED_DEBT" && "$EXPECTED_DEBT" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::release debt fingerprint is empty or invalid"; exit 1;
          }
          [[ -n "$RELEASE_SHA" && "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::release SHA is empty or invalid"; exit 1;
          }
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_VERSION=$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_DEBT=$EXPECTED_DEBT" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_APK=$EXPECTED_APK" >> "$GITHUB_OUTPUT"
          echo "SIGNER_SHA=$SIGNER_SHA" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "MODE=$MODE" >> "$GITHUB_OUTPUT"
          expected_marker="TVBOX_RELEASE_APPROVE_V2 release=${RELEASE_SHA} debt=${EXPECTED_DEBT} version=${EXPECTED_VERSION} apk=${EXPECTED_APK} run=${RUN_ID} attempt=${RUN_ATTEMPT}"
          echo "EXPECTED_MARKER=$expected_marker" >> "$GITHUB_OUTPUT"
          echo "::notice::Release evidence (mode=$MODE source=$SOURCE_SHA release=$RELEASE_SHA version=$EXPECTED_VERSION apk=$EXPECTED_APK signer=$SIGNER_SHA debt=$EXPECTED_DEBT run=$RUN_ID attempt=$RUN_ATTEMPT)"
          echo "::notice::Required approval marker (paste into the release-production approval comment):"
          echo "::notice::$expected_marker"
          {
            echo "## RC / Risk Summary (U2)"
            echo "- **Mode**: $MODE"
            echo "- **Release SHA**: $RELEASE_SHA"
            echo "- **Source SHA**: $SOURCE_SHA"
            echo "- **Version**: $EXPECTED_VERSION"
            echo "- **Debt fingerprint**: $EXPECTED_DEBT"
            echo "- **Signed APK SHA-256**: $EXPECTED_APK"
            echo "- **Signer fingerprint**: $SIGNER_SHA"
            echo "- **Run**: https://github.com/slashinchi/TVBoxOS-Mobile/actions/runs/$RUN_ID"
            echo "- **Approval marker**: \`$expected_marker\`"
            echo ""
            echo "Approve with the exact marker as the review comment. Any other comment is rejected."
          } >> "$GITHUB_STEP_SUMMARY"

  watch_approval:
    name: Record explicit human rejection
    needs: [gate, qualify, prep, build_rc, rc_summary, publish]
    if: always() && needs.gate.outputs.enabled == 'true' && needs.publish.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Check out patched
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/heads/patched
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for rejected reviews and open identity-bound human-blocked issue
        env:
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.rc_summary.outputs.SOURCE_SHA }}
          MODE: ${{ needs.rc_summary.outputs.MODE }}
          EXPECTED_VERSION: ${{ needs.rc_summary.outputs.EXPECTED_VERSION }}
          EXPECTED_DEBT: ${{ needs.rc_summary.outputs.EXPECTED_DEBT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -n "$SOURCE_SHA" && -n "$EXPECTED_DEBT" ]] || { echo "::notice::no release identity available; nothing to record"; exit 0; }
          approvals=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/approvals" --jq '[.[] | select(.state=="rejected" and .environments[]?.name=="release-production" and .user.login=="slashinchi")]')
          [[ -n "$approvals" && "$approvals" != "[]" ]] || {
            echo "::notice::no explicit rejection by slashinchi; nothing to record"
            exit 0
          }
          comment=$(jq -r '.[0].comment // ""' <<<"$approvals")
          key=$(python3 scripts/u2_publish.py incident-key \
            --mode "$MODE" \
            --source-sha "$SOURCE_SHA" \
            --version "$EXPECTED_VERSION" \
            --debt "$EXPECTED_DEBT" | jq -r '.key')
          title="human-blocked: ${key}"
          existing=$(gh issue list --repo "$REPO" --search "in:title \"${title}\"" --state open --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [[ -n "$existing" ]]; then
            echo "::notice::human-blocked issue already open: #${existing}"
          else
            gh issue create --repo "$REPO" \
              --title "$title" \
              --body "release-production review was explicitly rejected by slashinchi for run ${RUN_ID} (identity ${key}). Comment: ${comment:-<empty>}. This is a user rejection (human-blocked), not an operational failure."
          fi

  publish:
    name: Exact immutable publish
    needs: [gate, qualify, prep, build_rc, rc_summary]
    if: needs.gate.outputs.enabled == 'true' && needs.build_rc.result == 'success' && needs.rc_summary.result == 'success'
    runs-on: ubuntu-24.04
    environment: release-production
    concurrency:
      group: tvbox-u2-publish
      cancel-in-progress: false
      queue: max
      # Up to 100 queued publish attempts are allowed before GitHub rejects.
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Check out patched
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/heads/patched
          fetch-depth: 0
          persist-credentials: false
      - name: Load release identity
        id: identity
        run: |
          echo "RELEASE_SHA=${{ needs.rc_summary.outputs.RELEASE_SHA }}" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_VERSION=${{ needs.rc_summary.outputs.EXPECTED_VERSION }}" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_DEBT=${{ needs.rc_summary.outputs.EXPECTED_DEBT }}" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_APK=${{ needs.rc_summary.outputs.EXPECTED_APK }}" >> "$GITHUB_OUTPUT"
          echo "SIGNER_SHA=${{ needs.rc_summary.outputs.SIGNER_SHA }}" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_MARKER=${{ needs.rc_summary.outputs.EXPECTED_MARKER }}" >> "$GITHUB_OUTPUT"

      - name: Verify exact approval marker from current-run review history
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_MARKER: ${{ steps.identity.outputs.EXPECTED_MARKER }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          approvals=$(gh api "repos/slashinchi/TVBoxOS-Mobile/actions/runs/${RUN_ID}/approvals" --jq '[.[] | select(.state=="approved" and .environments[]?.name=="release-production")]')
          [[ -n "$approvals" && "$approvals" != "[]" ]] || {
            echo "::error::no release-production approval found for run ${RUN_ID}"; exit 1;
          }
          # Every approved review must be slashinchi's (the only configured
          # reviewer). Re-runs accumulate approval history for the same RUN_ID,
          # so we must not require exactly one; instead each record is checked
          # and any record that is NOT a precise current-attempt marker fails
          # closed. This keeps the gate strict while allowing retry recovery.
          count=$(jq 'length' <<<"$approvals")
          [[ "$count" -ge 1 ]] || { echo "::error::no approved release-production review"; exit 1; }
          actor_ok=true
          while IFS= read -r -d '' actor; do
            [[ "$actor" == "slashinchi" ]] || actor_ok=false
          done < <(jq -r '.[].user.login // "" + "\u0000"' <<<"$approvals")
          [[ "$actor_ok" == "true" ]] || {
            echo "::error::release-production approval actor is not slashinchi"; exit 1;
          }
          # Exactly one record must carry the current-attempt marker; older
          # attempts' approvals carry older markers and are tolerated as
          # history (the marker itself binds run+attempt).
          matched=0
          while IFS= read -r -d '' comment; do
            check=$(python3 scripts/u2_release.py approval-matches \
              --marker "$comment" \
              --release-sha "${{ steps.identity.outputs.RELEASE_SHA }}" \
              --debt "${{ steps.identity.outputs.EXPECTED_DEBT }}" \
              --version "${{ steps.identity.outputs.EXPECTED_VERSION }}" \
              --apk "${{ steps.identity.outputs.EXPECTED_APK }}" \
              --run "$RUN_ID" \
              --attempt "$RUN_ATTEMPT")
            if [[ "$(jq -r '.matched' <<<"$check")" == "true" ]]; then
              matched=$((matched + 1))
            fi
          done < <(jq -r '.[].comment // "" | gsub("\u0000"; "\n") + "\u0000"' <<<"$approvals")
          [[ "$matched" -eq 1 ]] || {
            echo "::error::expected exactly one approval marker matching this run/attempt, found $matched"; exit 1;
          }
          echo "::notice::exact approval marker verified for run ${RUN_ID} attempt ${RUN_ATTEMPT}"

      - name: Revalidate release identity and protected environment
        env:
          RELEASE_SHA: ${{ steps.identity.outputs.RELEASE_SHA }}
          EXPECTED_VERSION: ${{ steps.identity.outputs.EXPECTED_VERSION }}
          EXPECTED_DEBT: ${{ steps.identity.outputs.EXPECTED_DEBT }}
          EXPECTED_APK: ${{ steps.identity.outputs.EXPECTED_APK }}
          SIGNER_SHA: ${{ steps.identity.outputs.SIGNER_SHA }}
          SOURCE_SHA: ${{ needs.rc_summary.outputs.SOURCE_SHA }}
          MODE: ${{ needs.rc_summary.outputs.MODE }}
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -n "$TOKEN" ]] || { echo "::error::release token missing"; exit 1; }
          [[ "$EXPECTED_APK" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::signed APK SHA-256 is invalid"; exit 1; }
          [[ -n "$EXPECTED_DEBT" && "$EXPECTED_DEBT" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::debt fingerprint invalid"; exit 1; }
          [[ -n "$RELEASE_SHA" && "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release SHA invalid"; exit 1; }
          [[ -n "$SIGNER_SHA" && "$SIGNER_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::signer fingerprint invalid"; exit 1; }
          # Recompute cumulative release debt from canonical baseline against the
          # SOURCE tree (same tree the approved marker was computed on; prep only
          # touches app/build.gradle on top of it) with the SAME excludes as
          # qualify — a newer merge or changed tree invalidates the approval
          # before any mutation.
          debt_json=$(python3 scripts/u2_release.py release-debt \
            --repo "$PWD" \
            --releases-file gradle/verified-releases.json \
            --current "$SOURCE_SHA" \
            --exclude ".github/" --exclude "scripts/" --exclude "docs/" \
            --exclude "gradle/verified-releases.json" --exclude "gradle/legacy-dependencies.lock.json" \
            --exclude "AGENTS.md" --exclude "README.md" \
            --exclude "update.json")
          recomputed_debt=$(jq -r '.fingerprint' <<<"$debt_json")
          [[ "$recomputed_debt" == "$EXPECTED_DEBT" ]] || {
            echo "::error::recomputed debt $recomputed_debt != approved marker $EXPECTED_DEBT; approval is stale"; exit 1;
          }
          # Mode/identity: manual-local requires release_sha == source_sha;
          # auto-upstream requires a valid prep identity (verified in prep job).
          if [[ "$MODE" == "manual-local" ]]; then
            [[ "$RELEASE_SHA" == "$SOURCE_SHA" ]] || { echo "::error::manual-local requires release SHA == source SHA"; exit 1; }
          fi
          # Default branch must still be patched and patched == release_sha (or
          # a descendant containing it with an existing formal tag, checked later).
          default_branch=$(GH_TOKEN="$TOKEN" gh api "repos/slashinchi/TVBoxOS-Mobile" --jq '.default_branch')
          [[ "$default_branch" == "patched" ]] || { echo "::error::default branch is $default_branch, expected patched"; exit 1; }
          # The release-production environment must still exist with admin bypass off.
          env_state=$(GH_TOKEN="$TOKEN" gh api "repos/slashinchi/TVBoxOS-Mobile/environments/release-production" --jq '{name,protection_rules:.protection_rules}' 2>/dev/null || echo "")
          [[ -n "$env_state" ]] || { echo "::error::release-production environment missing"; exit 1; }
          # Repository immutable-releases setting must still be enabled BEFORE
          # any mutation; a public mutable Release must never be created.
          imm=$(GH_TOKEN="$TOKEN" gh api "repos/slashinchi/TVBoxOS-Mobile/immutable-releases" --jq '.enabled' 2>/dev/null || echo "")
          [[ "$imm" == "true" ]] || { echo "::error::repository immutable releases are not enabled"; exit 1; }
          echo "::notice::release identity revalidated (release=$RELEASE_SHA version=$EXPECTED_VERSION apk=$EXPECTED_APK signer=$SIGNER_SHA debt=$EXPECTED_DEBT recomputed=$recomputed_debt)"
          echo "::notice::default branch patched + release-production environment confirmed (immutable releases enforced per-Release post-publish)"

      - name: Promote patched to exact release SHA (CAS)
        env:
          RELEASE_SHA: ${{ steps.identity.outputs.RELEASE_SHA }}
          EXPECTED_VERSION: ${{ steps.identity.outputs.EXPECTED_VERSION }}
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$TOKEN" ]] || { echo "::error::release token missing"; exit 1; }
          current=$(git rev-parse refs/heads/patched)
          tag="v${EXPECTED_VERSION}"
          if [[ "$current" == "$RELEASE_SHA" ]]; then
            echo "::notice::patched already at release SHA; no promote needed"
          elif git merge-base --is-ancestor "$RELEASE_SHA" "$current"; then
            # Recovery: patched advanced past release SHA is only valid when the
            # formal TAG OBJECT already exists (metadata commit or resumed
            # publish). A draft is NOT a tag: drafts have no git tag ref, so a
            # draft must never satisfy this recovery — otherwise a stale RC
            # could be published after patched moved forward.
            tag_ref=$(GH_TOKEN="$TOKEN" gh api "repos/slashinchi/TVBoxOS-Mobile/git/ref/tags/${tag}" --jq '.object.sha' --silent 2>/dev/null || echo "")
            if [[ -n "$tag_ref" && "$tag_ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::notice::recovery: patched advanced past release SHA but tag object $tag exists ($tag_ref); continuing"
            else
              echo "::error::patched advanced past the release SHA and formal tag $tag does not exist; pending RC is stale"
              exit 1
            fi
          else
            git fetch --no-tags origin "+refs/heads/patched:refs/remotes/origin/patched"
            remote=$(git rev-parse refs/remotes/origin/patched)
            [[ "$remote" == "$current" ]] || { echo "::error::patched moved during promote; CAS failed"; exit 1; }
            git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$RELEASE_SHA:refs/heads/patched"
            echo "::notice::patched fast-forwarded to release SHA $RELEASE_SHA"
          fi
          # Sync local refs so subsequent metadata push is a fast-forward.
          git fetch --no-tags origin "+refs/heads/patched:refs/heads/patched"
          git reset --hard refs/heads/patched

      - name: Download exact signed RC and build release assets
        id: assets
        env:
          EXPECTED_VERSION: ${{ steps.identity.outputs.EXPECTED_VERSION }}
          EXPECTED_APK: ${{ steps.identity.outputs.EXPECTED_APK }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          gh api "repos/slashinchi/TVBoxOS-Mobile/actions/artifacts/${{ needs.build_rc.outputs.signed_artifact_id }}/zip" \
            > "$RUNNER_TEMP/signed.zip"
          signed=$(python3 scripts/u2_publish.py extract-signed-apk \
            --zip "$RUNNER_TEMP/signed.zip" \
            --output-dir "$RUNNER_TEMP/assets")
          test -f "$signed" || { echo "::error::signed.apk missing from artifact"; exit 1; }
          actual=$(sha256sum "$signed" | awk '{print $1}')
          [[ "$actual" == "$EXPECTED_APK" ]] || {
            echo "::error::signed APK digest mismatch: $actual != $EXPECTED_APK"; exit 1;
          }
          asset_name="TVBox-Mobile-v${EXPECTED_VERSION}.apk"
          cp "$signed" "$RUNNER_TEMP/assets/$asset_name"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "signed_path=$signed" >> "$GITHUB_OUTPUT"

      - name: Verify attestations for the exact signed RC (fail-closed)
        env:
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -n "$TOKEN" ]] || { echo "::error::release token missing"; exit 1; }
          signed="${{ steps.assets.outputs.signed_path }}"
          test -f "$signed" || { echo "::error::signed APK missing for attestation verify"; exit 1; }
          # Default build provenance (SLSA v1) must verify.
          GH_TOKEN="$TOKEN" gh attestation verify "$signed" \
            --repo slashinchi/TVBoxOS-Mobile \
            --predicate-type https://slsa.dev/provenance/v1 >/dev/null || {
            echo "::error::default attestation verification failed for signed RC"; exit 1;
          }
          # Custom release-identity attestation (tvbox-release-identity-v2) must
          # verify against the exact signed bytes.
          GH_TOKEN="$TOKEN" gh attestation verify "$signed" \
            --repo slashinchi/TVBoxOS-Mobile \
            --predicate-type https://slashinchi.github.io/TVBoxOS-Mobile/tvbox-release-identity/v2 >/dev/null 2>&1 || {
            echo "::error::release-identity attestation verification failed for signed RC"; exit 1;
          }
          echo "::notice::attestations verified for exact signed RC (SLSA v1 + tvbox-release-identity-v2)"

      - name: Independently verify APK signer/package/version (fail-closed)
        env:
          EXPECTED_VERSION: ${{ steps.identity.outputs.EXPECTED_VERSION }}
          SIGNER_SHA: ${{ steps.identity.outputs.SIGNER_SHA }}
        run: |
          set -euo pipefail
          signed="${{ steps.assets.outputs.signed_path }}"
          test -f "$signed" || { echo "::error::signed APK missing for identity verify"; exit 1; }
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          aapt2="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -x "$apksigner" || { echo "::error::apksigner not found"; exit 1; }
          test -x "$aapt2" || { echo "::error::aapt2 not found"; exit 1; }
          # Signer fingerprint must match the approved signer (independent of
          # attestation; the same apksigner invocation the RC pipeline uses).
          "$apksigner" verify --verbose --print-certs "$signed" > "$RUNNER_TEMP/publish-verify-signature.txt"
          signer_sha=$(sed -nE 's/.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*/\1/p' "$RUNNER_TEMP/publish-verify-signature.txt" | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -n 1)
          expected_signer=$(printf '%s' "$SIGNER_SHA" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [[ "$signer_sha" =~ ^[0-9a-f]{64}$ && "$signer_sha" == "$expected_signer" ]] || {
            echo "::error::publish signer fingerprint mismatch: $signer_sha != $expected_signer"; exit 1;
          }
          # Package name and versionName must match the approved release identity.
          badging=$("$aapt2" dump badging "$signed")
          package_name=$(sed -nE "s/^package: name='([^']+)'.*/\1/p" <<<"$badging" | head -n 1)
          apk_name=$(sed -nE "s/^package:.*versionName='([^']+)'.*/\1/p" <<<"$badging" | head -n 1)
          [[ "$package_name" == "com.github.tvbox.osc" ]] || { echo "::error::publish APK package mismatch: $package_name"; exit 1; }
          [[ "$apk_name" == "$EXPECTED_VERSION" ]] || { echo "::error::publish APK versionName mismatch: $apk_name != $EXPECTED_VERSION"; exit 1; }
          echo "::notice::APK identity independently verified (signer=$signer_sha package=$package_name versionName=$apk_name)"

      - name: Create or reconcile draft Release with exact identity
        id: release
        env:
          RELEASE_SHA: ${{ steps.identity.outputs.RELEASE_SHA }}
          EXPECTED_VERSION: ${{ steps.identity.outputs.EXPECTED_VERSION }}
          EXPECTED_DEBT: ${{ steps.identity.outputs.EXPECTED_DEBT }}
          EXPECTED_APK: ${{ steps.identity.outputs.EXPECTED_APK }}
          SIGNER_SHA: ${{ steps.identity.outputs.SIGNER_SHA }}
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -n "$TOKEN" ]] || { echo "::error::release token missing"; exit 1; }
          tag="v${EXPECTED_VERSION}"
          # Compute local digests before any reconciliation (non-empty required).
          update_file="$RUNNER_TEMP/update.json"
          apk_url="https://gh.xxooo.cf/https://github.com/slashinchi/TVBoxOS-Mobile/releases/download/${tag}/TVBox-Mobile-v${EXPECTED_VERSION}.apk"
          python3 scripts/u2_publish.py build-update-json \
            --version "$EXPECTED_VERSION" \
            --apk-url "$apk_url" \
            --output "$update_file"
          update_digest=$(sha256sum "$update_file" | awk '{print $1}')
          existing=$(GH_TOKEN="$TOKEN" gh release view "$tag" --repo slashinchi/TVBoxOS-Mobile \
            --json tagName,targetCommitish,isDraft,assets \
            --jq '.' 2>/dev/null || echo "")
          if [[ -n "$existing" ]]; then
            # Resolve the authoritative tag-object commit SHA. Drafts have no
            # tag ref yet, so fall back to targetCommitish when it is a full SHA
            # (gh release create --draft --target stores the SHA); a branch-name
            # targetCommitish with a resolvable tag ref must still match the ref.
            tag_target_sha=$(GH_TOKEN="$TOKEN" gh api "repos/slashinchi/TVBoxOS-Mobile/git/ref/tags/${tag}" --jq '.object.sha' --silent 2>/dev/null || echo "")
            if [[ -z "$tag_target_sha" ]]; then
              commitish=$(echo "$existing" | jq -r '.targetCommitish // ""')
              if [[ "$commitish" =~ ^[0-9a-f]{40}$ ]]; then
                tag_target_sha="$commitish"
              fi
            fi
            if [[ -n "$tag_target_sha" ]]; then
              existing=$(echo "$existing" | jq --arg sha "$tag_target_sha" '.tagTargetSha = $sha')
            fi
            is_draft=$(echo "$existing" | jq -r '.isDraft')
            if [[ "$is_draft" == "true" ]]; then
              decision=$(python3 scripts/u2_publish.py reconcile-draft \
                --draft "$existing" \
                --version "$EXPECTED_VERSION" \
                --expected-tag "$tag" \
                --expected-target-sha "$RELEASE_SHA" \
                --apk-digest "$EXPECTED_APK" \
                --update-digest "$update_digest" | jq -r '.decision')
              case "$decision" in
                exact-reuse)
                  echo "::notice::reusing identity-exact draft $tag"
                  ;;
                repair-missing)
                  echo "::notice::repairing identity-exact draft $tag (missing-only, no clobber)"
                  ;;
                *)
                  echo "::error::existing Release $tag cannot be safely reused (decision=$decision); stale or wrong assets must never be published"
                  exit 1
                  ;;
              esac
            else
              # Already published: a prior run crossed the publish point but
              # failed later (delivery/metadata/readback). Verify the published
              # Release identity and continue to post-publish reconciliation.
              released_decision=$(python3 scripts/u2_publish.py released-identity \
                --release "$existing" \
                --version "$EXPECTED_VERSION" \
                --expected-tag "$tag" \
                --expected-target-sha "$RELEASE_SHA" \
                --apk-digest "$EXPECTED_APK" \
                --update-digest "$update_digest" | jq -r '.decision')
              case "$released_decision" in
                verify-published)
                  echo "::notice::published Release $tag identity-exact; continuing post-publish verification"
                  decision="published"
                  ;;
                *)
                  echo "::error::published Release $tag cannot be safely continued (decision=$released_decision); conflicting public identity or unrecoverable missing assets fail closed"
                  exit 1
                  ;;
              esac
            fi
          else
            run_url="https://github.com/slashinchi/TVBoxOS-Mobile/actions/runs/${{ github.run_id }}"
            notes=$(printf '%s\n' \
              "## Build / Release Evidence" \
              "- Mode: ${{ needs.qualify.outputs.mode }}" \
              "- Source PR: ${{ needs.qualify.outputs.candidate_pr || 'manual-local' }}" \
              "- Upstream SHA: ${{ needs.qualify.outputs.upstream_sha || 'n/a (manual-local)' }}" \
              "- Release SHA: $RELEASE_SHA" \
              "- Version: $EXPECTED_VERSION" \
              "- Debt fingerprint: $EXPECTED_DEBT" \
              "- Signed APK SHA-256: $EXPECTED_APK" \
              "- Signer fingerprint: $SIGNER_SHA" \
              "- Run: $run_url" \
              "- Verification: \`gh attestation verify <artifact> --repo slashinchi/TVBoxOS-Mobile\`")
            GH_TOKEN="$TOKEN" gh release create "$tag" \
              --repo slashinchi/TVBoxOS-Mobile \
              --draft \
              --target "$RELEASE_SHA" \
              --title "TVBoxOS-Mobile v${EXPECTED_VERSION}" \
              --notes "$notes" \
              "$RUNNER_TEMP/assets/${{ steps.assets.outputs.asset_name }}"
            echo "::notice::draft Release created: $tag at $RELEASE_SHA"
            decision="created"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "update_digest=$update_digest" >> "$GITHUB_OUTPUT"

      - name: Attach missing assets only (no clobber)
        env:
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$TOKEN" ]] || { echo "::error::release token missing"; exit 1; }
          tag="${{ steps.release.outputs.tag }}"
          decision="${{ steps.release.outputs.decision }}"
          [[ "$decision" == "repair-missing" || "$decision" == "created" ]] || {
            echo "::notice::no asset attach needed (decision=$decision)"
            exit 0
          }
          state=$(GH_TOKEN="$TOKEN" gh release view "$tag" --repo slashinchi/TVBoxOS-Mobile --json assets --jq '[.assets[].name]')
          names=$(jq -r '.[]' <<<"$state" | sort)
          has_apk=false
          has_update=false
          while IFS= read -r name; do
            [[ "$name" == "${{ steps.assets.outputs.asset_name }}" ]] && has_apk=true
            [[ "$name" == "update.json" ]] && has_update=true
          done <<<"$names"
          files=()
          [[ "$has_apk" == "true" ]] || files+=("$RUNNER_TEMP/assets/${{ steps.assets.outputs.asset_name }}")
          [[ "$has_update" == "true" ]] || files+=("$RUNNER_TEMP/update.json")
          if [[ "${#files[@]}" -gt 0 ]]; then
            GH_TOKEN="$TOKEN" gh release upload "$tag" \
              --repo slashinchi/TVBoxOS-Mobile \
              "${files[@]}"
            echo "::notice::attached ${#files[@]} missing asset(s) to $tag (no clobber)"
          else
            echo "::notice::no missing assets for $tag"
          fi

      - name: Verify both assets before publish (API digest + download bytes)
        env:
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          mkdir -p "$RUNNER_TEMP/pre-publish-verify"
          GH_TOKEN="$TOKEN" gh release download "$tag" \
            --repo slashinchi/TVBoxOS-Mobile \
            --pattern "*" \
            --dir "$RUNNER_TEMP/pre-publish-verify" --clobber
          state=$(GH_TOKEN="$TOKEN" gh release view "$tag" \
            --repo slashinchi/TVBoxOS-Mobile \
            --json tagName,targetCommitish,isDraft,assets \
            --jq '.')
          result=$(python3 scripts/u2_publish.py verify-release-assets \
            --release "$state" \
            --version "${{ steps.identity.outputs.EXPECTED_VERSION }}" \
            --apk-digest "${{ steps.identity.outputs.EXPECTED_APK }}" \
            --update-digest "${{ steps.release.outputs.update_digest }}" \
            --download-dir "$RUNNER_TEMP/pre-publish-verify")
          verified=$(jq -r '.verified' <<<"$result")
          [[ "$verified" == "true" ]] || {
            echo "::error::pre-publish asset verification failed: $result"; exit 1;
          }
          echo "::notice::both assets verified (API digest + download bytes) before publish"

      - name: Publish verified draft
        env:
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          decision="${{ steps.release.outputs.decision }}"
          if [[ "$decision" == "published" || "$decision" == "verify-published" ]]; then
            echo "::notice::Release $tag already published; skipping publish"
            exit 0
          fi
          # gh has no `release publish` command; publishing a draft means
          # flipping the draft flag off with `gh release edit --draft=false`.
          GH_TOKEN="$TOKEN" gh release edit "$tag" --repo slashinchi/TVBoxOS-Mobile --draft=false
          echo "::notice::Release $tag published (draft=false)"

      - name: Verify immutable Release and assets
        env:
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          expected_apk="${{ steps.identity.outputs.EXPECTED_APK }}"
          expected_target="${{ steps.identity.outputs.RELEASE_SHA }}"
          # 1) GitHub's own immutable-release verification commands.
          GH_TOKEN="$TOKEN" gh release verify "$tag" --repo slashinchi/TVBoxOS-Mobile
          # 2) Re-download the APK directly from GitHub and verify the exact bytes,
          #    then prove the attestation binds that exact asset.
          mkdir -p "$RUNNER_TEMP/direct-download"
          GH_TOKEN="$TOKEN" gh release download "$tag" \
            --repo slashinchi/TVBoxOS-Mobile \
            --pattern "${{ steps.assets.outputs.asset_name }}" \
            --dir "$RUNNER_TEMP/direct-download" --clobber
          GH_TOKEN="$TOKEN" gh release verify-asset "$tag" \
            "$RUNNER_TEMP/direct-download/${{ steps.assets.outputs.asset_name }}" \
            --repo slashinchi/TVBoxOS-Mobile
          remote=$(sha256sum "$RUNNER_TEMP/direct-download/${{ steps.assets.outputs.asset_name }}" | awk '{print $1}')
          [[ "$remote" == "$expected_apk" ]] || {
            echo "::error::downloaded Release APK digest mismatch: $remote != $expected_apk"; exit 1;
          }
          # 3) Tag object must resolve to the exact release SHA (not just target_commitish).
          git fetch --no-tags origin "+refs/tags/${tag}:refs/tags/${tag}"
          tag_sha=$(git rev-parse "refs/tags/${tag}^{commit}")
          [[ "$tag_sha" == "$expected_target" ]] || {
            echo "::error::tag ${tag} points at ${tag_sha}, expected ${expected_target}"; exit 1;
          }
          # 4) Read published Release state: immutable=true, exact tag/target/assets.
          state=$(GH_TOKEN="$TOKEN" gh api "repos/slashinchi/TVBoxOS-Mobile/releases/tags/${tag}" --jq '{immutable:.immutable,tag:.tag_name,target:.target_commitish,assets:[.assets[].name]}')
          [[ "$(jq -r '.immutable' <<<"$state")" == "true" ]] || { echo "::error::release immutable flag is not true for $tag"; exit 1; }
          [[ "$(jq -r '.tag' <<<"$state")" == "$tag" ]] || { echo "::error::release tag mismatch"; exit 1; }
          # GitHub may store target_commitish as a branch name after publish;
          # the authoritative identity is the tag object SHA checked above. A
          # SHA-valued target_commitish must still equal the expected SHA.
          commitish=$(jq -r '.target' <<<"$state")
          if [[ "$commitish" =~ ^[0-9a-f]{40}$ ]]; then
            [[ "$commitish" == "$expected_target" ]] || { echo "::error::release target SHA mismatch: $commitish"; exit 1; }
          else
            echo "::notice::release target_commitish is a ref name ($commitish); tag object SHA is the identity authority"
          fi
          names=$(jq -r '.assets | sort | join(",")' <<<"$state")
          expected_names="${{ steps.assets.outputs.asset_name }},update.json"
          [[ "$names" == "$expected_names" ]] || { echo "::error::release asset set mismatch: $names"; exit 1; }
          echo "::notice::immutable verification passed for $tag (immutable=true, exact tag/target/assets/digest, tag SHA $tag_sha)"

      - name: Delivery check against proxy URL (identity-bound incident)
        env:
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          expected="${{ steps.identity.outputs.EXPECTED_APK }}"
          apk_url="https://gh.xxooo.cf/https://github.com/slashinchi/TVBoxOS-Mobile/releases/download/${tag}/TVBox-Mobile-v${{ steps.identity.outputs.EXPECTED_VERSION }}.apk"
          proxy_file="$RUNNER_TEMP/proxy.apk"
          delivery_ok=false
          for attempt in 1 2 3; do
            if curl -fsSL --connect-timeout 15 --max-time 120 -o "$proxy_file" "$apk_url"; then
              actual=$(sha256sum "$proxy_file" | awk '{print $1}')
              verified=$(python3 scripts/u2_publish.py delivery-compare \
                --url "$apk_url" \
                --expected-sha "$expected" \
                --fetched-sha "$actual" | jq -r '.verified')
              if [[ "$verified" == "true" ]]; then
                delivery_ok=true
                break
              fi
            fi
            [[ "$attempt" -lt 3 ]] || { echo "::error::delivery proxy fetch/verify failed"; break; }
            sleep 5
          done
          if [[ "$delivery_ok" == "false" ]]; then
            echo "::error::delivery proxy bytes do not match signed RC"
            incident_key=$(python3 scripts/u2_publish.py incident-key \
              --mode "${{ needs.rc_summary.outputs.MODE }}" \
              --source-sha "${{ needs.rc_summary.outputs.SOURCE_SHA }}" \
              --version "${{ steps.identity.outputs.EXPECTED_VERSION }}" \
              --debt "${{ steps.identity.outputs.EXPECTED_DEBT }}" | jq -r '.key')
            title="release-delivery: ${incident_key}"
            existing=$(gh issue list --repo slashinchi/TVBoxOS-Mobile --search "in:title \"${title}\"" --state open --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
            if [[ -n "$existing" ]]; then
              echo "::notice::release-delivery incident already open: #${existing}"
            else
              gh issue create --repo slashinchi/TVBoxOS-Mobile \
                --title "$title" \
                --body "Release tag $tag. Expected $expected. Identity ${incident_key}. Metadata stays at the prior valid Release."
            fi
            echo "delivery_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "delivery_ok=true" >> "$GITHUB_OUTPUT"
          echo "::notice::delivery proxy verified for $tag"

      - name: Reconcile root update.json monotonically with remote readback
        env:
          EXPECTED_VERSION: ${{ steps.identity.outputs.EXPECTED_VERSION }}
          EXPECTED_DEBT: ${{ steps.identity.outputs.EXPECTED_DEBT }}
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -n "$TOKEN" ]] || { echo "::error::release token missing"; exit 1; }
          cand_version="$EXPECTED_VERSION"
          # Read the CURRENT root update.json from the remote patched branch,
          # never from local HEAD (which may be ahead of or behind remote).
          remote_b64=$(GH_TOKEN="$TOKEN" gh api "repos/slashinchi/TVBoxOS-Mobile/contents/update.json?ref=patched" \
            --jq '.content' --silent 2>/dev/null || echo "")
          [[ -n "$remote_b64" ]] || {
            echo "::error::cannot read current patched/update.json from remote; refusing to guess (a transient API failure must never be treated as an empty baseline)"
            exit 1
          }
          remote_content=$(printf '%s' "$remote_b64" | base64 -d 2>/dev/null || echo "")
          [[ -n "$remote_content" ]] || {
            echo "::error::remote update.json base64 decode failed or is empty; refusing to proceed on an unknown baseline"
            exit 1
          }
          current_version=$(jq -r '.version // ""' <<<"$remote_content" 2>/dev/null || echo "")
          [[ -n "$current_version" ]] || {
            echo "::error::remote update.json has no readable version; refusing to proceed on an unknown baseline"
            exit 1
          }
          newer=$(python3 scripts/u2_publish.py monotonic-compare \
            --current-version "$current_version" \
            --candidate-version "$cand_version" | jq -r '.newer')
          [[ "$newer" == "true" ]] || { echo "::error::candidate version is older than current update.json"; exit 1; }
          apk_url="https://gh.xxooo.cf/https://github.com/slashinchi/TVBoxOS-Mobile/releases/download/v${cand_version}/TVBox-Mobile-v${cand_version}.apk"
          python3 scripts/u2_publish.py build-update-json \
            --version "$cand_version" \
            --apk-url "$apk_url" \
            --output update.json
          if cmp -s update.json <(printf '%s' "$remote_content"); then
            echo "::notice::remote update.json already identical to v${cand_version}; no commit needed"
            exit 0
          fi
          git config user.name "TVBox U2 Publish"
          git config user.email "u2-publish@users.noreply.github.com"
          # Metadata is forward-only: if patched moved while this run was
          # publishing (TOCTOU), rebuild the single update.json commit on the
          # NEW remote HEAD so we never fast-forward-overwrite concurrent
          # pushes, and never leave a published Release without metadata.
          cp update.json "$RUNNER_TEMP/update-json-to-commit.json"
          git fetch --no-tags origin "+refs/heads/patched:refs/remotes/origin/patched"
          remote_head=$(git rev-parse refs/remotes/origin/patched)
          if [[ "$(git rev-parse HEAD)" != "$remote_head" ]]; then
            echo "::notice::patched moved during publish ($(git rev-parse --short HEAD) -> $(git rev-parse --short "$remote_head")); rebuilding update.json commit on remote HEAD"
            git reset --hard "$remote_head"
            cp "$RUNNER_TEMP/update-json-to-commit.json" update.json
            git add update.json
            git commit -m "chore: update metadata to v${cand_version}"
          else
            git add update.json
            git commit -m "chore: update metadata to v${cand_version}"
          fi
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/patched
          # Remote byte readback via the Contents API on patched.
          remote_after=$(GH_TOKEN="$TOKEN" gh api "repos/slashinchi/TVBoxOS-Mobile/contents/update.json?ref=patched" \
            --jq '.content' | base64 -d)
          expected_url="$apk_url"
          printf '%s' "$remote_after" > "$RUNNER_TEMP/remote-update.json"
          verified=$(python3 scripts/u2_publish.py verify-remote-metadata \
            --metadata-file "$RUNNER_TEMP/remote-update.json" \
            --expected-version "$cand_version" \
            --expected-apk-url "$expected_url" | jq -r '.verified')
          [[ "$verified" == "true" ]] || {
            echo "::error::remote update.json readback mismatch after commit"; exit 1;
          }
          echo "::notice::root update.json reconciled to v${cand_version} and remote-readback byte-exact"

      - name: Clean up disposable prep ref and close satisfied incidents
        env:
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          EXPECTED_VERSION: ${{ steps.identity.outputs.EXPECTED_VERSION }}
          EXPECTED_DEBT: ${{ steps.identity.outputs.EXPECTED_DEBT }}
          TOKEN: ${{ secrets.TVBOX_RELEASE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -n "$TOKEN" ]] || { echo "::error::release token missing"; exit 1; }
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            ":refs/heads/u2-prep-${SOURCE_SHA}" 2>/dev/null || true
          echo "::notice::prep ref u2-prep-${SOURCE_SHA} cleaned"
          # Close satisfied identity-bound incidents (release-delivery hold closes
          # only when delivery verified in this run).
          incident_key=$(python3 scripts/u2_publish.py incident-key \
            --mode "${{ needs.rc_summary.outputs.MODE }}" \
            --source-sha "${{ needs.rc_summary.outputs.SOURCE_SHA }}" \
            --version "$EXPECTED_VERSION" \
            --debt "$EXPECTED_DEBT" | jq -r '.key')
          for prefix in "release-delivery" "stale-rc"; do
            title="${prefix}: ${incident_key}"
            existing=$(gh issue list --repo slashinchi/TVBoxOS-Mobile --search "in:title \"${title}\"" --state open --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
            if [[ -n "$existing" ]]; then
              gh issue close "$existing" --repo slashinchi/TVBoxOS-Mobile --comment "Conditions satisfied by release ${incident_key}."
              echo "::notice::closed incident ${prefix}: #${existing}"
            fi
          done
