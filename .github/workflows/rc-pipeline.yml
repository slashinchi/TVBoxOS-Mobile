name: TVBox Exact-SHA RC Pipeline

on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact commit whose app bytes are released.
        required: true
        type: string
      source_sha:
        description: Generic source identity bound to the release commit.
        required: true
        type: string
      mode:
        description: auto-upstream or manual-local.
        required: true
        type: string
      upstream_sha:
        description: Proven integrated upstream commit; manual mode derives it when empty.
        required: false
        default: ''
        type: string
      upstream_version:
        description: Exact upstream versionName for automatic mode.
        required: false
        default: ''
        type: string
      upstream_code:
        description: Exact upstream versionCode for automatic mode.
        required: false
        default: ''
        type: string
      expected_version_name:
        description: Expected release versionName; manual mode derives it when empty.
        required: false
        default: ''
        type: string
      expected_version_code:
        description: Expected release versionCode; manual mode derives it when empty.
        required: false
        default: ''
        type: string
      release_debt:
        description: SHA-256 release-debt fingerprint; manual mode derives it when empty.
        required: false
        default: ''
        type: string
      candidate_pr:
        description: Qualified U1 candidate PR number, omitted for manual mode.
        required: false
        default: ''
        type: string
      provenance_marker:
        description: Exact U1 v2 provenance marker for automatic mode.
        required: false
        default: ''
        type: string
      canary_namespace:
        description: Optional exact run-owned prefix for the authorized U2c canary only.
        required: false
        default: ''
        type: string
    outputs:
      unsigned_artifact_id:
        description: Actions artifact ID for the exact unsigned APK bundle.
        value: ${{ jobs.build_unsigned.outputs.artifact_id }}
      unsigned_artifact_name:
        description: Actions artifact name for the exact unsigned APK bundle.
        value: ${{ jobs.build_unsigned.outputs.artifact_name }}
      unsigned_artifact_digest:
        description: Actions transport digest for the unsigned bundle.
        value: ${{ jobs.build_unsigned.outputs.artifact_digest }}
      repro_artifact_id:
        description: Actions artifact ID for the independent reproducibility bundle.
        value: ${{ jobs.build_repro.outputs.artifact_id }}
      repro_artifact_name:
        description: Actions artifact name for the independent reproducibility bundle.
        value: ${{ jobs.build_repro.outputs.artifact_name }}
      repro_artifact_digest:
        description: Actions transport digest for the independent reproducibility bundle.
        value: ${{ jobs.build_repro.outputs.artifact_digest }}
      reproducibility_report_artifact_id:
        description: Actions artifact ID for the reproducibility comparison report.
        value: ${{ jobs.compare_reproducibility.outputs.report_artifact_id }}
      reproducibility_report_artifact_name:
        description: Actions artifact name for the reproducibility comparison report.
        value: ${{ jobs.compare_reproducibility.outputs.report_artifact_name }}
      reproducibility_report_artifact_digest:
        description: Actions transport digest for the reproducibility comparison report.
        value: ${{ jobs.compare_reproducibility.outputs.report_artifact_digest }}
      reproducibility_report_sha256:
        description: SHA-256 of the verifier-bound reproducibility report.
        value: ${{ jobs.compare_reproducibility.outputs.report_sha256 }}
      signed_artifact_id:
        description: Actions artifact ID for the exact signed APK bundle.
        value: ${{ jobs.sign_exact.outputs.artifact_id }}
      signed_artifact_name:
        description: Actions artifact name for the exact signed APK bundle.
        value: ${{ jobs.sign_exact.outputs.artifact_name }}
      signed_artifact_digest:
        description: Actions transport digest for the signed bundle.
        value: ${{ jobs.sign_exact.outputs.artifact_digest }}
      sign_input_artifact_name:
        description: Actions artifact name for the sanitized sign input.
        value: ${{ jobs.prepare_sign_input.outputs.artifact_name }}
      sign_input_artifact_id:
        description: Actions artifact ID for the sanitized sign input.
        value: ${{ jobs.prepare_sign_input.outputs.artifact_id }}
      attest_input_artifact_id:
        description: Actions artifact ID for the verifier-produced attest input.
        value: ${{ jobs.verify_signed.outputs.attest_input_artifact_id }}
      attest_input_artifact_name:
        description: Actions artifact name for the verifier-produced attest input.
        value: ${{ jobs.verify_signed.outputs.attest_input_artifact_name }}
      unsigned_sha256:
        description: Raw SHA-256 of the exact AGP-produced unsigned APK.
        value: ${{ jobs.build_unsigned.outputs.unsigned_sha256 }}
      signed_sha256:
        description: Raw SHA-256 of the exact signed APK.
        value: ${{ jobs.verify_signed.outputs.signed_sha256 }}
      signer_sha256:
        description: SHA-256 certificate fingerprint of the signed APK.
        value: ${{ jobs.verify_signed.outputs.signer_sha256 }}
      default_attestation_id:
        description: GitHub default build-provenance attestation ID.
        value: ${{ jobs.attest_signed.outputs.default_attestation_id }}
      custom_attestation_id:
        description: Project-specific release-identity attestation ID.
        value: ${{ jobs.attest_signed.outputs.custom_attestation_id }}

permissions:
  contents: read
  actions: read

jobs:
  validate_canary_namespace:
    name: Validate optional canary artifact namespace
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: none
    outputs:
      canary_namespace: ${{ steps.validate.outputs.canary_namespace }}
    steps:
      - id: validate
        name: Fail closed on an invalid canary namespace
        env:
          CANARY_NAMESPACE: ${{ inputs.canary_namespace }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          if [[ -z "$CANARY_NAMESPACE" ]]; then
            echo "canary_namespace=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$RUN_ATTEMPT" =~ ^[0-9]+$ ]] || {
            echo "::error::GitHub run identity is not numeric"
            exit 1
          }
          [[ "$CANARY_NAMESPACE" =~ ^u2-canary-[0-9]+-attempt-[0-9]+$ ]] || {
            echo "::error::canary namespace must match u2-canary-<run>-attempt-<attempt>"
            exit 1
          }
          expected_namespace="u2-canary-${RUN_ID}-attempt-${RUN_ATTEMPT}"
          [[ "$CANARY_NAMESPACE" == "$expected_namespace" ]] || {
            echo "::error::namespace does not match the current run and attempt"
            exit 1
          }
          [[ "$CALLER_WORKFLOW_REF" == "slashinchi/TVBoxOS-Mobile/.github/workflows/u2-canary-harness.yml@refs/heads/patched" ]] || {
            echo "::error::namespaced pipeline calls are allowed only from the patched canary harness"
            exit 1
          }
          echo "canary_namespace=$CANARY_NAMESPACE" >> "$GITHUB_OUTPUT"

  build_unsigned:
    name: Build exact unsigned APK
    needs: validate_canary_namespace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_name: ${{ steps.outputs.outputs.artifact_name }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      unsigned_sha256: ${{ steps.build.outputs.unsigned_sha256 }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      MODE: ${{ inputs.mode }}
      INPUT_UPSTREAM_SHA: ${{ inputs.upstream_sha }}
      INPUT_UPSTREAM_VERSION: ${{ inputs.upstream_version }}
      INPUT_UPSTREAM_CODE: ${{ inputs.upstream_code }}
      INPUT_VERSION_NAME: ${{ inputs.expected_version_name }}
      INPUT_VERSION_CODE: ${{ inputs.expected_version_code }}
      INPUT_RELEASE_DEBT: ${{ inputs.release_debt }}
      INPUT_CANDIDATE_PR: ${{ inputs.candidate_pr }}
      INPUT_PROVENANCE_MARKER: ${{ inputs.provenance_marker }}
    steps:
      - name: Check out exact release SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out workflow control helpers
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: control-workflow
          fetch-depth: 1
          persist-credentials: false

      - name: Set up builder Temurin 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17.0.20+8'

      - id: build
        name: Build shared recipe with no signing material
        env:
          BUILDER_ROLE: primary
          CONTROL_WORKFLOW_ROOT: ${{ github.workspace }}/control-workflow
          WORKFLOW_SOURCE_SHA: ${{ job.workflow_sha }}
          TVBOX_KEYSTORE_BASE64: ''
          TVBOX_KEY_ALIAS: ''
          TVBOX_KEY_PASSWORD: ''
          TVBOX_STORE_PASSWORD: ''
        run: bash "$CONTROL_WORKFLOW_ROOT/scripts/u2_build_evidence.sh" primary

      - name: Upload exact unsigned build evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.canary_namespace != '' && format('{0}-tvbox-u2-build-evidence-{1}-{2}', inputs.canary_namespace, inputs.release_sha, github.run_attempt) || format('tvbox-u2-build-evidence-{0}-{1}', inputs.release_sha, github.run_attempt) }}
          path: build/evidence
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: false

      - id: outputs
        name: Publish unsigned artifact outputs
        env:
          CANARY_NAMESPACE: ${{ inputs.canary_namespace }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          artifact_name="tvbox-u2-build-evidence-${RELEASE_SHA}-${RUN_ATTEMPT}"
          if [[ -n "$CANARY_NAMESPACE" ]]; then
            artifact_name="${CANARY_NAMESPACE}-${artifact_name}"
          fi
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

  build_repro:
    name: Build independent reproducibility APK
    needs: validate_canary_namespace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_name: ${{ steps.outputs.outputs.artifact_name }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      unsigned_sha256: ${{ steps.build.outputs.unsigned_sha256 }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      MODE: ${{ inputs.mode }}
      INPUT_UPSTREAM_SHA: ${{ inputs.upstream_sha }}
      INPUT_UPSTREAM_VERSION: ${{ inputs.upstream_version }}
      INPUT_UPSTREAM_CODE: ${{ inputs.upstream_code }}
      INPUT_VERSION_NAME: ${{ inputs.expected_version_name }}
      INPUT_VERSION_CODE: ${{ inputs.expected_version_code }}
      INPUT_RELEASE_DEBT: ${{ inputs.release_debt }}
      INPUT_CANDIDATE_PR: ${{ inputs.candidate_pr }}
      INPUT_PROVENANCE_MARKER: ${{ inputs.provenance_marker }}
    steps:
      - name: Check out exact release SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out workflow control helpers
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: control-workflow
          fetch-depth: 1
          persist-credentials: false

      - name: Set up builder Temurin 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17.0.20+8'

      - id: build
        name: Build shared recipe with no signing material
        env:
          BUILDER_ROLE: repro
          CONTROL_WORKFLOW_ROOT: ${{ github.workspace }}/control-workflow
          WORKFLOW_SOURCE_SHA: ${{ job.workflow_sha }}
          TVBOX_KEYSTORE_BASE64: ''
          TVBOX_KEY_ALIAS: ''
          TVBOX_KEY_PASSWORD: ''
          TVBOX_STORE_PASSWORD: ''
        run: bash "$CONTROL_WORKFLOW_ROOT/scripts/u2_build_evidence.sh" repro

      - name: Upload independent reproducibility evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.canary_namespace != '' && format('{0}-tvbox-u2-repro-build-evidence-{1}-{2}', inputs.canary_namespace, inputs.release_sha, github.run_attempt) || format('tvbox-u2-repro-build-evidence-{0}-{1}', inputs.release_sha, github.run_attempt) }}
          path: build/evidence
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: false

      - id: outputs
        name: Publish reproducibility artifact outputs
        env:
          CANARY_NAMESPACE: ${{ inputs.canary_namespace }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          artifact_name="tvbox-u2-repro-build-evidence-${RELEASE_SHA}-${RUN_ATTEMPT}"
          if [[ -n "$CANARY_NAMESPACE" ]]; then
            artifact_name="${CANARY_NAMESPACE}-${artifact_name}"
          fi
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

  compare_reproducibility:
    name: Compare independent builder evidence before signing
    needs: [build_unsigned, build_repro]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      report_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      report_artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      primary_artifact_id: ${{ needs.build_unsigned.outputs.artifact_id }}
      primary_artifact_digest: ${{ needs.build_unsigned.outputs.artifact_digest }}
      repro_artifact_id: ${{ needs.build_repro.outputs.artifact_id }}
      repro_artifact_digest: ${{ needs.build_repro.outputs.artifact_digest }}
      primary_unsigned_sha256: ${{ steps.compare.outputs.primary_unsigned_sha256 }}
      report_sha256: ${{ steps.compare.outputs.report_sha256 }}
    env:
      PRIMARY_ARTIFACT_ID: ${{ needs.build_unsigned.outputs.artifact_id }}
      PRIMARY_ARTIFACT_DIGEST: ${{ needs.build_unsigned.outputs.artifact_digest }}
      REPRO_ARTIFACT_ID: ${{ needs.build_repro.outputs.artifact_id }}
      REPRO_ARTIFACT_DIGEST: ${{ needs.build_repro.outputs.artifact_digest }}
      EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_MODE: ${{ inputs.mode }}
      EXPECTED_UPSTREAM_SHA: ${{ inputs.upstream_sha }}
      EXPECTED_UPSTREAM_VERSION: ${{ inputs.upstream_version }}
      EXPECTED_UPSTREAM_CODE: ${{ inputs.upstream_code }}
      EXPECTED_VERSION_NAME: ${{ inputs.expected_version_name }}
      EXPECTED_VERSION_CODE: ${{ inputs.expected_version_code }}
      EXPECTED_RELEASE_DEBT: ${{ inputs.release_debt }}
      EXPECTED_CANDIDATE_PR: ${{ inputs.candidate_pr }}
      EXPECTED_PROVENANCE_MARKER: ${{ inputs.provenance_marker }}
    steps:
      - name: Check out workflow control helpers
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: control-workflow
          fetch-depth: 1
          persist-credentials: false

      - name: Download primary builder evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build_unsigned.outputs.artifact_id }}
          path: ${{ runner.temp }}/primary-evidence

      - name: Download reproducibility builder evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build_repro.outputs.artifact_id }}
          path: ${{ runner.temp }}/repro-evidence

      - id: compare
        name: Compare primary and reproducibility evidence
        env:
          CONTROL_WORKFLOW_ROOT: ${{ github.workspace }}/control-workflow
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repro-comparison"
          python3 "$CONTROL_WORKFLOW_ROOT/scripts/reproducibility.py" compare \
            --primary "$RUNNER_TEMP/primary-evidence" \
            --repro "$RUNNER_TEMP/repro-evidence" \
            --primary-artifact-id "$PRIMARY_ARTIFACT_ID" \
            --repro-artifact-id "$REPRO_ARTIFACT_ID" \
            --primary-artifact-digest "$PRIMARY_ARTIFACT_DIGEST" \
            --repro-artifact-digest "$REPRO_ARTIFACT_DIGEST" \
            --output "$RUNNER_TEMP/repro-comparison/reproducibility-report.json"
          report="$RUNNER_TEMP/repro-comparison/reproducibility-report.json"
          echo "primary_unsigned_sha256=$(jq -r '.primary_unsigned_sha256' "$report")" >> "$GITHUB_OUTPUT"
          echo "report_sha256=$(sha256sum "$report" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          validate_identity() {
            local identity="$1"
            local role="$2"
            jq -e \
              --arg role "$role" \
              --arg release "$EXPECTED_RELEASE_SHA" \
              --arg source "$EXPECTED_SOURCE_SHA" \
              --arg mode "$EXPECTED_MODE" \
              --arg upstream "$EXPECTED_UPSTREAM_SHA" \
              --arg upstream_version "$EXPECTED_UPSTREAM_VERSION" \
              --arg upstream_code "$EXPECTED_UPSTREAM_CODE" \
              --arg version_name "$EXPECTED_VERSION_NAME" \
              --arg version_code "$EXPECTED_VERSION_CODE" \
              --arg debt "$EXPECTED_RELEASE_DEBT" \
              --arg candidate "$EXPECTED_CANDIDATE_PR" \
              --arg marker "$EXPECTED_PROVENANCE_MARKER" \
              '.builder_role == $role and .artifact_source_sha == $release and .source_sha == $source and .mode == $mode and ($upstream == "" or .upstream_sha == $upstream) and ($upstream_version == "" or .upstream_version == $upstream_version) and ($upstream_code == "" or (.upstream_code | tostring) == $upstream_code) and ($version_name == "" or .version_name == $version_name) and ($version_code == "" or .version_code == $version_code) and ($debt == "" or .release_debt == $debt) and ($candidate == "" or .candidate_pr == $candidate) and ($marker == "" or .provenance_marker == $marker)' \
              "$identity" >/dev/null || {
                echo "::error::builder identity is not bound to workflow inputs: $role"
                exit 1
              }
          }
          validate_identity "$RUNNER_TEMP/primary-evidence/build-identity.json" primary
          validate_identity "$RUNNER_TEMP/repro-evidence/build-identity.json" repro

      - name: Validate comparison report root
        if: always()
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/repro-comparison"
          test -f "$root/reproducibility-report.json"
          test ! -L "$root/reproducibility-report.json"
          test "$(find "$root" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 1
          test -z "$(find "$root" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"

      - name: Upload reproducibility comparison report
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.canary_namespace != '' && format('{0}-tvbox-u2-repro-comparison-{1}-{2}', inputs.canary_namespace, inputs.release_sha, github.run_attempt) || format('tvbox-u2-repro-comparison-{0}-{1}', inputs.release_sha, github.run_attempt) }}
          path: ${{ runner.temp }}/repro-comparison/reproducibility-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: false

      - id: outputs
        name: Publish comparison artifact outputs
        if: always()
        env:
          CANARY_NAMESPACE: ${{ inputs.canary_namespace }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          artifact_name="tvbox-u2-repro-comparison-${RELEASE_SHA}-${RUN_ATTEMPT}"
          if [[ -n "$CANARY_NAMESPACE" ]]; then
            artifact_name="${CANARY_NAMESPACE}-${artifact_name}"
          fi
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

  prepare_sign_input:
    name: Prepare sanitized sign input without secrets
    needs: [build_unsigned, compare_reproducibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_name: ${{ steps.outputs.outputs.artifact_name }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      primary_artifact_id: ${{ needs.compare_reproducibility.outputs.primary_artifact_id }}
      primary_artifact_digest: ${{ needs.compare_reproducibility.outputs.primary_artifact_digest }}
      repro_artifact_id: ${{ needs.compare_reproducibility.outputs.repro_artifact_id }}
      repro_artifact_digest: ${{ needs.compare_reproducibility.outputs.repro_artifact_digest }}
      reproducibility_report_artifact_id: ${{ needs.compare_reproducibility.outputs.report_artifact_id }}
      reproducibility_report_artifact_digest: ${{ needs.compare_reproducibility.outputs.report_artifact_digest }}
      comparison_report_sha256: ${{ needs.compare_reproducibility.outputs.report_sha256 }}
    env:
      EXPECTED_UNSIGNED_SHA256: ${{ needs.build_unsigned.outputs.unsigned_sha256 }}
      EXPECTED_PRIMARY_ARTIFACT_ID: ${{ needs.compare_reproducibility.outputs.primary_artifact_id }}
      EXPECTED_PRIMARY_ARTIFACT_DIGEST: ${{ needs.compare_reproducibility.outputs.primary_artifact_digest }}
      EXPECTED_REPRO_ARTIFACT_ID: ${{ needs.compare_reproducibility.outputs.repro_artifact_id }}
      EXPECTED_REPRO_ARTIFACT_DIGEST: ${{ needs.compare_reproducibility.outputs.repro_artifact_digest }}
      EXPECTED_COMPARISON_REPORT_ARTIFACT_ID: ${{ needs.compare_reproducibility.outputs.report_artifact_id }}
      EXPECTED_COMPARISON_REPORT_ARTIFACT_DIGEST: ${{ needs.compare_reproducibility.outputs.report_artifact_digest }}
      EXPECTED_COMPARISON_REPORT_SHA256: ${{ needs.compare_reproducibility.outputs.report_sha256 }}
    steps:
      - name: Download exact build evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build_unsigned.outputs.artifact_id }}
          path: ${{ runner.temp }}/build-evidence

      - name: Download reproducibility comparison report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.compare_reproducibility.outputs.report_artifact_id }}
          path: ${{ runner.temp }}/repro-comparison

      - name: Validate flat build evidence and actual APK hash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/build-evidence"
          expected_files="unsigned.apk build-identity.json payload-manifest.json native-compat.json runtime-components.json legacy-dependencies.lock.json"
          for f in $expected_files; do
            test -f "$root/$f" || { echo "::error::missing build evidence file: $f"; exit 1; }
            test ! -d "$root/$f" || { echo "::error::build evidence entry is a directory: $f"; exit 1; }
            test ! -L "$root/$f" || { echo "::error::build evidence entry is a symlink: $f"; exit 1; }
          done
          actual_count=$(find "$root" -maxdepth 1 -type f | wc -l | tr -d ' ')
          test "$actual_count" -eq 6 || { echo "::error::build evidence file count is $actual_count, expected 6"; exit 1; }
          test -z "$(find "$root" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" || { echo "::error::build evidence contains non-regular entries"; exit 1; }
          comparison="$RUNNER_TEMP/repro-comparison/reproducibility-report.json"
          test -f "$comparison"
          test ! -L "$comparison"
          test "$(find "$RUNNER_TEMP/repro-comparison" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 1 || { echo "::error::comparison artifact must contain exactly one file"; exit 1; }
          test "$(sha256sum "$comparison" | awk '{print $1}')" = "$EXPECTED_COMPARISON_REPORT_SHA256" || { echo "::error::comparison report digest mismatch"; exit 1; }
           jq -e --arg primary "$EXPECTED_PRIMARY_ARTIFACT_ID" --arg primary_digest "$EXPECTED_PRIMARY_ARTIFACT_DIGEST" --arg repro "$EXPECTED_REPRO_ARTIFACT_ID" --arg repro_digest "$EXPECTED_REPRO_ARTIFACT_DIGEST" --arg unsigned "$EXPECTED_UNSIGNED_SHA256" \
             '.schema == "tvbox-reproducibility-v1" and .status == "equivalent" and .primary_artifact_id == $primary and .primary_artifact_digest == $primary_digest and .primary_builder_role == "primary" and .primary_unsigned_sha256 == $unsigned and .repro_artifact_id == $repro and .repro_artifact_digest == $repro_digest and .repro_artifact_id != .primary_artifact_id' \
             "$comparison" >/dev/null || { echo "::error::comparison report binding mismatch"; exit 1; }
          identity="$root/build-identity.json"
          jq -e '.schema == "tvbox-release-identity-v2" and .builder_role == "primary" and (.builder_recipe_sha256 | test("^[0-9a-f]{64}$"))' "$identity" >/dev/null || { echo "::error::build identity schema mismatch"; exit 1; }
          identity_unsigned=$(jq -r '.unsigned_sha256' "$identity")
          [[ "$identity_unsigned" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::invalid unsigned digest in build identity"; exit 1; }
          actual_unsigned=$(sha256sum "$root/unsigned.apk" | awk '{print $1}')
          [[ "$identity_unsigned" == "$actual_unsigned" ]] || { echo "::error::actual unsigned APK hash does not match build identity"; exit 1; }
          [[ "$identity_unsigned" == "$EXPECTED_UNSIGNED_SHA256" ]] || { echo "::error::unsigned digest mismatch with builder output"; exit 1; }
          mkdir -p "$RUNNER_TEMP/sign-input"
           cp -- "$root/unsigned.apk" "$RUNNER_TEMP/sign-input/unsigned.apk"
           jq --arg primary "$EXPECTED_PRIMARY_ARTIFACT_ID" \
             --arg primary_digest "$EXPECTED_PRIMARY_ARTIFACT_DIGEST" \
             --arg repro "$EXPECTED_REPRO_ARTIFACT_ID" \
             --arg repro_digest "$EXPECTED_REPRO_ARTIFACT_DIGEST" \
             --arg report_id "$EXPECTED_COMPARISON_REPORT_ARTIFACT_ID" \
             --arg report_digest "$EXPECTED_COMPARISON_REPORT_ARTIFACT_DIGEST" \
             --arg report "$EXPECTED_COMPARISON_REPORT_SHA256" \
             '. + {primary_artifact_id:$primary, primary_artifact_digest:$primary_digest, repro_artifact_id:$repro, repro_artifact_digest:$repro_digest, reproducibility_report_artifact_id:$report_id, reproducibility_report_artifact_digest:$report_digest, reproducibility_report_sha256:$report}' \
             "$root/build-identity.json" > "$RUNNER_TEMP/sign-input/build-identity.json"
           test -z "$(find "$RUNNER_TEMP/sign-input" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" || { echo "::error::sign input contains non-regular entries"; exit 1; }

      - name: Upload sanitized sign input
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.canary_namespace != '' && format('{0}-tvbox-u2-sign-input-{1}-{2}', inputs.canary_namespace, inputs.release_sha, github.run_attempt) || format('tvbox-u2-sign-input-{0}-{1}', inputs.release_sha, github.run_attempt) }}
          path: ${{ runner.temp }}/sign-input
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: false

      - id: outputs
        name: Publish sign input artifact outputs
        env:
          CANARY_NAMESPACE: ${{ inputs.canary_namespace }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          artifact_name="tvbox-u2-sign-input-${RELEASE_SHA}-${RUN_ATTEMPT}"
          if [[ -n "$CANARY_NAMESPACE" ]]; then
            artifact_name="${CANARY_NAMESPACE}-${artifact_name}"
          fi
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

  sign_exact:
    name: Sign exact unsigned APK in isolated environment
    needs: [prepare_sign_input, compare_reproducibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-signing
    permissions:
      contents: none
      actions: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_name: ${{ steps.outputs.outputs.artifact_name }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      EXPECTED_SIGNER_SHA256: ${{ vars.TVBOX_SIGNER_SHA256 }}
      CANARY_NAMESPACE: ${{ inputs.canary_namespace }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      EXPECTED_PRIMARY_ARTIFACT_ID: ${{ needs.prepare_sign_input.outputs.primary_artifact_id }}
      EXPECTED_PRIMARY_ARTIFACT_DIGEST: ${{ needs.prepare_sign_input.outputs.primary_artifact_digest }}
      EXPECTED_REPRO_ARTIFACT_ID: ${{ needs.prepare_sign_input.outputs.repro_artifact_id }}
      EXPECTED_REPRO_ARTIFACT_DIGEST: ${{ needs.prepare_sign_input.outputs.repro_artifact_digest }}
      EXPECTED_COMPARISON_REPORT_ARTIFACT_ID: ${{ needs.prepare_sign_input.outputs.reproducibility_report_artifact_id }}
      EXPECTED_COMPARISON_REPORT_ARTIFACT_DIGEST: ${{ needs.prepare_sign_input.outputs.reproducibility_report_artifact_digest }}
      EXPECTED_COMPARISON_REPORT_SHA256: ${{ needs.prepare_sign_input.outputs.comparison_report_sha256 }}
    steps:
      - name: Set up signer Temurin 17 before secret window
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17.0.20+8'

      - name: Download sanitized sign input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.prepare_sign_input.outputs.artifact_id }}
          path: ${{ runner.temp }}/sign-input

      - name: Validate sign input and rehash actual APK before secret window
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/sign-input"
          for f in unsigned.apk build-identity.json; do
            test -f "$root/$f" || { echo "::error::missing sign input file: $f"; exit 1; }
            test ! -d "$root/$f" || { echo "::error::sign input entry is a directory: $f"; exit 1; }
            test ! -L "$root/$f" || { echo "::error::sign input entry is a symlink: $f"; exit 1; }
          done
          actual_count=$(find "$root" -maxdepth 1 -type f | wc -l | tr -d ' ')
          test "$actual_count" -eq 2 || { echo "::error::sign input file count is $actual_count, expected 2"; exit 1; }
          test -z "$(find "$root" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" || { echo "::error::sign input contains non-regular entries"; exit 1; }
          identity="$root/build-identity.json"
            jq -e \
              --arg primary "$EXPECTED_PRIMARY_ARTIFACT_ID" \
              --arg primary_digest "$EXPECTED_PRIMARY_ARTIFACT_DIGEST" \
              --arg repro "$EXPECTED_REPRO_ARTIFACT_ID" \
              --arg repro_digest "$EXPECTED_REPRO_ARTIFACT_DIGEST" \
              --arg report_id "$EXPECTED_COMPARISON_REPORT_ARTIFACT_ID" \
              --arg report_digest "$EXPECTED_COMPARISON_REPORT_ARTIFACT_DIGEST" \
              --arg report "$EXPECTED_COMPARISON_REPORT_SHA256" \
              '.schema == "tvbox-release-identity-v2" and .builder_role == "primary" and .primary_artifact_id == $primary and .primary_artifact_digest == $primary_digest and .repro_artifact_id == $repro and .repro_artifact_digest == $repro_digest and .reproducibility_report_artifact_id == $report_id and .reproducibility_report_artifact_digest == $report_digest and .reproducibility_report_sha256 == $report and (.unsigned_sha256 | test("^[0-9a-f]{64}$"))' \
              "$identity" >/dev/null || { echo "::error::build identity binding mismatch"; exit 1; }
          identity_unsigned=$(jq -r '.unsigned_sha256' "$identity")
          actual_unsigned=$(sha256sum "$root/unsigned.apk" | awk '{print $1}')
          [[ "$identity_unsigned" == "$actual_unsigned" ]] || { echo "::error::actual unsigned APK hash does not match build identity"; exit 1; }
          mkdir -p "$RUNNER_TEMP/fixed"
          cp -- "$root/unsigned.apk" "$RUNNER_TEMP/fixed/unsigned.apk"
          cp -- "$root/build-identity.json" "$RUNNER_TEMP/fixed/build-identity.json"

      - name: Capture signer JDK identity before secret window
        run: |
          set -euo pipefail
          java -version 2>&1 | tr '\n' ' ' > "$RUNNER_TEMP/signer-java-version.txt"
          grep -q '17.0.20' "$RUNNER_TEMP/signer-java-version.txt"

      - id: sign
        name: Sign exact APK with the only secret-bearing step
        env:
          TVBOX_KEYSTORE_BASE64: ${{ secrets.TVBOX_KEYSTORE_BASE64 }}
          TVBOX_KEY_ALIAS: ${{ secrets.TVBOX_KEY_ALIAS }}
          TVBOX_KEY_PASSWORD: ${{ secrets.TVBOX_KEY_PASSWORD }}
          TVBOX_STORE_PASSWORD: ${{ secrets.TVBOX_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/fixed"
          test -f "$root/unsigned.apk"
          actual_unsigned=$(sha256sum "$root/unsigned.apk" | awk '{print $1}')
          test -n "$TVBOX_KEYSTORE_BASE64"
          test -n "$TVBOX_KEY_ALIAS"
          test -n "$TVBOX_KEY_PASSWORD"
          test -n "$TVBOX_STORE_PASSWORD"
          printf '%s' "$TVBOX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signer.jks"
          chmod 600 "$RUNNER_TEMP/signer.jks"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/signer.jks" \
            --ks-pass env:TVBOX_STORE_PASSWORD \
            --ks-key-alias "$TVBOX_KEY_ALIAS" \
            --key-pass env:TVBOX_KEY_PASSWORD \
            --out "$RUNNER_TEMP/signed.apk" "$root/unsigned.apk"
          rm -f "$RUNNER_TEMP/signer.jks"
          unset TVBOX_KEYSTORE_BASE64 TVBOX_KEY_ALIAS TVBOX_KEY_PASSWORD TVBOX_STORE_PASSWORD
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/signed.apk" | tee "$RUNNER_TEMP/signer-output.txt"
          signer_sha=$(sed -nE 's/.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*/\1/p' "$RUNNER_TEMP/signer-output.txt" | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -n 1)
          expected_sha=$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
           [[ "$signer_sha" =~ ^[0-9a-f]{64}$ && "$signer_sha" == "$expected_sha" ]] || { echo "::error::signer fingerprint mismatch"; exit 1; }
           signed_sha=$(sha256sum "$RUNNER_TEMP/signed.apk" | awk '{print $1}')
           signer_java_version=$(cat "$RUNNER_TEMP/signer-java-version.txt")
           identity_unsigned=$(jq -r '.unsigned_sha256' "$root/build-identity.json")
           mkdir -p "$RUNNER_TEMP/signed-output"
          cp "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/signed-output/signed.apk"
          jq -n \
            --arg schema "tvbox-signer-result-v1" \
            --arg unsigned_sha256 "$identity_unsigned" \
            --arg signed_sha256 "$signed_sha" \
            --arg signer_sha256 "$signer_sha" \
            --arg signer_java_version "$signer_java_version" \
            --arg signer_job "$GITHUB_JOB" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema:$schema, unsigned_sha256:$unsigned_sha256, signed_sha256:$signed_sha256, signer_sha256:$signer_sha256, signer_java_version:$signer_java_version, signer_job:$signer_job, run_id:$run_id, run_attempt:$run_attempt}' > "$RUNNER_TEMP/signed-output/signer-result.json"
           artifact_name="tvbox-u2-signed-output-${RELEASE_SHA}-${RUN_ATTEMPT}"
           if [[ -n "$CANARY_NAMESPACE" ]]; then
             artifact_name="${CANARY_NAMESPACE}-${artifact_name}"
           fi
           echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Remove all signing material before upload
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signer.jks" "$RUNNER_TEMP/signed.apk"
          unset TVBOX_KEYSTORE_BASE64 TVBOX_KEY_ALIAS TVBOX_KEY_PASSWORD TVBOX_STORE_PASSWORD

      - name: Upload exact signed output
        id: upload
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.canary_namespace != '' && format('{0}-tvbox-u2-signed-output-{1}-{2}', inputs.canary_namespace, inputs.release_sha, github.run_attempt) || format('tvbox-u2-signed-output-{0}-{1}', inputs.release_sha, github.run_attempt) }}
          path: ${{ runner.temp }}/signed-output
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: false

      - id: outputs
        if: success()
        env:
          CANARY_NAMESPACE: ${{ inputs.canary_namespace }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          artifact_name="tvbox-u2-signed-output-${RELEASE_SHA}-${RUN_ATTEMPT}"
          if [[ -n "$CANARY_NAMESPACE" ]]; then
            artifact_name="${CANARY_NAMESPACE}-${artifact_name}"
          fi
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

  verify_signed:
    name: Independently verify signed APK without OIDC
    needs: [build_unsigned, compare_reproducibility, sign_exact]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      signed_sha256: ${{ steps.verify.outputs.signed_sha256 }}
      unsigned_sha256: ${{ steps.verify.outputs.unsigned_sha256 }}
      signer_sha256: ${{ steps.verify.outputs.signer_sha256 }}
      reproducibility_report_sha256: ${{ steps.verify.outputs.reproducibility_report_sha256 }}
      primary_artifact_id: ${{ steps.verify.outputs.primary_artifact_id }}
      primary_artifact_digest: ${{ steps.verify.outputs.primary_artifact_digest }}
      repro_artifact_id: ${{ steps.verify.outputs.repro_artifact_id }}
      repro_artifact_digest: ${{ steps.verify.outputs.repro_artifact_digest }}
      reproducibility_report_artifact_id: ${{ steps.verify.outputs.reproducibility_report_artifact_id }}
      reproducibility_report_artifact_digest: ${{ steps.verify.outputs.reproducibility_report_artifact_digest }}
      signed_artifact_id: ${{ steps.verify.outputs.signed_artifact_id }}
      signed_artifact_digest: ${{ steps.verify.outputs.signed_artifact_digest }}
      attest_input_artifact_id: ${{ steps.upload_attest_input.outputs.artifact-id }}
      attest_input_artifact_name: ${{ steps.outputs.outputs.artifact_name }}
    env:
      EXPECTED_SIGNER_SHA256: ${{ vars.TVBOX_SIGNER_SHA256 }}
      CANARY_NAMESPACE: ${{ inputs.canary_namespace }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      BUILD_EVIDENCE_ARTIFACT_ID: ${{ needs.build_unsigned.outputs.artifact_id }}
      SIGNED_OUTPUT_ARTIFACT_ID: ${{ needs.sign_exact.outputs.artifact_id }}
      COMPARISON_REPORT_ARTIFACT_ID: ${{ needs.compare_reproducibility.outputs.report_artifact_id }}
      EXPECTED_PRIMARY_ARTIFACT_ID: ${{ needs.compare_reproducibility.outputs.primary_artifact_id }}
      EXPECTED_REPRO_ARTIFACT_ID: ${{ needs.compare_reproducibility.outputs.repro_artifact_id }}
      EXPECTED_PRIMARY_ARTIFACT_DIGEST: ${{ needs.build_unsigned.outputs.artifact_digest }}
      EXPECTED_REPRO_ARTIFACT_DIGEST: ${{ needs.compare_reproducibility.outputs.repro_artifact_digest }}
      EXPECTED_COMPARISON_REPORT_ARTIFACT_DIGEST: ${{ needs.compare_reproducibility.outputs.report_artifact_digest }}
      EXPECTED_SIGNED_OUTPUT_ARTIFACT_DIGEST: ${{ needs.sign_exact.outputs.artifact_digest }}
      EXPECTED_PRIMARY_UNSIGNED_SHA256: ${{ needs.build_unsigned.outputs.unsigned_sha256 }}
      EXPECTED_COMPARISON_REPORT_SHA256: ${{ needs.compare_reproducibility.outputs.report_sha256 }}
    steps:
      - name: Check out exact release SHA for trusted helper code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out workflow control helpers
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: control-workflow
          fetch-depth: 1
          persist-credentials: false

      - name: Set up verifier Temurin 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17.0.20+8'

      - name: Verify hosted Android toolchain for verifier
        run: |
          set -euo pipefail
          for tool in \
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            "$ANDROID_HOME/build-tools/34.0.0/aapt2" \
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"; do
            test -x "$tool" || { echo "::error::missing verifier tool: $tool"; exit 1; }
          done
          test -f control-workflow/scripts/apk_equivalence.py
          test -f control-workflow/scripts/native_compat.py
          test -f control-workflow/scripts/reproducibility.py

      - name: Download exact build evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build_unsigned.outputs.artifact_id }}
          path: ${{ runner.temp }}/build-evidence
      - name: Download exact signed output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.sign_exact.outputs.artifact_id }}
          path: ${{ runner.temp }}/signed-output
      - name: Download reproducibility comparison report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.compare_reproducibility.outputs.report_artifact_id }}
          path: ${{ runner.temp }}/repro-comparison

      - id: verify
        name: Verify identity and signed-vs-unsigned equivalence
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          validate_root() {
            local root="$1"
            shift
            local actual expected
            actual=$(find "$root" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
            expected=$(printf '%s\n' "$@" | LC_ALL=C sort)
            test "$actual" = "$expected" || { echo "::error::unexpected artifact root: $root"; exit 1; }
            test -z "$(find "$root" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" || {
              echo "::error::artifact root contains non-regular entries: $root"; exit 1;
            }
            for member in "$@"; do
              test -f "$root/$member"
              test ! -L "$root/$member"
            done
          }
          validate_root "$RUNNER_TEMP/build-evidence" \
            unsigned.apk build-identity.json payload-manifest.json native-compat.json \
            runtime-components.json legacy-dependencies.lock.json
           test "$(find "$RUNNER_TEMP/build-evidence" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 6 || {
             echo "::error::build evidence must contain exactly 6 files"; exit 1;
           }
           validate_root "$RUNNER_TEMP/signed-output" signed.apk signer-result.json
           test "$(find "$RUNNER_TEMP/signed-output" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 2 || {
             echo "::error::signed output must contain exactly 2 files"; exit 1;
           }
           validate_root "$RUNNER_TEMP/repro-comparison" reproducibility-report.json
           test "$(find "$RUNNER_TEMP/repro-comparison" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 1 || {
             echo "::error::reproducibility comparison must contain exactly 1 file"; exit 1;
           }
           unsigned="$RUNNER_TEMP/build-evidence/unsigned.apk"
           signed="$RUNNER_TEMP/signed-output/signed.apk"
           test -f "$unsigned"; test -f "$signed"
           builder_identity="$RUNNER_TEMP/build-evidence/build-identity.json"
           test -f "$builder_identity"
           jq -e '.schema == "tvbox-release-identity-v2" and .builder_role == "primary" and (.builder_recipe_sha256 | test("^[0-9a-f]{64}$")) and (.legacy_manifest_sha256 | test("^[0-9a-f]{64}$")) and (.runtime_components_sha256 | test("^[0-9a-f]{64}$")) and (.native_compat_report_sha256 | test("^[0-9a-f]{64}$")) and (.payload_manifest_sha256 | test("^[0-9a-f]{64}$")) and (.java_binary_sha256 | test("^[0-9a-f]{64}$")) and (.apksigner_sha256 | test("^[0-9a-f]{64}$")) and (.apksigner_jar_sha256 | test("^[0-9a-f]{64}$")) and (.aapt2_sha256 | test("^[0-9a-f]{64}$")) and (.zipalign_sha256 | test("^[0-9a-f]{64}$")) and (.llvm_readelf_sha256 | test("^[0-9a-f]{64}$")) and ((.native_compat_status == "clean" and .native_incompatible_count == 0 and .native_incompatible_paths == []) or (.native_compat_status == "known-debt" and .native_incompatible_count == 3 and .native_incompatible_paths == ["lib/arm64-v8a/libconscrypt_jni.so", "lib/arm64-v8a/libquickjs-android-wrapper.so", "lib/arm64-v8a/librtmp-jni.so"])) and .gradle_version == "8.7" and .gradle_distribution_sha256 == "544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d" and .wrapper_jar_sha256 == "cb0da6751c2b753a16ac168bb354870ebb1e162e9083f116729cec9c781156b8" and .agp_version == "8.5.2" and (.apksigner_version | contains("34.0.0")) and (.aapt2_version | contains("34.0.0")) and (.zipalign_version | contains("35.0.0")) and .ndk_version == "28.2.13676358" and (.builder_java_version | contains("17.0.20"))' "$builder_identity" >/dev/null
           recipe_sha=$(sha256sum control-workflow/scripts/u2_build_evidence.sh | awk '{print $1}')
           [[ "$(jq -r '.builder_recipe_sha256' "$builder_identity")" == "$recipe_sha" ]] || { echo "::error::builder recipe is not control-workflow recipe"; exit 1; }
           comparison="$RUNNER_TEMP/repro-comparison/reproducibility-report.json"
           test "$(sha256sum "$comparison" | awk '{print $1}')" = "$EXPECTED_COMPARISON_REPORT_SHA256" || { echo "::error::comparison report digest mismatch"; exit 1; }
            jq -e --arg primary "$EXPECTED_PRIMARY_ARTIFACT_ID" --arg primary_digest "$EXPECTED_PRIMARY_ARTIFACT_DIGEST" --arg repro "$EXPECTED_REPRO_ARTIFACT_ID" --arg repro_digest "$EXPECTED_REPRO_ARTIFACT_DIGEST" --arg unsigned "$EXPECTED_PRIMARY_UNSIGNED_SHA256" \
              '.schema == "tvbox-reproducibility-v1" and .status == "equivalent" and .primary_artifact_id == $primary and .primary_artifact_digest == $primary_digest and .repro_artifact_id == $repro and .repro_artifact_digest == $repro_digest and .primary_builder_role == "primary" and .repro_builder_role == "repro" and .primary_unsigned_sha256 == $unsigned and .primary_artifact_id != .repro_artifact_id' \
             "$comparison" >/dev/null || { echo "::error::reproducibility report binding mismatch"; exit 1; }
           builder_unsigned=$(jq -r '.unsigned_sha256' "$builder_identity")
           builder_payload=$(jq -r '.payload_manifest_sha256' "$builder_identity")
           builder_dependencies=$(jq -r '.runtime_components_sha256' "$builder_identity")
           builder_manifest=$(jq -r '.legacy_manifest_sha256' "$builder_identity")
           builder_native=$(jq -r '.native_compat_report_sha256' "$builder_identity")
           actual_unsigned=$(sha256sum "$unsigned" | awk '{print $1}')
           actual_signed=$(sha256sum "$signed" | awk '{print $1}')
           [[ "$builder_unsigned" == "$actual_unsigned" ]] || { echo "::error::unsigned artifact digest changed"; exit 1; }
           [[ "$builder_payload" == "$(sha256sum "$RUNNER_TEMP/build-evidence/payload-manifest.json" | awk '{print $1}')" ]] || { echo "::error::payload manifest changed"; exit 1; }
           [[ "$builder_dependencies" == "$(sha256sum "$RUNNER_TEMP/build-evidence/runtime-components.json" | awk '{print $1}')" ]] || { echo "::error::canonical dependency report changed"; exit 1; }
           native_report="$RUNNER_TEMP/build-evidence/native-compat.json"
           test -f "$native_report"
           [[ "$builder_native" == "$(sha256sum "$native_report" | awk '{print $1}')" ]] || { echo "::error::native compatibility report changed"; exit 1; }
           llvm_readelf="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
           native_recomputed=$(python3 control-workflow/scripts/native_compat.py \
             --apk "$unsigned" \
             --llvm-readelf "$llvm_readelf" \
             --output "$RUNNER_TEMP/recomputed-native-compat.json")
           [[ "$builder_native" == "$(jq -r '.report_sha256' <<<"$native_recomputed")" ]] || { echo "::error::native compatibility recomputation mismatch"; exit 1; }
           cmp -s "$native_report" "$RUNNER_TEMP/recomputed-native-compat.json" || { echo "::error::native compatibility report bytes differ"; exit 1; }
           manifest_file="$RUNNER_TEMP/build-evidence/legacy-dependencies.lock.json"
           test -f "$manifest_file"
           [[ "$builder_manifest" == "$(sha256sum "$manifest_file" | awk '{print $1}')" ]] || { echo "::error::legacy manifest changed"; exit 1; }
           expected_package='com.github.tvbox.osc'
          expected_name=$(jq -r '.version_name' "$builder_identity")
          expected_code=$(jq -r '.version_code' "$builder_identity")
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$signed" | tee "$RUNNER_TEMP/verify-signature.txt"
          signer_sha=$(sed -nE 's/.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*/\1/p' "$RUNNER_TEMP/verify-signature.txt" | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -n 1)
          expected_sha=$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [[ "$signer_sha" =~ ^[0-9a-f]{64}$ && "$signer_sha" == "$expected_sha" ]] || { echo "::error::verifier signer fingerprint mismatch"; exit 1; }
          signer_result="$RUNNER_TEMP/signed-output/signer-result.json"
          test -f "$signer_result"
          jq -e '.schema == "tvbox-signer-result-v1" and (.signed_sha256 | test("^[0-9a-f]{64}$")) and (.unsigned_sha256 | test("^[0-9a-f]{64}$")) and (.signer_sha256 | test("^[0-9a-f]{64}$"))' "$signer_result" >/dev/null || { echo "::error::signer result schema mismatch"; exit 1; }
          signer_result_signed=$(jq -r '.signed_sha256' "$signer_result")
          [[ "$signer_result_signed" == "$actual_signed" ]] || { echo "::error::signer result signed digest does not match actual signed APK"; exit 1; }
          signer_result_unsigned=$(jq -r '.unsigned_sha256' "$signer_result")
          [[ "$signer_result_unsigned" == "$actual_unsigned" ]] || { echo "::error::signer result unsigned digest does not match actual unsigned APK"; exit 1; }
          badging=$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$signed")
          package_name=$(sed -nE "s/^package: name='([^']+)'.*/\1/p" <<<"$badging" | head -n 1)
          apk_code=$(sed -nE "s/^package:.*versionCode='([^']+)'.*/\1/p" <<<"$badging" | head -n 1)
          apk_name=$(sed -nE "s/^package:.*versionName='([^']+)'.*/\1/p" <<<"$badging" | head -n 1)
          [[ "$package_name" == "$expected_package" && "$apk_code" == "$expected_code" && "$apk_name" == "$expected_name" ]] || {
            echo "::error::verifier package/version mismatch"; exit 1;
          }
            equivalence=$(python3 control-workflow/scripts/apk_equivalence.py \
             --signed "$signed" \
             --unsigned "$unsigned")
           printf '%s\n' "$equivalence" | tee "$RUNNER_TEMP/apk-equivalence.json"
           jq -e '.schema == "tvbox-apk-equivalence-v1" and .status == "equivalent"' \
             "$RUNNER_TEMP/apk-equivalence.json" >/dev/null
           signer_java_version=$(jq -r '.signer_java_version' "$signer_result")
           [[ "$signer_java_version" == *"17.0.20"* ]] || { echo "::error::signer JDK identity mismatch"; exit 1; }
            verifier_image_os="${ImageOS:-unknown}"
            verifier_image_version="${ImageVersion:-unknown}"
            normalize_artifact_digest() {
              local digest="$1"
              if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                printf '%s\n' "$digest"
                return 0
              fi
              if [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then
                printf 'sha256:%s\n' "$digest"
                return 0
              fi
              echo "::error::signed artifact digest is not a normalized SHA-256 value" >&2
              return 1
            }
            signed_artifact_digest_normalized=$(normalize_artifact_digest "$EXPECTED_SIGNED_OUTPUT_ARTIFACT_DIGEST")
            signed_artifact_name="tvbox-u2-signed-output-${RELEASE_SHA}-${GITHUB_RUN_ATTEMPT}"
            if [[ -n "$CANARY_NAMESPACE" ]]; then
              signed_artifact_name="${CANARY_NAMESPACE}-${signed_artifact_name}"
            fi
             mkdir -p "$RUNNER_TEMP/attest-input"
           cp -- "$signed" "$RUNNER_TEMP/attest-input/signed.apk"
           jq -n \
             --argjson builder "$(cat "$builder_identity")" \
             --arg unsigned "$actual_unsigned" \
             --arg signed "$actual_signed" \
             --arg signer "$signer_sha" \
             --arg workflow_source "$GITHUB_SHA" \
             --arg run "$GITHUB_RUN_ID" \
             --arg attempt "$GITHUB_RUN_ATTEMPT" \
             --arg signer_java "$signer_java_version" \
              --arg verifier_image_os "$verifier_image_os" \
              --arg verifier_image_version "$verifier_image_version" \
              --arg comparison_report_sha256 "$EXPECTED_COMPARISON_REPORT_SHA256" \
              --arg primary_artifact_digest "$EXPECTED_PRIMARY_ARTIFACT_DIGEST" \
              --arg repro_artifact_digest "$EXPECTED_REPRO_ARTIFACT_DIGEST" \
              --arg reproducibility_report_artifact_id "$COMPARISON_REPORT_ARTIFACT_ID" \
              --arg reproducibility_report_artifact_digest "$EXPECTED_COMPARISON_REPORT_ARTIFACT_DIGEST" \
              --arg signed_artifact_id "$SIGNED_OUTPUT_ARTIFACT_ID" \
               --arg signed_artifact_digest "$EXPECTED_SIGNED_OUTPUT_ARTIFACT_DIGEST" \
               --arg primary_artifact_id "$EXPECTED_PRIMARY_ARTIFACT_ID" \
               --arg repro_artifact_id "$EXPECTED_REPRO_ARTIFACT_ID" \
               --arg canary_namespace "$CANARY_NAMESPACE" \
               --arg canary_release_sha "$RELEASE_SHA" \
               --arg canary_source_sha "$SOURCE_SHA" \
               --arg canary_signed_artifact_name "$signed_artifact_name" \
               --arg canary_signed_artifact_digest "$signed_artifact_digest_normalized" \
               --arg reproducibility_status "$(jq -r '.status' "$comparison")" \
               --argjson runner_image_drift "$(jq -r '.runner_image_drift' "$comparison")" \
               '$builder + {schema:"tvbox-release-identity-v2", unsigned_sha256:$unsigned, signed_sha256:$signed, signer_sha256:$signer, signer_java_version:$signer_java, verifier_image_os:$verifier_image_os, verifier_image_version:$verifier_image_version, verifier_workflow_source_sha:$workflow_source, run_id:$run, run_attempt:$attempt, primary_artifact_id:$primary_artifact_id, primary_artifact_digest:$primary_artifact_digest, repro_artifact_id:$repro_artifact_id, repro_artifact_digest:$repro_artifact_digest, reproducibility_report_artifact_id:$reproducibility_report_artifact_id, reproducibility_report_artifact_digest:$reproducibility_report_artifact_digest, reproducibility_report_sha256:$comparison_report_sha256, signed_artifact_id:$signed_artifact_id, signed_artifact_digest:$signed_artifact_digest, reproducibility_status:$reproducibility_status, runner_image_drift:$runner_image_drift} + (if $canary_namespace == "" then {} else {canary_namespace:$canary_namespace, canary_release_sha:$canary_release_sha, canary_source_sha:$canary_source_sha, canary_signed_artifact_name:$canary_signed_artifact_name, canary_signed_artifact_digest:$canary_signed_artifact_digest, canary_run_id:$run, canary_run_attempt:$attempt} end)' \
               > "$RUNNER_TEMP/attest-input/release-identity-predicate.json"
           test "$(find "$RUNNER_TEMP/attest-input" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 2 || {
             echo "::error::attest input must contain exactly 2 files"; exit 1;
           }
            echo "unsigned_sha256=$actual_unsigned" >> "$GITHUB_OUTPUT"
            echo "signed_sha256=$actual_signed" >> "$GITHUB_OUTPUT"
            echo "signer_sha256=$signer_sha" >> "$GITHUB_OUTPUT"
            echo "reproducibility_report_sha256=$EXPECTED_COMPARISON_REPORT_SHA256" >> "$GITHUB_OUTPUT"
            echo "primary_artifact_id=$EXPECTED_PRIMARY_ARTIFACT_ID" >> "$GITHUB_OUTPUT"
            echo "primary_artifact_digest=$EXPECTED_PRIMARY_ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"
            echo "repro_artifact_id=$EXPECTED_REPRO_ARTIFACT_ID" >> "$GITHUB_OUTPUT"
            echo "repro_artifact_digest=$EXPECTED_REPRO_ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"
            echo "reproducibility_report_artifact_id=$COMPARISON_REPORT_ARTIFACT_ID" >> "$GITHUB_OUTPUT"
            echo "reproducibility_report_artifact_digest=$EXPECTED_COMPARISON_REPORT_ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"
            echo "signed_artifact_id=$SIGNED_OUTPUT_ARTIFACT_ID" >> "$GITHUB_OUTPUT"
            echo "signed_artifact_digest=$EXPECTED_SIGNED_OUTPUT_ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Upload verifier-produced attest input
        id: upload_attest_input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.canary_namespace != '' && format('{0}-tvbox-u2-attest-input-{1}-{2}', inputs.canary_namespace, inputs.release_sha, github.run_attempt) || format('tvbox-u2-attest-input-{0}-{1}', inputs.release_sha, github.run_attempt) }}
          path: ${{ runner.temp }}/attest-input
          if-no-files-found: error
          retention-days: 90
          overwrite: false

      - id: outputs
        name: Publish attest input artifact outputs
        env:
          CANARY_NAMESPACE: ${{ inputs.canary_namespace }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          artifact_name="tvbox-u2-attest-input-${RELEASE_SHA}-${RUN_ATTEMPT}"
          if [[ -n "$CANARY_NAMESPACE" ]]; then
            artifact_name="${CANARY_NAMESPACE}-${artifact_name}"
          fi
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

  attest_signed:
    name: Attest verified signed APK with minimal OIDC
    needs: verify_signed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: none
      actions: read
      id-token: write
      attestations: write
    outputs:
      default_attestation_id: ${{ steps.default_attest.outputs.attestation-id }}
      custom_attestation_id: ${{ steps.custom_attest.outputs.attestation-id }}
    env:
      EXPECTED_PRIMARY_ARTIFACT_ID: ${{ needs.verify_signed.outputs.primary_artifact_id }}
      EXPECTED_PRIMARY_ARTIFACT_DIGEST: ${{ needs.verify_signed.outputs.primary_artifact_digest }}
      EXPECTED_REPRO_ARTIFACT_ID: ${{ needs.verify_signed.outputs.repro_artifact_id }}
      EXPECTED_REPRO_ARTIFACT_DIGEST: ${{ needs.verify_signed.outputs.repro_artifact_digest }}
      EXPECTED_REPRODUCIBILITY_REPORT_ARTIFACT_ID: ${{ needs.verify_signed.outputs.reproducibility_report_artifact_id }}
      EXPECTED_REPRODUCIBILITY_REPORT_ARTIFACT_DIGEST: ${{ needs.verify_signed.outputs.reproducibility_report_artifact_digest }}
      EXPECTED_SIGNED_ARTIFACT_ID: ${{ needs.verify_signed.outputs.signed_artifact_id }}
      EXPECTED_SIGNED_ARTIFACT_DIGEST: ${{ needs.verify_signed.outputs.signed_artifact_digest }}
      EXPECTED_REPRODUCIBILITY_REPORT_SHA256: ${{ needs.verify_signed.outputs.reproducibility_report_sha256 }}
    steps:
      - name: Download verifier-produced attest input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.verify_signed.outputs.attest_input_artifact_id }}
          path: ${{ runner.temp }}/attest-input

      - id: verify_input
        name: Validate attest input file set
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/attest-input"
          expected_files="signed.apk release-identity-predicate.json"
          actual=$(find "$root" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
          expected=$(printf '%s\n' $expected_files | LC_ALL=C sort)
          test "$actual" = "$expected" || { echo "::error::unexpected attest input root"; exit 1; }
          test "$(find "$root" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 2 || {
            echo "::error::attest input must contain exactly 2 files"; exit 1;
          }
          test -z "$(find "$root" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" || {
            echo "::error::attest input contains non-regular entries"; exit 1;
          }
          signed="$root/signed.apk"
          predicate="$root/release-identity-predicate.json"
          test ! -L "$signed"
          test ! -L "$predicate"
          actual_signed=$(sha256sum "$signed" | awk '{print $1}')
          expected_signed="${{ needs.verify_signed.outputs.signed_sha256 }}"
          expected_unsigned="${{ needs.verify_signed.outputs.unsigned_sha256 }}"
          test "$actual_signed" = "$expected_signed" || { echo "::error::attest subject digest mismatch"; exit 1; }
           jq -e --arg signed "$expected_signed" --arg unsigned "$expected_unsigned" --arg primary "$EXPECTED_PRIMARY_ARTIFACT_ID" --arg primary_digest "$EXPECTED_PRIMARY_ARTIFACT_DIGEST" --arg repro "$EXPECTED_REPRO_ARTIFACT_ID" --arg repro_digest "$EXPECTED_REPRO_ARTIFACT_DIGEST" --arg report_id "$EXPECTED_REPRODUCIBILITY_REPORT_ARTIFACT_ID" --arg report_digest "$EXPECTED_REPRODUCIBILITY_REPORT_ARTIFACT_DIGEST" --arg report "$EXPECTED_REPRODUCIBILITY_REPORT_SHA256" --arg signed_id "$EXPECTED_SIGNED_ARTIFACT_ID" --arg signed_digest "$EXPECTED_SIGNED_ARTIFACT_DIGEST" \
             '.schema == "tvbox-release-identity-v2" and .signed_sha256 == $signed and .unsigned_sha256 == $unsigned and .primary_artifact_id == $primary and .primary_artifact_digest == $primary_digest and .repro_artifact_id == $repro and .repro_artifact_digest == $repro_digest and .reproducibility_report_artifact_id == $report_id and .reproducibility_report_artifact_digest == $report_digest and .reproducibility_report_sha256 == $report and .signed_artifact_id == $signed_id and .signed_artifact_digest == $signed_digest and .reproducibility_status == "equivalent"' \
             "$predicate" >/dev/null || { echo "::error::attest predicate identity mismatch"; exit 1; }

      - id: default_attest
        name: Attest signed APK with GitHub build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/attest-input/signed.apk
          push-to-registry: false

      - id: custom_attest
        name: Attest project-specific release identity
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/attest-input/signed.apk
          predicate-type: https://slashinchi.github.io/TVBoxOS-Mobile/tvbox-release-identity/v2
          predicate-path: ${{ runner.temp }}/attest-input/release-identity-predicate.json
          push-to-registry: false
          create-storage-record: false
