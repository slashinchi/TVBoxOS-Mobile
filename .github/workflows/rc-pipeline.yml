name: TVBox Exact-SHA RC Pipeline

on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact commit whose app bytes are released.
        required: true
        type: string
      source_sha:
        description: Generic source identity bound to the release commit.
        required: true
        type: string
      mode:
        description: auto-upstream or manual-local.
        required: true
        type: string
      upstream_sha:
        description: Proven integrated upstream commit; manual mode derives it when empty.
        required: false
        default: ''
        type: string
      upstream_version:
        description: Exact upstream versionName for automatic mode.
        required: false
        default: ''
        type: string
      upstream_code:
        description: Exact upstream versionCode for automatic mode.
        required: false
        default: ''
        type: string
      expected_version_name:
        description: Expected release versionName; manual mode derives it when empty.
        required: false
        default: ''
        type: string
      expected_version_code:
        description: Expected release versionCode; manual mode derives it when empty.
        required: false
        default: ''
        type: string
      release_debt:
        description: SHA-256 release-debt fingerprint; manual mode derives it when empty.
        required: false
        default: ''
        type: string
      candidate_pr:
        description: Qualified U1 candidate PR number, omitted for manual mode.
        required: false
        default: ''
        type: string
      provenance_marker:
        description: Exact U1 v2 provenance marker for automatic mode.
        required: false
        default: ''
        type: string
    outputs:
      unsigned_artifact_id:
        description: Actions artifact ID for the exact unsigned APK bundle.
        value: ${{ jobs.build_unsigned.outputs.artifact_id }}
      unsigned_artifact_name:
        description: Actions artifact name for the exact unsigned APK bundle.
        value: ${{ jobs.build_unsigned.outputs.artifact_name }}
      unsigned_artifact_digest:
        description: Actions transport digest for the unsigned bundle.
        value: ${{ jobs.build_unsigned.outputs.artifact_digest }}
      signed_artifact_id:
        description: Actions artifact ID for the exact signed APK bundle.
        value: ${{ jobs.sign_exact.outputs.artifact_id }}
      signed_artifact_name:
        description: Actions artifact name for the exact signed APK bundle.
        value: ${{ jobs.sign_exact.outputs.artifact_name }}
      signed_artifact_digest:
        description: Actions transport digest for the signed bundle.
        value: ${{ jobs.sign_exact.outputs.artifact_digest }}
      unsigned_sha256:
        description: Raw SHA-256 of the exact AGP-produced unsigned APK.
        value: ${{ jobs.build_unsigned.outputs.unsigned_sha256 }}
      signed_sha256:
        description: Raw SHA-256 of the exact signed APK.
        value: ${{ jobs.verify_signed.outputs.signed_sha256 }}
      signer_sha256:
        description: SHA-256 certificate fingerprint of the signed APK.
        value: ${{ jobs.verify_signed.outputs.signer_sha256 }}
      default_attestation_id:
        description: GitHub default build-provenance attestation ID.
        value: ${{ jobs.attest_signed.outputs.default_attestation_id }}
      custom_attestation_id:
        description: Project-specific release-identity attestation ID.
        value: ${{ jobs.attest_signed.outputs.custom_attestation_id }}

permissions:
  contents: read
  actions: read

jobs:
  build_unsigned:
    name: Build exact unsigned APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_name: ${{ steps.outputs.outputs.artifact_name }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      unsigned_sha256: ${{ steps.build.outputs.unsigned_sha256 }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      MODE: ${{ inputs.mode }}
      INPUT_UPSTREAM_SHA: ${{ inputs.upstream_sha }}
      INPUT_UPSTREAM_VERSION: ${{ inputs.upstream_version }}
      INPUT_UPSTREAM_CODE: ${{ inputs.upstream_code }}
      INPUT_VERSION_NAME: ${{ inputs.expected_version_name }}
      INPUT_VERSION_CODE: ${{ inputs.expected_version_code }}
      INPUT_RELEASE_DEBT: ${{ inputs.release_debt }}
      INPUT_CANDIDATE_PR: ${{ inputs.candidate_pr }}
      INPUT_PROVENANCE_MARKER: ${{ inputs.provenance_marker }}
    steps:
      - name: Check out exact release SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up builder Temurin 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17.0.20+8'

      - name: Stage pinned legacy dependencies
        run: |
          set -euo pipefail
          legacy_repo="$RUNNER_TEMP/tvbox-legacy-maven"
          python3 scripts/legacy_staging.py stage \
            --manifest gradle/legacy-dependencies.lock.json \
            --output "$legacy_repo"
          python3 scripts/legacy_staging.py verify \
            --manifest gradle/legacy-dependencies.lock.json \
            --output "$legacy_repo"
          manifest_sha=$(python3 scripts/legacy_staging.py manifest-digest \
            --manifest gradle/legacy-dependencies.lock.json | jq -r '.manifest_sha256')
          test "$manifest_sha" != "null"
          echo "TVBOX_LEGACY_REPO=$legacy_repo" >> "$GITHUB_ENV"
          echo "TVBOX_LEGACY_MANIFEST_SHA256=$manifest_sha" >> "$GITHUB_ENV"

      - id: identity
        name: Qualify source, version, debt and toolchain
        run: |
          set -euo pipefail
          export GRADLE_USER_HOME="$RUNNER_TEMP/tvbox-gradle"
          mkdir -p build/evidence
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if [[ "$MODE" == "manual-local" ]]; then
            test "$RELEASE_SHA" = "$SOURCE_SHA"
            git fetch --no-tags origin +refs/heads/patched:refs/remotes/origin/patched
            test "$(git rev-parse refs/remotes/origin/patched)" = "$RELEASE_SHA"
          else
            parent_sha=$(git rev-list --parents -n 1 HEAD | awk '{print $2}')
            test "$parent_sha" = "$SOURCE_SHA" || {
              echo "::error::automatic mode release/source parent identity mismatch"
              exit 1
            }
          fi
          case "$MODE" in auto-upstream|manual-local) ;; *) echo "::error::unsupported mode"; exit 1 ;; esac

          version_json=$(python3 scripts/u2_release.py parse-app-version --file app/build.gradle)
          version_name=$(jq -r '.versionName' <<<"$version_json")
          version_code=$(jq -r '.versionCode' <<<"$version_json")
          if [[ -n "$INPUT_VERSION_NAME" && "$version_name" != "$INPUT_VERSION_NAME" ]]; then
            echo "::error::release versionName mismatch"; exit 1
          fi
          if [[ -n "$INPUT_VERSION_CODE" && "$version_code" != "$INPUT_VERSION_CODE" ]]; then
            echo "::error::release versionCode mismatch"; exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          upstream_sha="$INPUT_UPSTREAM_SHA"
          upstream_version="$INPUT_UPSTREAM_VERSION"
          upstream_code="$INPUT_UPSTREAM_CODE"
          if [[ "$MODE" == "manual-local" && -z "$upstream_sha" ]]; then
            upstream_sha=$(git merge-base "$RELEASE_SHA" refs/remotes/origin/main)
            upstream_file="$RUNNER_TEMP/integrated-upstream-build.gradle"
            git show "$upstream_sha:app/build.gradle" > "$upstream_file"
            upstream_json=$(python3 scripts/u2_release.py parse-app-version --file "$upstream_file")
            upstream_version=$(jq -r '.versionName' <<<"$upstream_json")
            upstream_code=$(jq -r '.versionCode' <<<"$upstream_json")
          fi
          if [[ "$MODE" == "auto-upstream" ]]; then
            [[ -n "$upstream_sha" && -n "$upstream_version" && -n "$upstream_code" ]] || {
              echo "::error::automatic mode requires integrated upstream identity"; exit 1;
            }
            [[ -n "$INPUT_PROVENANCE_MARKER" ]] || { echo "::error::automatic mode requires v2 provenance"; exit 1; }
            marker_json=$(python3 scripts/u2_release.py parse-provenance-marker --marker "$INPUT_PROVENANCE_MARKER")
            [[ "$(jq -r '.upstream' <<<"$marker_json")" == "$upstream_sha" ]] || { echo "::error::provenance upstream mismatch"; exit 1; }
            [[ "$(jq -r '.upstreamVersion' <<<"$marker_json")" == "$upstream_version" ]] || { echo "::error::provenance version mismatch"; exit 1; }
            [[ "$(jq -r '.upstreamCode' <<<"$marker_json")" == "$upstream_code" ]] || { echo "::error::provenance code mismatch"; exit 1; }
            candidate_sha=$(jq -r '.candidate' <<<"$marker_json")
            candidate_tree=$(jq -r '.tree' <<<"$marker_json")
            git merge-base --is-ancestor "$candidate_sha" "$SOURCE_SHA"
            test "$(git rev-parse "$candidate_sha^{tree}")" = "$candidate_tree"
          else
            test -z "$INPUT_PROVENANCE_MARKER"
          fi
          python3 - "$upstream_sha" "$upstream_version" "$upstream_code" <<'PY'
          import re
          import sys
          if not re.fullmatch(r"[0-9a-f]{40}", sys.argv[1]):
              raise SystemExit("invalid upstream SHA")
          if not re.fullmatch(r"[0-9]+(?:\.[0-9]+)+", sys.argv[2]):
              raise SystemExit("invalid upstream version")
          if not re.fullmatch(r"[1-9][0-9]*", sys.argv[3]):
              raise SystemExit("invalid upstream code")
          PY

          debt="$INPUT_RELEASE_DEBT"
          if [[ -z "$debt" ]]; then
            baseline_tag=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
            [[ -n "$baseline_tag" ]] || { echo "::error::manual mode requires a canonical release baseline"; exit 1; }
            exclusions=(
              '.github/workflows/' 'AGENTS.md' 'README.md' 'docs/' 'update.json'
              'scripts/upstream_monitor.py' 'scripts/tests/' 'scripts/u2_release.py'
              'scripts/sync_release_metadata.sh' 'CHANGELOG.md' 'LICENSE.md' 'NOTICE.md'
            )
            manifest_args=()
            for exclusion in "${exclusions[@]}"; do manifest_args+=(--exclude "$exclusion"); done
            python3 scripts/u2_release.py debt-manifest --repo . --baseline "$baseline_tag" --current "$RELEASE_SHA" "${manifest_args[@]}" > "$RUNNER_TEMP/release-debt.json"
            debt=$(python3 scripts/u2_release.py fingerprint-manifest --file "$RUNNER_TEMP/release-debt.json")
          fi
          [[ "$debt" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::invalid release-debt fingerprint"; exit 1; }

           image_os="${ImageOS:-}"
           image_version="${ImageVersion:-}"
           [[ -n "$image_os" && -n "$image_version" ]] || { echo "::error::hosted runner image identity is unavailable"; exit 1; }
           runner_image=$(uname -a)
           java_version=$(java -version 2>&1 | tr '\n' ' ')
           [[ "$java_version" == *"17.0.20"* ]] || { echo "::error::builder JDK is not Temurin 17.0.20"; exit 1; }
           test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
           test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
           test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
           ndk_root="$ANDROID_HOME/ndk/28.2.13676358"
           llvm_readelf="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
           test -x "$llvm_readelf"
           chmod +x gradlew
           gradle_version=$(./gradlew --version | sed -nE 's/^Gradle ([^ ]+).*/\1/p' | head -n 1)
           [[ "$gradle_version" == "8.7" ]] || { echo "::error::unexpected Gradle version: $gradle_version"; exit 1; }
           gradle_distribution_sha=$(sed -nE 's/^distributionSha256Sum=([0-9a-f]{64})/\1/p' gradle/wrapper/gradle-wrapper.properties)
           wrapper_jar_sha=$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')
           agp_version=$(sed -nE 's/.*com.android.tools.build:gradle:([^" ]+).*/\1/p' build.gradle | head -n 1)
           apksigner_path="$ANDROID_HOME/build-tools/34.0.0/apksigner"
           zipalign_path="$ANDROID_HOME/build-tools/35.0.0/zipalign"
           apksigner_version="34.0.0"
           zipalign_version="35.0.0"
           ndk_version="28.2.13676358"
           legacy_manifest_sha="${TVBOX_LEGACY_MANIFEST_SHA256:-}"
           [[ "$legacy_manifest_sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::legacy manifest digest is unavailable"; exit 1; }
           printf '%s\n' \
            "workflow_source_sha=$GITHUB_SHA" \
            "artifact_source_sha=$RELEASE_SHA" \
            "source_sha=$SOURCE_SHA" \
            "mode=$MODE" \
            "upstream_sha=$upstream_sha" \
            "upstream_version=$upstream_version" \
            "upstream_code=$upstream_code" \
            "version_name=$version_name" \
            "version_code=$version_code" \
            "release_debt=$debt" \
             "candidate_pr=$INPUT_CANDIDATE_PR" \
             "provenance_marker=$INPUT_PROVENANCE_MARKER" \
             "legacy_manifest_sha256=$legacy_manifest_sha" \
             "runner_image_os=$image_os" \
             "runner_image_version=$image_version" \
             "runner_image=$runner_image" \
             "builder_java_version=$java_version" \
             "gradle_version=$gradle_version" \
             "gradle_distribution_sha256=$gradle_distribution_sha" \
             "wrapper_jar_sha256=$wrapper_jar_sha" \
             "agp_version=$agp_version" \
             "apksigner=$apksigner_path" \
             "apksigner_version=$apksigner_version" \
             "zipalign=$zipalign_path" \
             "zipalign_version=$zipalign_version" \
             "ndk=$ndk_root" \
             "ndk_version=$ndk_version" > build/evidence/build-identity.txt
           jq -n \
            --arg workflow_source_sha "$GITHUB_SHA" \
            --arg artifact_source_sha "$RELEASE_SHA" \
            --arg source_sha "$SOURCE_SHA" \
            --arg mode "$MODE" \
            --arg upstream_sha "$upstream_sha" \
            --arg upstream_version "$upstream_version" \
            --arg upstream_code "$upstream_code" \
            --arg version_name "$version_name" \
            --arg version_code "$version_code" \
            --arg release_debt "$debt" \
             --arg candidate_pr "$INPUT_CANDIDATE_PR" \
             --arg provenance_marker "$INPUT_PROVENANCE_MARKER" \
             --arg legacy_manifest_sha256 "$legacy_manifest_sha" \
             --arg runner_image_os "$image_os" \
             --arg runner_image_version "$image_version" \
             --arg builder_java_version "$java_version" \
             --arg gradle_version "$gradle_version" \
             --arg gradle_distribution_sha256 "$gradle_distribution_sha" \
             --arg wrapper_jar_sha256 "$wrapper_jar_sha" \
             --arg agp_version "$agp_version" \
             --arg apksigner_path "$apksigner_path" \
             --arg apksigner_version "$apksigner_version" \
             --arg zipalign_path "$zipalign_path" \
             --arg zipalign_version "$zipalign_version" \
             --arg ndk_version "$ndk_version" \
             '{schema:"tvbox-release-identity-v2", workflow_source_sha:$workflow_source_sha, artifact_source_sha:$artifact_source_sha, source_sha:$source_sha, mode:$mode, upstream_sha:$upstream_sha, upstream_version:$upstream_version, upstream_code:($upstream_code|tonumber), version_name:$version_name, version_code:$version_code, release_debt:$release_debt, candidate_pr:$candidate_pr, provenance_marker:$provenance_marker, legacy_manifest_sha256:$legacy_manifest_sha256, runner_image_os:$runner_image_os, runner_image_version:$runner_image_version, builder_java_version:$builder_java_version, gradle_version:$gradle_version, gradle_distribution_sha256:$gradle_distribution_sha256, wrapper_jar_sha256:$wrapper_jar_sha256, agp_version:$agp_version, apksigner_path:$apksigner_path, apksigner_version:$apksigner_version, zipalign_path:$zipalign_path, zipalign_version:$zipalign_version, ndk_version:$ndk_version}' > build/evidence/build-identity.json
          printf '%s\n' "$RELEASE_SHA" > build/evidence/release-source.txt
          {
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "upstream_sha=$upstream_sha"
            echo "upstream_version=$upstream_version"
            echo "upstream_code=$upstream_code"
            echo "release_debt=$debt"
          } > build/evidence/release-fields.env

      - id: build
        name: Build with no signing material
        env:
          TVBOX_KEYSTORE_BASE64: ''
          TVBOX_KEY_ALIAS: ''
          TVBOX_KEY_PASSWORD: ''
          TVBOX_STORE_PASSWORD: ''
        run: |
          set -euo pipefail
          export GRADLE_USER_HOME="$RUNNER_TEMP/tvbox-gradle"
          ./gradlew :app:assembleRelease --stacktrace --no-daemon
          mapfile -t apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print)
          [[ "${#apks[@]}" -eq 1 ]] || { echo "::error::expected exactly one release APK"; exit 1; }
          apk="${apks[0]}"
          mkdir -p build/evidence/unsigned
          cp -- "$apk" build/evidence/unsigned/unsigned.apk
          if "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify build/evidence/unsigned/unsigned.apk; then
            echo "::error::builder produced a signed APK"; exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 build/evidence/unsigned/unsigned.apk
          badging=$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging build/evidence/unsigned/unsigned.apk)
          package_name=$(sed -nE "s/^package: name='([^']+)'.*/\1/p" <<<"$badging" | head -n 1)
          apk_code=$(sed -nE "s/^package:.*versionCode='([^']+)'.*/\1/p" <<<"$badging" | head -n 1)
          apk_name=$(sed -nE "s/^package:.*versionName='([^']+)'.*/\1/p" <<<"$badging" | head -n 1)
          fields=$(cat build/evidence/release-fields.env)
          [[ "$package_name" == 'com.github.tvbox.osc' ]] || { echo "::error::package mismatch"; exit 1; }
          [[ "$apk_code" == "$(sed -n 's/^version_code=//p' build/evidence/release-fields.env)" ]] || { echo "::error::versionCode mismatch"; exit 1; }
          [[ "$apk_name" == "$(sed -n 's/^version_name=//p' build/evidence/release-fields.env)" ]] || { echo "::error::versionName mismatch"; exit 1; }

          python3 - build/evidence/unsigned/unsigned.apk <<'PY'
          import base64
          import hashlib
          import json
          import pathlib
          import sys
          import zipfile

          apk = pathlib.Path(sys.argv[1])
          entries = []
          with zipfile.ZipFile(apk) as archive:
              for info in sorted(archive.infolist(), key=lambda item: item.filename.encode()):
                  if info.is_dir():
                      continue
                  data = archive.read(info)
                  encoded = base64.b64encode(info.filename.encode('utf-8', 'surrogateescape')).decode('ascii')
                  entries.append({"path_b64": encoded, "sha256": hashlib.sha256(data).hexdigest(), "size": len(data), "method": info.compress_type})
          pathlib.Path('build/evidence/unsigned/payload-manifest.json').write_text(json.dumps(entries, sort_keys=True, separators=(',', ':')) + '\n')
          PY

          llvm_readelf="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          # Native compatibility rule: every PT_LOAD p_align >= 0x4000.
          native_result=$(python3 scripts/native_compat.py \
            --apk build/evidence/unsigned/unsigned.apk \
            --llvm-readelf "$llvm_readelf" \
            --output build/evidence/unsigned/native-compat.json)
          native_report_sha=$(jq -r '.report_sha256' <<<"$native_result")
          native_status=$(jq -r '.status' <<<"$native_result")
          native_incompatible_count=$(jq -r '.incompatible_count' <<<"$native_result")
          native_incompatible_paths=$(jq -c '.incompatible_paths' <<<"$native_result")
          [[ "$native_report_sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::invalid native compatibility report digest"; exit 1; }
           ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > build/evidence/unsigned/releaseRuntimeClasspath.txt
           python3 scripts/u2_release.py canonical-runtime-dependencies \
             --file build/evidence/unsigned/releaseRuntimeClasspath.txt \
             --configuration releaseRuntimeClasspath > build/evidence/unsigned/runtime-components.json
           unsigned_sha256=$(sha256sum build/evidence/unsigned/unsigned.apk | awk '{print $1}')
           payload_sha256=$(sha256sum build/evidence/unsigned/payload-manifest.json | awk '{print $1}')
           dependency_sha256=$(sha256sum build/evidence/unsigned/runtime-components.json | awk '{print $1}')
           raw_dependency_sha256=$(sha256sum build/evidence/unsigned/releaseRuntimeClasspath.txt | awk '{print $1}')
           jq --arg unsigned "$unsigned_sha256" \
             --arg payload "$payload_sha256" \
             --arg dependencies "$dependency_sha256" \
             '. + {unsigned_sha256:$unsigned, payload_manifest_sha256:$payload, runtime_components_sha256:$dependencies}' \
             build/evidence/build-identity.json > build/evidence/build-identity.json.tmp
           mv build/evidence/build-identity.json.tmp build/evidence/build-identity.json
           jq --arg native_report "$native_report_sha" \
             --arg native_status "$native_status" \
             --arg native_count "$native_incompatible_count" \
             --argjson native_paths "$native_incompatible_paths" \
             '. + {native_compat_report_sha256:$native_report, native_compat_status:$native_status, native_incompatible_count:($native_count|tonumber), native_incompatible_paths:$native_paths}' \
             build/evidence/build-identity.json > build/evidence/build-identity.json.tmp
           mv build/evidence/build-identity.json.tmp build/evidence/build-identity.json
           printf '%s\n' \
             "unsigned_sha256=$unsigned_sha256" \
             "payload_manifest_sha256=$payload_sha256" \
             "runtime_components_sha256=$dependency_sha256" \
             "raw_dependency_report_sha256=$raw_dependency_sha256" \
             "native_compat_report_sha256=$native_report_sha" \
             "native_compat_status=$native_status" \
             "native_incompatible_count=$native_incompatible_count" \
             "native_incompatible_paths=$native_incompatible_paths" \
             "package=$package_name" \
            "version_name=$apk_name" \
            "version_code=$apk_code" >> build/evidence/build-identity.txt
          echo "unsigned_sha256=$unsigned_sha256" >> "$GITHUB_OUTPUT"

      - name: Assemble flat build evidence artifact
        run: |
          set -euo pipefail
          cp -- build/evidence/unsigned/unsigned.apk build/evidence/unsigned.apk
          cp -- build/evidence/unsigned/payload-manifest.json build/evidence/payload-manifest.json
          cp -- build/evidence/unsigned/native-compat.json build/evidence/native-compat.json
          cp -- build/evidence/unsigned/runtime-components.json build/evidence/runtime-components.json
          cp -- gradle/legacy-dependencies.lock.json build/evidence/legacy-dependencies.lock.json
          rm -rf build/evidence/unsigned
          find build/evidence -type f ! -name 'unsigned.apk' ! -name 'build-identity.json' ! -name 'payload-manifest.json' ! -name 'native-compat.json' ! -name 'runtime-components.json' ! -name 'legacy-dependencies.lock.json' -delete
          ls -la build/evidence
          test "$(find build/evidence -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 6 || { echo "::error::build evidence must contain exactly 6 files"; exit 1; }

      - name: Upload exact unsigned build evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tvbox-u2-build-evidence-${{ inputs.release_sha }}-${{ github.run_attempt }}
          path: build/evidence
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: false

      - id: outputs
        name: Publish unsigned artifact outputs
        run: |
          set -euo pipefail
          artifact_name="tvbox-u2-build-evidence-${{ inputs.release_sha }}-${{ github.run_attempt }}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

  prepare_sign_input:
    name: Prepare sanitized sign input without secrets
    needs: build_unsigned
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_name: ${{ steps.outputs.outputs.artifact_name }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      EXPECTED_UNSIGNED_SHA256: ${{ needs.build_unsigned.outputs.unsigned_sha256 }}
    steps:
      - name: Download exact build evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build_unsigned.outputs.artifact_id }}
          path: ${{ runner.temp }}/build-evidence

      - name: Validate flat build evidence and actual APK hash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/build-evidence"
          expected_files="unsigned.apk build-identity.json payload-manifest.json native-compat.json runtime-components.json legacy-dependencies.lock.json"
          for f in $expected_files; do
            test -f "$root/$f" || { echo "::error::missing build evidence file: $f"; exit 1; }
            test ! -d "$root/$f" || { echo "::error::build evidence entry is a directory: $f"; exit 1; }
            test ! -L "$root/$f" || { echo "::error::build evidence entry is a symlink: $f"; exit 1; }
          done
          actual_count=$(find "$root" -maxdepth 1 -type f | wc -l | tr -d ' ')
          test "$actual_count" -eq 6 || { echo "::error::build evidence file count is $actual_count, expected 6"; exit 1; }
          test -z "$(find "$root" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" || { echo "::error::build evidence contains non-regular entries"; exit 1; }
          identity="$root/build-identity.json"
          jq -e '.schema == "tvbox-release-identity-v2"' "$identity" >/dev/null || { echo "::error::build identity schema mismatch"; exit 1; }
          identity_unsigned=$(jq -r '.unsigned_sha256' "$identity")
          [[ "$identity_unsigned" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::invalid unsigned digest in build identity"; exit 1; }
          actual_unsigned=$(sha256sum "$root/unsigned.apk" | awk '{print $1}')
          [[ "$identity_unsigned" == "$actual_unsigned" ]] || { echo "::error::actual unsigned APK hash does not match build identity"; exit 1; }
          [[ "$identity_unsigned" == "$EXPECTED_UNSIGNED_SHA256" ]] || { echo "::error::unsigned digest mismatch with builder output"; exit 1; }
          mkdir -p "$RUNNER_TEMP/sign-input"
          cp -- "$root/unsigned.apk" "$RUNNER_TEMP/sign-input/unsigned.apk"
          cp -- "$root/build-identity.json" "$RUNNER_TEMP/sign-input/build-identity.json"
          test -z "$(find "$RUNNER_TEMP/sign-input" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" || { echo "::error::sign input contains non-regular entries"; exit 1; }

      - name: Upload sanitized sign input
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tvbox-u2-sign-input-${{ inputs.release_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sign-input
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: false

      - id: outputs
        name: Publish sign input artifact outputs
        run: |
          set -euo pipefail
          artifact_name="tvbox-u2-sign-input-${{ inputs.release_sha }}-${{ github.run_attempt }}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

  sign_exact:
    name: Sign exact unsigned APK in isolated environment
    needs: prepare_sign_input
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-signing
    permissions:
      contents: none
      actions: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_name: ${{ steps.outputs.outputs.artifact_name }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      EXPECTED_SIGNER_SHA256: ${{ vars.TVBOX_SIGNER_SHA256 }}
    steps:
      - name: Set up signer Temurin 17 before secret window
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17.0.20+8'

      - name: Download sanitized sign input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.prepare_sign_input.outputs.artifact_id }}
          path: ${{ runner.temp }}/sign-input

      - name: Validate sign input and rehash actual APK before secret window
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/sign-input"
          for f in unsigned.apk build-identity.json; do
            test -f "$root/$f" || { echo "::error::missing sign input file: $f"; exit 1; }
            test ! -d "$root/$f" || { echo "::error::sign input entry is a directory: $f"; exit 1; }
            test ! -L "$root/$f" || { echo "::error::sign input entry is a symlink: $f"; exit 1; }
          done
          actual_count=$(find "$root" -maxdepth 1 -type f | wc -l | tr -d ' ')
          test "$actual_count" -eq 2 || { echo "::error::sign input file count is $actual_count, expected 2"; exit 1; }
          test -z "$(find "$root" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" || { echo "::error::sign input contains non-regular entries"; exit 1; }
          identity="$root/build-identity.json"
          jq -e '.schema == "tvbox-release-identity-v2" and (.unsigned_sha256 | test("^[0-9a-f]{64}$"))' "$identity" >/dev/null || { echo "::error::build identity schema mismatch"; exit 1; }
          identity_unsigned=$(jq -r '.unsigned_sha256' "$identity")
          actual_unsigned=$(sha256sum "$root/unsigned.apk" | awk '{print $1}')
          [[ "$identity_unsigned" == "$actual_unsigned" ]] || { echo "::error::actual unsigned APK hash does not match build identity"; exit 1; }
          mkdir -p "$RUNNER_TEMP/fixed"
          cp -- "$root/unsigned.apk" "$RUNNER_TEMP/fixed/unsigned.apk"
          cp -- "$root/build-identity.json" "$RUNNER_TEMP/fixed/build-identity.json"

      - name: Capture signer JDK identity before secret window
        run: |
          set -euo pipefail
          java -version 2>&1 | tr '\n' ' ' > "$RUNNER_TEMP/signer-java-version.txt"
          grep -q '17.0.20' "$RUNNER_TEMP/signer-java-version.txt"

      - id: sign
        name: Sign exact APK with the only secret-bearing step
        env:
          TVBOX_KEYSTORE_BASE64: ${{ secrets.TVBOX_KEYSTORE_BASE64 }}
          TVBOX_KEY_ALIAS: ${{ secrets.TVBOX_KEY_ALIAS }}
          TVBOX_KEY_PASSWORD: ${{ secrets.TVBOX_KEY_PASSWORD }}
          TVBOX_STORE_PASSWORD: ${{ secrets.TVBOX_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/fixed"
          test -f "$root/unsigned.apk"
          actual_unsigned=$(sha256sum "$root/unsigned.apk" | awk '{print $1}')
          test -n "$TVBOX_KEYSTORE_BASE64"
          test -n "$TVBOX_KEY_ALIAS"
          test -n "$TVBOX_KEY_PASSWORD"
          test -n "$TVBOX_STORE_PASSWORD"
          printf '%s' "$TVBOX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signer.jks"
          chmod 600 "$RUNNER_TEMP/signer.jks"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/signer.jks" \
            --ks-pass env:TVBOX_STORE_PASSWORD \
            --ks-key-alias "$TVBOX_KEY_ALIAS" \
            --key-pass env:TVBOX_KEY_PASSWORD \
            --out "$RUNNER_TEMP/signed.apk" "$root/unsigned.apk"
          rm -f "$RUNNER_TEMP/signer.jks"
          unset TVBOX_KEYSTORE_BASE64 TVBOX_KEY_ALIAS TVBOX_KEY_PASSWORD TVBOX_STORE_PASSWORD
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/signed.apk" | tee "$RUNNER_TEMP/signer-output.txt"
          signer_sha=$(sed -nE 's/.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*/\1/p' "$RUNNER_TEMP/signer-output.txt" | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -n 1)
          expected_sha=$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
           [[ "$signer_sha" =~ ^[0-9a-f]{64}$ && "$signer_sha" == "$expected_sha" ]] || { echo "::error::signer fingerprint mismatch"; exit 1; }
           signed_sha=$(sha256sum "$RUNNER_TEMP/signed.apk" | awk '{print $1}')
           signer_java_version=$(cat "$RUNNER_TEMP/signer-java-version.txt")
           identity_unsigned=$(jq -r '.unsigned_sha256' "$root/build-identity.json")
           mkdir -p "$RUNNER_TEMP/signed-output"
          cp "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/signed-output/signed.apk"
          jq -n \
            --arg schema "tvbox-signer-result-v1" \
            --arg unsigned_sha256 "$identity_unsigned" \
            --arg signed_sha256 "$signed_sha" \
            --arg signer_sha256 "$signer_sha" \
            --arg signer_java_version "$signer_java_version" \
            --arg signer_job "$GITHUB_JOB" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema:$schema, unsigned_sha256:$unsigned_sha256, signed_sha256:$signed_sha256, signer_sha256:$signer_sha256, signer_java_version:$signer_java_version, signer_job:$signer_job, run_id:$run_id, run_attempt:$run_attempt}' > "$RUNNER_TEMP/signed-output/signer-result.json"
          echo "artifact_name=tvbox-u2-signed-output-${{ inputs.release_sha }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Remove all signing material before upload
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signer.jks" "$RUNNER_TEMP/signed.apk"
          unset TVBOX_KEYSTORE_BASE64 TVBOX_KEY_ALIAS TVBOX_KEY_PASSWORD TVBOX_STORE_PASSWORD

      - name: Upload exact signed output
        id: upload
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tvbox-u2-signed-output-${{ inputs.release_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-output
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: false

      - id: outputs
        if: success()
        run: echo "artifact_name=tvbox-u2-signed-output-${{ inputs.release_sha }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

  verify_signed:
    name: Independently verify signed APK without OIDC
    needs: [build_unsigned, prepare_sign_input, sign_exact]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      signed_sha256: ${{ steps.verify.outputs.signed_sha256 }}
      signer_sha256: ${{ steps.verify.outputs.signer_sha256 }}
    env:
      EXPECTED_SIGNER_SHA256: ${{ vars.TVBOX_SIGNER_SHA256 }}
      BUILD_EVIDENCE_ARTIFACT_ID: ${{ needs.build_unsigned.outputs.artifact_id }}
      SIGN_INPUT_ARTIFACT_ID: ${{ needs.prepare_sign_input.outputs.artifact_id }}
      SIGNED_OUTPUT_ARTIFACT_ID: ${{ needs.sign_exact.outputs.artifact_id }}
    steps:
      - name: Check out exact release SHA for trusted helper code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up verifier Temurin 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17.0.20+8'

      - name: Set up Android SDK for verifier
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'

      - name: Install Android API 34 for verifier
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Download exact build evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build_unsigned.outputs.artifact_id }}
          path: ${{ runner.temp }}/build-evidence
      - name: Download exact signed output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.sign_exact.outputs.artifact_id }}
          path: ${{ runner.temp }}/signed-output

      - id: verify
        name: Verify identity and signed-vs-unsigned equivalence
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          unsigned="$RUNNER_TEMP/build-evidence/unsigned.apk"
           signed="$RUNNER_TEMP/signed-output/signed.apk"
           test -f "$unsigned"; test -f "$signed"
           builder_identity="$RUNNER_TEMP/build-evidence/build-identity.json"
           test -f "$builder_identity"
           jq -e '.schema == "tvbox-release-identity-v2" and (.legacy_manifest_sha256 | test("^[0-9a-f]{64}$")) and (.runtime_components_sha256 | test("^[0-9a-f]{64}$")) and (.native_compat_report_sha256 | test("^[0-9a-f]{64}$")) and (.payload_manifest_sha256 | test("^[0-9a-f]{64}$")) and ((.native_compat_status == "clean" and .native_incompatible_count == 0 and .native_incompatible_paths == []) or (.native_compat_status == "known-debt" and .native_incompatible_count == 3 and .native_incompatible_paths == ["lib/arm64-v8a/libconscrypt_jni.so", "lib/arm64-v8a/libquickjs-android-wrapper.so", "lib/arm64-v8a/librtmp-jni.so"])) and .gradle_version == "8.7" and .gradle_distribution_sha256 == "544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d" and .wrapper_jar_sha256 == "cb0da6751c2b753a16ac168bb354870ebb1e162e9083f116729cec9c781156b8" and .agp_version == "8.5.2" and .apksigner_version == "34.0.0" and .zipalign_version == "35.0.0" and .ndk_version == "28.2.13676358" and (.builder_java_version | contains("17.0.20"))' "$builder_identity" >/dev/null
           builder_unsigned=$(jq -r '.unsigned_sha256' "$builder_identity")
           builder_payload=$(jq -r '.payload_manifest_sha256' "$builder_identity")
           builder_dependencies=$(jq -r '.runtime_components_sha256' "$builder_identity")
           builder_manifest=$(jq -r '.legacy_manifest_sha256' "$builder_identity")
           builder_native=$(jq -r '.native_compat_report_sha256' "$builder_identity")
           actual_unsigned=$(sha256sum "$unsigned" | awk '{print $1}')
           actual_signed=$(sha256sum "$signed" | awk '{print $1}')
           [[ "$builder_unsigned" == "$actual_unsigned" ]] || { echo "::error::unsigned artifact digest changed"; exit 1; }
           [[ "$builder_payload" == "$(sha256sum "$RUNNER_TEMP/build-evidence/payload-manifest.json" | awk '{print $1}')" ]] || { echo "::error::payload manifest changed"; exit 1; }
           [[ "$builder_dependencies" == "$(sha256sum "$RUNNER_TEMP/build-evidence/runtime-components.json" | awk '{print $1}')" ]] || { echo "::error::canonical dependency report changed"; exit 1; }
           native_report="$RUNNER_TEMP/build-evidence/native-compat.json"
           test -f "$native_report"
           [[ "$builder_native" == "$(sha256sum "$native_report" | awk '{print $1}')" ]] || { echo "::error::native compatibility report changed"; exit 1; }
           llvm_readelf="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
           native_recomputed=$(python3 scripts/native_compat.py \
             --apk "$unsigned" \
             --llvm-readelf "$llvm_readelf" \
             --output "$RUNNER_TEMP/recomputed-native-compat.json")
           [[ "$builder_native" == "$(jq -r '.report_sha256' <<<"$native_recomputed")" ]] || { echo "::error::native compatibility recomputation mismatch"; exit 1; }
           cmp -s "$native_report" "$RUNNER_TEMP/recomputed-native-compat.json" || { echo "::error::native compatibility report bytes differ"; exit 1; }
           manifest_file="$RUNNER_TEMP/build-evidence/legacy-dependencies.lock.json"
           test -f "$manifest_file"
           [[ "$builder_manifest" == "$(sha256sum "$manifest_file" | awk '{print $1}')" ]] || { echo "::error::legacy manifest changed"; exit 1; }
           expected_package='com.github.tvbox.osc'
          expected_name=$(jq -r '.version_name' "$builder_identity")
          expected_code=$(jq -r '.version_code' "$builder_identity")
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$signed" | tee "$RUNNER_TEMP/verify-signature.txt"
          signer_sha=$(sed -nE 's/.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*/\1/p' "$RUNNER_TEMP/verify-signature.txt" | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -n 1)
          expected_sha=$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [[ "$signer_sha" =~ ^[0-9a-f]{64}$ && "$signer_sha" == "$expected_sha" ]] || { echo "::error::verifier signer fingerprint mismatch"; exit 1; }
          signer_result="$RUNNER_TEMP/signed-output/signer-result.json"
          test -f "$signer_result"
          jq -e '.schema == "tvbox-signer-result-v1" and (.signed_sha256 | test("^[0-9a-f]{64}$")) and (.unsigned_sha256 | test("^[0-9a-f]{64}$")) and (.signer_sha256 | test("^[0-9a-f]{64}$"))' "$signer_result" >/dev/null || { echo "::error::signer result schema mismatch"; exit 1; }
          signer_result_signed=$(jq -r '.signed_sha256' "$signer_result")
          [[ "$signer_result_signed" == "$actual_signed" ]] || { echo "::error::signer result signed digest does not match actual signed APK"; exit 1; }
          signer_result_unsigned=$(jq -r '.unsigned_sha256' "$signer_result")
          [[ "$signer_result_unsigned" == "$actual_unsigned" ]] || { echo "::error::signer result unsigned digest does not match actual unsigned APK"; exit 1; }
          badging=$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$signed")
          package_name=$(sed -nE "s/^package: name='([^']+)'.*/\1/p" <<<"$badging" | head -n 1)
          apk_code=$(sed -nE "s/^package:.*versionCode='([^']+)'.*/\1/p" <<<"$badging" | head -n 1)
          apk_name=$(sed -nE "s/^package:.*versionName='([^']+)'.*/\1/p" <<<"$badging" | head -n 1)
          [[ "$package_name" == "$expected_package" && "$apk_code" == "$expected_code" && "$apk_name" == "$expected_name" ]] || {
            echo "::error::verifier package/version mismatch"; exit 1;
          }
          sudo apt-get update
           sudo apt-get install -y apksigcopier=1.1.1-1
           apksigcopier compare --unsigned "$signed" "$unsigned"
           signer_java_version=$(jq -r '.signer_java_version' "$signer_result")
           [[ "$signer_java_version" == *"17.0.20"* ]] || { echo "::error::signer JDK identity mismatch"; exit 1; }
           verifier_image_os="${ImageOS:-unknown}"
           verifier_image_version="${ImageVersion:-unknown}"
           printf '%s\n' \
            "signed_sha256=$actual_signed" \
             "unsigned_sha256=$actual_unsigned" \
             "signer_sha256=$signer_sha" \
             "legacy_manifest_sha256=$builder_manifest" \
             "runtime_components_sha256=$builder_dependencies" \
             "native_compat_report_sha256=$builder_native" \
             "native_compat_status=$(jq -r '.native_compat_status' "$builder_identity")" \
             "native_incompatible_count=$(jq -r '.native_incompatible_count' "$builder_identity")" \
             "signer_java_version=$signer_java_version" \
             "verifier_image_os=$verifier_image_os" \
             "verifier_image_version=$verifier_image_version" \
             "artifact_source_sha=${{ inputs.release_sha }}" \
            "workflow_source_sha=$GITHUB_SHA" \
            "unsigned_artifact_id=$BUILD_EVIDENCE_ARTIFACT_ID" \
            "signed_artifact_id=$SIGNED_OUTPUT_ARTIFACT_ID" > "$RUNNER_TEMP/verified-release-identity.txt"
          cp "$RUNNER_TEMP/verified-release-identity.txt" verified-release-identity.txt
          cp "$native_report" verified-native-compat.json
          echo "signed_sha256=$actual_signed" >> "$GITHUB_OUTPUT"
          echo "signer_sha256=$signer_sha" >> "$GITHUB_OUTPUT"

      - name: Upload verifier evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tvbox-u2-verified-${{ inputs.release_sha }}-${{ github.run_attempt }}
          path: |
            verified-release-identity.txt
            verified-native-compat.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  attest_signed:
    name: Attest verified signed APK with minimal OIDC
    needs: [build_unsigned, sign_exact, verify_signed]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      default_attestation_id: ${{ steps.default_attest.outputs.attestation-id }}
      custom_attestation_id: ${{ steps.custom_attest.outputs.attestation-id }}
    env:
      BUILD_EVIDENCE_ARTIFACT_ID: ${{ needs.build_unsigned.outputs.artifact_id }}
      SIGNED_OUTPUT_ARTIFACT_ID: ${{ needs.sign_exact.outputs.artifact_id }}
    steps:
      - name: Download exact build evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build_unsigned.outputs.artifact_id }}
          path: ${{ runner.temp }}/build-evidence
      - name: Download exact signed output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.sign_exact.outputs.artifact_id }}
          path: ${{ runner.temp }}/signed-output

      - id: verify_input
        name: Validate attest input file set
        run: |
          set -euo pipefail
          signed="$RUNNER_TEMP/signed-output/signed.apk"
          identity="$RUNNER_TEMP/build-evidence/build-identity.json"
          test -f "$signed"
          test -f "$identity"
          jq -e '.schema == "tvbox-release-identity-v2" and (.unsigned_sha256 | test("^[0-9a-f]{64}$"))' "$identity" >/dev/null
          test "$(sha256sum "$signed" | awk '{print $1}')" = "${{ needs.verify_signed.outputs.signed_sha256 }}" || { echo "::error::attest input signed digest mismatch"; exit 1; }

      - name: Write final release identity predicate
        run: |
          set -euo pipefail
           identity="$RUNNER_TEMP/build-evidence/build-identity.json"
           test -f "$identity"
           signer_result="$RUNNER_TEMP/signed-output/signer-result.json"
           test -f "$signer_result"
           jq -n \
             --argjson builder "$(cat "$identity")" \
            --arg unsigned "${{ needs.build_unsigned.outputs.unsigned_sha256 }}" \
            --arg signed "${{ needs.verify_signed.outputs.signed_sha256 }}" \
            --arg signer "${{ needs.verify_signed.outputs.signer_sha256 }}" \
             --arg workflow_source "$GITHUB_SHA" \
             --arg run "$GITHUB_RUN_ID" \
             --arg attempt "$GITHUB_RUN_ATTEMPT" \
             --arg signer_java "$(jq -r '.signer_java_version' "$signer_result")" \
             --arg verifier_image_os "${ImageOS:-unknown}" \
             --arg verifier_image_version "${ImageVersion:-unknown}" \
             '$builder + {schema:"tvbox-release-identity-v2", unsigned_sha256:$unsigned, signed_sha256:$signed, signer_sha256:$signer, signer_java_version:$signer_java, verifier_image_os:$verifier_image_os, verifier_image_version:$verifier_image_version, verifier_workflow_source_sha:$workflow_source, run_id:$run, run_attempt:$attempt}' > "$RUNNER_TEMP/release-identity-predicate.json"

      - id: default_attest
        name: Attest signed APK with GitHub build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/signed-output/signed.apk
          push-to-registry: false

      - id: custom_attest
        name: Attest project-specific release identity
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/signed-output/signed.apk
          predicate-type: https://slashinchi.github.io/TVBoxOS-Mobile/tvbox-release-identity/v2
          predicate-path: ${{ runner.temp }}/release-identity-predicate.json
          push-to-registry: false
          create-storage-record: false

      - name: Upload final predicate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tvbox-u2-attest-input-${{ inputs.release_sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-identity-predicate.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
