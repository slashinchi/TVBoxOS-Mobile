name: U2a Shadow Merge Canary

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  setup_shadow:
    name: Create disposable shadow base and bot PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      base_ref: ${{ steps.create.outputs.base_ref }}
      head_ref: ${{ steps.create.outputs.head_ref }}
      base_sha: ${{ steps.create.outputs.base_sha }}
      head_sha: ${{ steps.create.outputs.head_sha }}
      run_id: ${{ steps.create.outputs.run_id }}
    steps:
      - name: Check out patched head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: f22aa75bf040ebbc138ab9034183cb89ca5327e1
          fetch-depth: 0
          persist-credentials: true

      - id: create
        name: Create disposable shadow base and candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$GITHUB_RUN_ID"
          base="canary/u2a-shadow-base-$run_id"
          head="canary/u2a-shadow-candidate-$run_id"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$base" f22aa75bf040ebbc138ab9034183cb89ca5327e1
          printf 'shadow-base-%s\n' "$run_id" > .canary-shadow-marker
          git add .canary-shadow-marker
          git commit -m "chore: disposable shadow canary base [skip ci]"
          git push origin "HEAD:refs/heads/$base"
          git checkout -b "$head" "$base"
          printf 'shadow-candidate-%s\n' "$run_id" > .canary-shadow-candidate
          git add .canary-shadow-candidate
          git commit -m "chore: disposable shadow canary candidate [skip ci]"
          git push origin "HEAD:refs/heads/$head"
          base_sha=$(git rev-parse "$base")
          head_sha=$(git rev-parse "$head")
          echo "base_ref=$base" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "base=$base head=$head base_sha=$base_sha head_sha=$head_sha"

      - name: Open disposable shadow PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ steps.create.outputs.base_ref }}
          HEAD_REF: ${{ steps.create.outputs.head_ref }}
          RUN_ID: ${{ steps.create.outputs.run_id }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          ## U2a disposable shadow merge canary

          - run：$RUN_ID
          - base：${BASE_REF}
          - head：${HEAD_REF}
          - 临时验证用；由 slashinchi 执行一次普通 Merge commit 后关闭并清理 refs。
          EOF
          )
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_REF" --head "$HEAD_REF" \
            --title "chore: U2a shadow merge canary ${RUN_ID}" \
            --body "$body"
          pr_url=$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$HEAD_REF&state=open" --jq '.[0].html_url')
          echo "pr_url=$pr_url"

  observe_merge:
    name: Observe real merge event facts
    needs: setup_shadow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Wait for human merge and record facts
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ needs.setup_shadow.outputs.base_ref }}
          HEAD_REF: ${{ needs.setup_shadow.outputs.head_ref }}
          BASE_SHA: ${{ needs.setup_shadow.outputs.base_sha }}
          HEAD_SHA: ${{ needs.setup_shadow.outputs.head_sha }}
          RUN_ID: ${{ needs.setup_shadow.outputs.run_id }}
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head "$HEAD_REF" --state open --json number --jq '.[0].number')
          test -n "$pr_number"
          echo "PR #$pr_number"
          for i in $(seq 1 90); do
            pr_json=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json state,mergedAt --jq '{state, mergedAt}')
            state=$(jq -r '.state' <<<"$pr_json")
            merged_at=$(jq -r '.mergedAt // empty' <<<"$pr_json")
            if [[ "$state" == "MERGED" || -n "$merged_at" ]]; then break; fi
            if [[ "$i" -eq 90 ]]; then
              echo "::error::shadow PR not merged within timeout"
              exit 1
            fi
            sleep 20
          done
          pr_json=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" \
            --json state,mergedBy,mergeCommit,baseRefName,headRefName,headRepository,author,url)
          merged_by=$(jq -r '.mergedBy.login' <<<"$pr_json")
          merge_sha=$(jq -r '.mergeCommit.oid' <<<"$pr_json")
          author=$(jq -r '.author.login' <<<"$pr_json")
          head_repo=$(jq -r '.headRepository.nameWithOwner' <<<"$pr_json")
          echo "merged_by=$merged_by author=$author head_repo=$head_repo merge_sha=$merge_sha"
          test "$merged_by" = "slashinchi" || { echo "::error::merged_by != slashinchi"; exit 1; }
          test "$author" = "github-actions[bot]" || test "$author" = "app/github-actions" || { echo "::error::author is not the bot: $author"; exit 1; }
          test "$head_repo" = "$GITHUB_REPOSITORY" || { echo "::error::head_repo mismatch"; exit 1; }
          git fetch origin "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          parents=$(git rev-list --parents -n 1 "$merge_sha")
          parent_count=$(wc -w <<<"$parents")
          test "$parent_count" -eq 3 || { echo "::error::merge commit does not have exactly two parents: $parents"; exit 1; }
          p1=$(awk '{print $2}' <<<"$parents")
          p2=$(awk '{print $3}' <<<"$parents")
          echo "parents: p1=$p1 p2=$p2"
          echo "merge_sha=$merge_sha" >> "$GITHUB_ENV"
          echo "pr_number=$pr_number" >> "$GITHUB_ENV"
          echo "observed p1=$p1 p2=$p2 merged_by=$merged_by author=$author"

  cleanup:
    name: Clean disposable shadow state
    needs: observe_merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Remove shadow refs
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ needs.setup_shadow.outputs.base_ref }}
          HEAD_REF: ${{ needs.setup_shadow.outputs.head_ref }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/${BASE_REF}" || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/${HEAD_REF}" || true
          echo "shadow refs removed"
