name: Upstream Maintenance Monitor

on:
  schedule:
    - cron: '22 12 * * *'
      timezone: Asia/Shanghai
    - cron: '22 22 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      force_check:
        description: Run the upstream check even on an off day
        required: false
        default: false
        type: boolean
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: upstream-maintenance-monitor
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  event_gate:
    name: Validate event and watchdog request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      accepted: ${{ steps.gate.outputs.accepted }}
      request: ${{ steps.gate.outputs.request }}
      occurrence: ${{ steps.gate.outputs.occurrence }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Check out trusted monitor code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: scripts/upstream_monitor.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - id: gate
        name: Apply strict read-only event gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_JSON: ${{ toJson(github.event) }}
          CONTROL_ISSUE_NUMBER: ${{ vars.TVBOX_AUTOMATION_CONTROL_ISSUE_NUMBER || '0' }}
        run: |
          set -euo pipefail
          event_file="$RUNNER_TEMP/github-event.json"
          printf '%s' "$EVENT_JSON" > "$event_file"
          runner_now=$(TZ=Asia/Shanghai date --iso-8601=seconds)
          result=$(python3 scripts/upstream_monitor.py event-gate \
            --event-file "$event_file" \
            --event-name "$EVENT_NAME" \
            --issue-number "$CONTROL_ISSUE_NUMBER" \
            --now "$runner_now")
          accepted=$(jq -r '.accepted' <<<"$result")
          request=$(jq -r '.request' <<<"$result")
          occurrence=$(jq -r '.occurrence // empty' <<<"$result")
          reason=$(jq -r '.reason' <<<"$result")
          echo "accepted=$accepted" >> "$GITHUB_OUTPUT"
          echo "request=$request" >> "$GITHUB_OUTPUT"
          echo "occurrence=$occurrence" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT_NAME accepted=$accepted request=$request reason=$reason occurrence=${occurrence:-none}"

  date_gate:
    name: Check schedule gate
    needs: event_gate
    if: needs.event_gate.outputs.accepted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      active: ${{ steps.gate.outputs.active }}
      local_date: ${{ steps.gate.outputs.local_date }}
      anchor: ${{ steps.gate.outputs.anchor }}
      forced: ${{ steps.gate.outputs.forced }}
      timezone: ${{ steps.gate.outputs.timezone }}
      occurrence: ${{ steps.gate.outputs.occurrence }}
    steps:
      - name: Check out trusted monitor code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: scripts/upstream_monitor.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - id: gate
        name: Apply strict every-two-days gate
        env:
          FORCE_CHECK: ${{ inputs.force_check || false }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          REQUEST_EVENT: ${{ needs.event_gate.outputs.request }}
          REQUEST_OCCURRENCE: ${{ needs.event_gate.outputs.occurrence }}
        run: |
          set -euo pipefail
          local_date=$(TZ=Asia/Shanghai date +%F)
          args=(date-gate)
           if [[ "$EVENT_NAME" == "schedule" ]]; then
             runner_now=$(TZ=Asia/Shanghai date --iso-8601=seconds)
             args+=(--schedule "$EVENT_SCHEDULE" --now "$runner_now")
           elif [[ "$REQUEST_EVENT" == "true" ]]; then
             request_date="${REQUEST_OCCURRENCE%%T*}"
             args+=(--date "$request_date")
           else
             args+=(--date "$local_date")
          fi
          if [[ "$FORCE_CHECK" == "true" ]]; then
            args+=(--force-check)
          fi
          result=$(python3 scripts/upstream_monitor.py "${args[@]}")
          active=$(jq -r '.active' <<<"$result")
          anchor=$(jq -r '.anchor' <<<"$result")
          gate_date=$(jq -r '.date' <<<"$result")
          forced=$(jq -r '.forced' <<<"$result")
           occurrence=$(jq -r '.occurrence // empty' <<<"$result")
           if [[ "$REQUEST_EVENT" == "true" ]]; then
             occurrence="$REQUEST_OCCURRENCE"
           fi
          timezone=$(jq -r '.timezone' <<<"$result")
          echo "local_date=$gate_date" >> "$GITHUB_OUTPUT"
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "anchor=$anchor" >> "$GITHUB_OUTPUT"
          echo "forced=$forced" >> "$GITHUB_OUTPUT"
          echo "occurrence=$occurrence" >> "$GITHUB_OUTPUT"
          echo "timezone=$timezone" >> "$GITHUB_OUTPUT"
          if [[ "$active" != "true" ]]; then
            echo "Off-day: no upstream repository check will run."
          fi

  fixture_tests:
    name: U1 fixture tests
    needs: date_gate
    if: needs.date_gate.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out trusted monitor code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run deterministic fixtures
        run: python3 scripts/upstream_monitor.py fixture-test

  probe:
    name: Probe upstream and repository state
    needs: [date_gate, fixture_tests]
    if: needs.date_gate.outputs.active == 'true' && needs.fixture_tests.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      state: ${{ steps.probe.outputs.state }}
      upstream_sha: ${{ steps.probe.outputs.upstream_sha }}
      fork_main_sha: ${{ steps.probe.outputs.fork_main_sha }}
      patched_sha: ${{ steps.probe.outputs.patched_sha }}
      candidate_branch_oid: ${{ steps.probe.outputs.candidate_branch_oid }}
      commit_summary_b64: ${{ steps.probe.outputs.commit_summary_b64 }}
      source_diff_stat_b64: ${{ steps.probe.outputs.source_diff_stat_b64 }}
    steps:
      - name: Check out trusted monitor code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - id: probe
        name: Compare upstream, main, patched, and open candidates
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: kukuqi666/TVBoxOS-Mobile
        run: |
          set -euo pipefail
           trusted_helper="$RUNNER_TEMP/trusted-upstream-monitor.py"
           cp scripts/upstream_monitor.py "$trusted_helper"
           git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags "https://github.com/${UPSTREAM_REPO}.git" \
            +refs/heads/main:refs/remotes/upstream/main

          upstream_sha=$(git rev-parse refs/remotes/upstream/main)
          fork_main_sha=$(git rev-parse refs/remotes/origin/main)
          patched_sha=$(git rev-parse HEAD)
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "fork_main_sha=$fork_main_sha" >> "$GITHUB_OUTPUT"
          echo "patched_sha=$patched_sha" >> "$GITHUB_OUTPUT"
          commit_summary=$(git log --format='- %h %s' "$fork_main_sha..$upstream_sha" 2>/dev/null | awk 'NR <= 50 {print}' || true)
          source_diff_stat=$(git diff --stat "$fork_main_sha...$upstream_sha" 2>/dev/null || true)
          commit_summary_b64=$(printf '%s' "$commit_summary" | base64 -w 0)
          source_diff_stat_b64=$(printf '%s' "$source_diff_stat" | base64 -w 0)
          echo "commit_summary_b64=$commit_summary_b64" >> "$GITHUB_OUTPUT"
          echo "source_diff_stat_b64=$source_diff_stat_b64" >> "$GITHUB_OUTPUT"

          main_is_ancestor=false
          patched_contains_main=false
          if git merge-base --is-ancestor "$fork_main_sha" "$upstream_sha"; then
            main_is_ancestor=true
          fi
          if git merge-base --is-ancestor "$fork_main_sha" "$patched_sha"; then
            patched_contains_main=true
          fi

          preview_status=not-run
          preview_candidate_needed=unknown
          if [[ "$main_is_ancestor" == "true" && ( "$fork_main_sha" != "$upstream_sha" || "$patched_contains_main" != "true" ) ]]; then
            preview_file="$RUNNER_TEMP/candidate-preview.json"
            set +e
             python3 "$trusted_helper" prepare-candidate \
              --repo . \
              --upstream-ref "$upstream_sha" \
              --base-ref "$patched_sha" > "$preview_file" 2> "$RUNNER_TEMP/candidate-preview.log"
            preview_exit=$?
            set -e
            if jq -e . "$preview_file" >/dev/null 2>&1; then
              preview_status=$(jq -r '.status' "$preview_file")
              preview_candidate_needed=$(jq -r '.candidate_needed' "$preview_file")
            else
              preview_status=error
              echo "Candidate preview failed (exit $preview_exit):"
              cat "$RUNNER_TEMP/candidate-preview.log"
            fi
          fi

           policy=none
           candidate_branch_exists=false
           candidate_branch_oid=
           if [[ "$preview_candidate_needed" == "true" ]]; then
             exact_branch=$(python3 "$trusted_helper" candidate-branch --upstream-sha "$upstream_sha")
             candidate_branch_oid=$(git ls-remote origin "refs/heads/$exact_branch" | awk 'NR == 1 {print $1}')
             if [[ -n "$candidate_branch_oid" ]]; then
               candidate_branch_exists=true
             fi
             open_prs=$(python3 "$trusted_helper" list-prs \
               --repo "$GITHUB_REPOSITORY" \
               --state all)
             policy=$(python3 "$trusted_helper" candidate-policy \
               --upstream-sha "$upstream_sha" \
               --repository "$GITHUB_REPOSITORY" \
               --candidate-oid "$candidate_branch_oid" \
               --base-ref patched <<<"$open_prs")
           fi

          state=$(python3 "$trusted_helper" probe-state \
            --main-sha "$fork_main_sha" \
            --upstream-sha "$upstream_sha" \
            --main-is-ancestor "$main_is_ancestor" \
            --patched-contains-main "$patched_contains_main" \
            --preview-status "$preview_status" \
            --preview-candidate-needed "$preview_candidate_needed" \
            --candidate-branch-exists "$candidate_branch_exists" \
            --policy "$policy")
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "candidate_branch_oid=$candidate_branch_oid" >> "$GITHUB_OUTPUT"
           echo "Probe state: $state"

  coverage:
    name: Record upstream probe coverage
    needs: [event_gate, date_gate, probe]
    if: >-
      needs.event_gate.outputs.accepted == 'true' &&
      needs.date_gate.outputs.active == 'true' &&
      needs.date_gate.outputs.occurrence != '' &&
      needs.probe.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out trusted monitor code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: scripts/upstream_monitor.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Write idempotent coverage marker
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE_ISSUE_NUMBER: ${{ vars.TVBOX_AUTOMATION_COVERAGE_ISSUE_NUMBER || '0' }}
          OCCURRENCE: ${{ needs.date_gate.outputs.occurrence }}
          PROBE_STATE: ${{ needs.probe.outputs.state }}
          UPSTREAM_SHA: ${{ needs.probe.outputs.upstream_sha }}
          FORK_MAIN_SHA: ${{ needs.probe.outputs.fork_main_sha }}
        run: |
          set -euo pipefail
          trusted_helper="$RUNNER_TEMP/trusted-upstream-monitor.py"
          cp scripts/upstream_monitor.py "$trusted_helper"
          body_file="$RUNNER_TEMP/tvbox-upstream-covered.md"
          python3 "$trusted_helper" coverage-body \
            --occurrence "$OCCURRENCE" \
            --run-id "$GITHUB_RUN_ID" \
            --probe-state "$PROBE_STATE" \
            --upstream-sha "$UPSTREAM_SHA" \
            --fork-main-sha "$FORK_MAIN_SHA" > "$body_file"
          marker=$(sed -n '1p' "$body_file")
          test -n "$marker"
          python3 "$trusted_helper" issue-comment \
            --repo "$GITHUB_REPOSITORY" \
            --number "$COVERAGE_ISSUE_NUMBER" \
            --body-file "$body_file" \
            --marker "$marker"

  candidate_validation:
    name: Validate upstream candidate without write or signing access
    needs: [date_gate, probe]
    if: needs.probe.result == 'success' && (needs.probe.outputs.state == 'fast-forward' || needs.probe.outputs.state == 'actionable-main-ahead' || needs.probe.outputs.state == 'no-actionable-delta' || needs.probe.outputs.state == 'candidate-branch-missing-after-main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      validation: ${{ steps.prepare.outputs.validation }}
      classification: ${{ steps.prepare.outputs.classification }}
      candidate_needed: ${{ steps.prepare.outputs.candidate_needed }}
      candidate_sha: ${{ steps.prepare.outputs.candidate_sha }}
      validated_tree: ${{ steps.prepare.outputs.validated_tree }}
      provenance_marker: ${{ steps.prepare.outputs.provenance_marker }}
      changed_paths_b64: ${{ steps.prepare.outputs.changed_paths_b64 }}
      preserved_paths_b64: ${{ steps.prepare.outputs.preserved_paths_b64 }}
      candidate_diff_stat_b64: ${{ steps.prepare.outputs.candidate_diff_stat_b64 }}
    steps:
      - name: Check out trusted monitor code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.probe.outputs.patched_sha }}
          fetch-depth: 0
          persist-credentials: false

      - id: prepare
        name: Prepare candidate merge and classify changes
        env:
          UPSTREAM_REPO: kukuqi666/TVBoxOS-Mobile
          UPSTREAM_SHA: ${{ needs.probe.outputs.upstream_sha }}
          FORK_MAIN_SHA: ${{ needs.probe.outputs.fork_main_sha }}
        run: |
          set +e
           trusted_helper="$RUNNER_TEMP/trusted-upstream-monitor.py"
           cp scripts/upstream_monitor.py "$trusted_helper"
           existing_fork_main=$(git rev-parse refs/remotes/origin/main 2>/dev/null || true)
           if [[ -n "$existing_fork_main" && "$existing_fork_main" != "$FORK_MAIN_SHA" ]]; then
             echo "Candidate validation fork main baseline changed during checkout."
             echo 'validation=fail' >> "$GITHUB_OUTPUT"
             echo 'classification=unknown/high-risk' >> "$GITHUB_OUTPUT"
             echo 'candidate_needed=false' >> "$GITHUB_OUTPUT"
             exit 0
           fi
           if ! git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main; then
             echo "Candidate validation could not fetch fork main without rewriting local evidence."
             echo 'validation=fail' >> "$GITHUB_OUTPUT"
             echo 'classification=unknown/high-risk' >> "$GITHUB_OUTPUT"
             echo 'candidate_needed=false' >> "$GITHUB_OUTPUT"
             exit 0
           fi
           if [[ "$(git rev-parse refs/remotes/origin/main)" != "$FORK_MAIN_SHA" ]]; then
             echo "Candidate validation fork main SHA changed during validation."
             echo 'validation=fail' >> "$GITHUB_OUTPUT"
             echo 'classification=unknown/high-risk' >> "$GITHUB_OUTPUT"
             echo 'candidate_needed=false' >> "$GITHUB_OUTPUT"
             exit 0
           fi
           git fetch --no-tags "https://github.com/${UPSTREAM_REPO}.git" \
            +refs/heads/main:refs/remotes/upstream/main
          if [[ "$(git rev-parse refs/remotes/upstream/main)" != "$UPSTREAM_SHA" ]]; then
            echo "Candidate upstream SHA changed during validation."
            echo 'validation=fail' >> "$GITHUB_OUTPUT"
            echo 'classification=unknown/high-risk' >> "$GITHUB_OUTPUT"
            echo 'candidate_needed=false' >> "$GITHUB_OUTPUT"
             echo 'candidate_sha=' >> "$GITHUB_OUTPUT"
             echo 'validated_tree=' >> "$GITHUB_OUTPUT"
             echo 'provenance_marker=' >> "$GITHUB_OUTPUT"
             echo 'candidate_diff_stat_b64=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base_sha=$(git rev-parse HEAD)
          result_file="$RUNNER_TEMP/candidate-result.json"
          error_file="$RUNNER_TEMP/candidate-error.log"
           python3 "$trusted_helper" prepare-candidate \
            --repo . \
            --upstream-ref "$UPSTREAM_SHA" \
            --base-ref HEAD > "$result_file" 2> "$error_file"
          prepare_status=$?
          set -e
          if ! jq -e . "$result_file" >/dev/null 2>&1; then
            cat "$error_file"
            echo 'validation=fail' >> "$GITHUB_OUTPUT"
            echo 'classification=unknown/high-risk' >> "$GITHUB_OUTPUT"
            echo 'candidate_needed=false' >> "$GITHUB_OUTPUT"
             echo 'candidate_sha=' >> "$GITHUB_OUTPUT"
             echo 'validated_tree=' >> "$GITHUB_OUTPUT"
             echo 'provenance_marker=' >> "$GITHUB_OUTPUT"
             echo 'candidate_diff_stat_b64=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          classification=$(jq -r '.classification' "$result_file")
          status=$(jq -r '.status' "$result_file")
           candidate_needed=$(jq -r '.candidate_needed' "$result_file")
           candidate_sha=$(jq -r '.candidate_sha // empty' "$result_file")
           validated_tree=$(jq -r '.validated_tree // empty' "$result_file")
           provenance_marker=
           if [[ "$candidate_needed" == "true" ]]; then
             upstream_version_file="$RUNNER_TEMP/upstream-app-build.gradle"
             git show "$UPSTREAM_SHA:app/build.gradle" > "$upstream_version_file"
             upstream_version_json=$(python3 scripts/u2_release.py parse-app-version --file "$upstream_version_file")
             upstream_version=$(jq -r '.versionName' <<<"$upstream_version_json")
             upstream_code=$(jq -r '.versionCode' <<<"$upstream_version_json")
             provenance_marker=$(python3 scripts/u2_release.py provenance-marker \
              --upstream "$UPSTREAM_SHA" \
              --candidate "$candidate_sha" \
              --tree "$validated_tree" \
              --fork-main "$UPSTREAM_SHA" \
              --upstream-version "$upstream_version" \
               --upstream-code "$upstream_code")
           fi
           changed_paths_b64=$(jq -jr '.changed_paths | join("\u0000")' "$result_file" | base64 -w 0)
          preserved_paths_b64=$(jq -jr '.preserved | join("\u0000")' "$result_file" | base64 -w 0)
          candidate_diff_stat_b64=$(git diff --stat "$base_sha...HEAD" | base64 -w 0)
          base_control_tree="$RUNNER_TEMP/base-control-tree.txt"
          candidate_control_tree="$RUNNER_TEMP/candidate-control-tree.txt"
          git ls-tree -r --full-tree "$base_sha" -- \
            .github scripts gradle/verified-releases.json \
            gradle/legacy-dependencies.lock.json AGENTS.md README.md update.json \
            > "$base_control_tree"
          git ls-tree -r --full-tree HEAD -- \
            .github scripts gradle/verified-releases.json \
            gradle/legacy-dependencies.lock.json AGENTS.md README.md update.json \
            > "$candidate_control_tree"
          diff -u "$base_control_tree" "$candidate_control_tree" >/dev/null || {
            echo "Candidate changed fork-owned control inputs; refusing validation."
            echo 'validation=fail' >> "$GITHUB_OUTPUT"
            echo 'classification=unknown/high-risk' >> "$GITHUB_OUTPUT"
            echo 'candidate_needed=false' >> "$GITHUB_OUTPUT"
            exit 0
          }
          echo "classification=$classification" >> "$GITHUB_OUTPUT"
           echo "candidate_needed=$candidate_needed" >> "$GITHUB_OUTPUT"
           echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
           echo "validated_tree=$validated_tree" >> "$GITHUB_OUTPUT"
           echo "provenance_marker=$provenance_marker" >> "$GITHUB_OUTPUT"
          echo "changed_paths_b64=$changed_paths_b64" >> "$GITHUB_OUTPUT"
          echo "preserved_paths_b64=$preserved_paths_b64" >> "$GITHUB_OUTPUT"
          echo "candidate_diff_stat_b64=$candidate_diff_stat_b64" >> "$GITHUB_OUTPUT"
          if [[ "$prepare_status" -eq 0 && "$status" == "clean" ]]; then
            echo 'validation=pass' >> "$GITHUB_OUTPUT"
          else
            echo 'validation=fail' >> "$GITHUB_OUTPUT"
          fi
          cat "$result_file"

      - name: Set up JDK 17 for candidate build
        if: steps.prepare.outputs.validation == 'pass' && steps.prepare.outputs.classification != 'docs-only'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK for candidate build
        if: steps.prepare.outputs.validation == 'pass' && steps.prepare.outputs.classification != 'docs-only'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android API 34 for candidate build
        if: steps.prepare.outputs.validation == 'pass' && steps.prepare.outputs.classification != 'docs-only'
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Stage pinned legacy dependencies for candidate build
        if: steps.prepare.outputs.validation == 'pass' && steps.prepare.outputs.classification != 'docs-only'
        run: |
          set -euo pipefail
          legacy_repo="$RUNNER_TEMP/tvbox-legacy-maven"
          python3 scripts/legacy_staging.py stage \
            --manifest gradle/legacy-dependencies.lock.json \
            --output "$legacy_repo"
          python3 scripts/legacy_staging.py verify \
            --manifest gradle/legacy-dependencies.lock.json \
            --output "$legacy_repo"
          echo "TVBOX_LEGACY_REPO=$legacy_repo" >> "$GITHUB_ENV"

      - name: Set up Gradle for candidate build
        if: steps.prepare.outputs.validation == 'pass' && steps.prepare.outputs.classification != 'docs-only'
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-disabled: true

      - name: Build candidate with read-only job permissions
        if: steps.prepare.outputs.validation == 'pass' && steps.prepare.outputs.classification != 'docs-only'
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: |
          chmod +x gradlew
          mkdir -p build
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

  write_candidate:
    name: Fast-forward main and open candidate PR
    needs: [probe, candidate_validation]
    if: needs.probe.result == 'success' && (needs.probe.outputs.state == 'fast-forward' || needs.probe.outputs.state == 'actionable-main-ahead' || needs.probe.outputs.state == 'no-actionable-delta' || needs.probe.outputs.state == 'candidate-branch-missing-after-main') && needs.candidate_validation.result == 'success' && needs.candidate_validation.outputs.validation == 'pass'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      failure_reason: ${{ steps.write.outputs.failure_reason }}
    steps:
      - name: Check out patched without executing candidate code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - id: write
        name: Fast-forward main and create candidate branch
        env:
          UPSTREAM_REPO: kukuqi666/TVBoxOS-Mobile
          UPSTREAM_SHA: ${{ needs.probe.outputs.upstream_sha }}
          FORK_MAIN_SHA: ${{ needs.probe.outputs.fork_main_sha }}
          PATCHED_SHA: ${{ needs.probe.outputs.patched_sha }}
          PROBE_STATE: ${{ needs.probe.outputs.state }}
          EXPECTED_CLASSIFICATION: ${{ needs.candidate_validation.outputs.classification }}
          EXPECTED_CANDIDATE_NEEDED: ${{ needs.candidate_validation.outputs.candidate_needed }}
          VALIDATED_TREE: ${{ needs.candidate_validation.outputs.validated_tree }}
          EXPECTED_PROVENANCE_MARKER: ${{ needs.candidate_validation.outputs.provenance_marker }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
           trusted_helper="$RUNNER_TEMP/trusted-upstream-monitor.py"
           cp scripts/upstream_monitor.py "$trusted_helper"
           existing_fork_main=$(git rev-parse refs/remotes/origin/main 2>/dev/null || true)
           if [[ -n "$existing_fork_main" && "$existing_fork_main" != "$FORK_MAIN_SHA" ]]; then
             echo "::error::fork main baseline changed during candidate write"
             exit 1
           fi
           git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin +refs/heads/patched:refs/remotes/origin/patched
          git fetch --no-tags "https://github.com/${UPSTREAM_REPO}.git" \
            +refs/heads/main:refs/remotes/upstream/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$FORK_MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/patched)" = "$PATCHED_SHA"
          test "$(git rev-parse refs/remotes/upstream/main)" = "$UPSTREAM_SHA"
          test "$(git rev-parse "$PATCHED_SHA")" = "$PATCHED_SHA"
          git merge-base --is-ancestor "$FORK_MAIN_SHA" "$UPSTREAM_SHA"
          if [[ "$PROBE_STATE" != "no-actionable-delta" && "$PROBE_STATE" != "actionable-main-ahead" && "$PROBE_STATE" != "candidate-branch-missing-after-main" ]]; then
            git merge-base --is-ancestor "$FORK_MAIN_SHA" "$PATCHED_SHA"
          fi

          git switch --detach "$PATCHED_SHA"
          result_file="$RUNNER_TEMP/candidate-result.json"
           python3 "$trusted_helper" prepare-candidate \
            --repo . \
            --upstream-ref "$UPSTREAM_SHA" \
            --base-ref HEAD > "$result_file"
          candidate_status=$(jq -r '.status' "$result_file")
          candidate_classification=$(jq -r '.classification' "$result_file")
           candidate_needed=$(jq -r '.candidate_needed' "$result_file")
           test "$candidate_status" = clean
          test "$candidate_classification" = "$EXPECTED_CLASSIFICATION"
          test "$candidate_needed" = "$EXPECTED_CANDIDATE_NEEDED"

           if [[ "$candidate_needed" != "true" ]]; then
            git push origin "refs/remotes/upstream/main:refs/heads/main"
            echo "Upstream is already integrated into patched; main fast-forwarded without opening an empty PR."
            exit 0
          fi

            candidate_branch=$(python3 "$trusted_helper" candidate-branch --upstream-sha "$UPSTREAM_SHA")
           git branch "$candidate_branch" HEAD
           git switch "$candidate_branch"
           expected_candidate_oid=$(git rev-parse HEAD)
           actual_candidate_tree=$(git rev-parse HEAD^{tree})
            if ! python3 "$trusted_helper" tree-check --actual "$actual_candidate_tree" --expected "$VALIDATED_TREE"; then
             echo 'failure_reason=validated-tree-mismatch' >> "$GITHUB_OUTPUT"
             echo "Validated tree mismatch before candidate push: $actual_candidate_tree != $VALIDATED_TREE"
             exit 1
           fi

           candidate_sha=$(jq -r '.candidate_sha' "$result_file")
           upstream_version_file="$RUNNER_TEMP/upstream-app-build.gradle"
           git show "$UPSTREAM_SHA:app/build.gradle" > "$upstream_version_file"
           upstream_version_json=$(python3 scripts/u2_release.py parse-app-version --file "$upstream_version_file")
            provenance_marker=$(python3 scripts/u2_release.py provenance-marker \
              --upstream "$UPSTREAM_SHA" \
              --candidate "$candidate_sha" \
              --tree "$VALIDATED_TREE" \
              --fork-main "$UPSTREAM_SHA" \
              --upstream-version "$(jq -r '.versionName' <<<"$upstream_version_json")" \
             --upstream-code "$(jq -r '.versionCode' <<<"$upstream_version_json")")
           test "$provenance_marker" = "$EXPECTED_PROVENANCE_MARKER"

          changed_paths=$(jq -r '.changed_paths[]?' "$result_file")
          candidate_diff_stat=$(git diff --stat "$PATCHED_SHA...HEAD")
          commit_summary=$(git log --format='- %h %s' "$FORK_MAIN_SHA..$UPSTREAM_SHA" | awk 'NR <= 50 {print}')
          preserved_paths=$(jq -r '.preserved[]?' "$result_file")
          if [[ "$candidate_classification" == "docs-only" ]]; then
            candidate_build_status="skipped: docs-only"
          else
            candidate_build_status="PASS: assembleDebug"
          fi
          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          ## 上游更新候选

          - upstream：kukuqi666/TVBoxOS-Mobile
          - upstream SHA：$FORK_MAIN_SHA → $UPSTREAM_SHA
          - candidate：$candidate_branch
           - candidate merge SHA：$(jq -r '.candidate_sha' "$result_file")
           - candidate tree：${VALIDATED_TREE:0:12}
           <!-- tvbox-upstream-candidate-tree:$VALIDATED_TREE -->
           $provenance_marker
          - 风险分类：$candidate_classification
          - candidate validation：PASS（独立 read-only job；$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID）
          - candidate build：$candidate_build_status

          ### 上游提交

          $commit_summary

          ### 候选变更文件

          $changed_paths

          ### Candidate diff stat

          $candidate_diff_stat

          ### 按 fork policy 保留

          ${preserved_paths:-无}

          下一步请把 PR 交给 ChatGPT/OC 复核，再决定是否 Merge 到 patched。U1 不自动合并 patched，也不执行签名或正式发布。
          EOF
           git push origin "refs/remotes/upstream/main:refs/heads/main"
           git push origin "HEAD:refs/heads/$candidate_branch"
          git fetch --no-tags origin \
            "+refs/heads/$candidate_branch:refs/remotes/origin/$candidate_branch"
          actual_candidate_oid=$(git rev-parse "refs/remotes/origin/$candidate_branch")
          test "$actual_candidate_oid" = "$expected_candidate_oid"
          git merge-base --is-ancestor "$PATCHED_SHA" "$actual_candidate_oid"
          if ! git diff --quiet "$PATCHED_SHA" "$actual_candidate_oid" -- \
            .github/ scripts/ gradle/verified-releases.json \
            gradle/legacy-dependencies.lock.json AGENTS.md README.md update.json; then
            echo 'failure_reason=fork-control-input-changed' >> "$GITHUB_OUTPUT"
            echo "Fork-owned control inputs changed after candidate push"
            exit 1
          fi
           expected_candidate_tree="$VALIDATED_TREE"
           actual_candidate_tree=$(git rev-parse "refs/remotes/origin/$candidate_branch^{tree}")
            if ! python3 "$trusted_helper" tree-check --actual "$actual_candidate_tree" --expected "$expected_candidate_tree"; then
             echo 'failure_reason=validated-tree-mismatch' >> "$GITHUB_OUTPUT"
             echo "Validated tree mismatch after candidate push: $actual_candidate_tree != $expected_candidate_tree"
             exit 1
           fi
            python3 "$trusted_helper" create-pr \
             --repo "$GITHUB_REPOSITORY" \
             --base patched \
             --head "$candidate_branch" \
             --title "chore: upstream candidate ${UPSTREAM_SHA:0:12}" \
             --body-file "$RUNNER_TEMP/pr-body.md" \
             --expected-oid "$expected_candidate_oid" \
             --reviewer slashinchi

  repair_candidate_pr:
    name: Recover existing candidate branch PR
    needs: [probe]
    if: needs.probe.result == 'success' && needs.probe.outputs.state == 'candidate-branch-no-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      failure_reason: ${{ steps.recover.outputs.failure_reason }}
    steps:
      - name: Check out trusted monitor code without executing candidate code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - id: recover
        name: Reuse existing candidate branch without force update
        env:
          UPSTREAM_REPO: kukuqi666/TVBoxOS-Mobile
          UPSTREAM_SHA: ${{ needs.probe.outputs.upstream_sha }}
          FORK_MAIN_SHA: ${{ needs.probe.outputs.fork_main_sha }}
          PATCHED_SHA: ${{ needs.probe.outputs.patched_sha }}
          CANDIDATE_BRANCH_OID: ${{ needs.probe.outputs.candidate_branch_oid }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
           trusted_helper="$RUNNER_TEMP/trusted-upstream-monitor.py"
           cp scripts/upstream_monitor.py "$trusted_helper"
           candidate_branch=$(python3 "$trusted_helper" candidate-branch --upstream-sha "$UPSTREAM_SHA")
           existing_fork_main=$(git rev-parse refs/remotes/origin/main 2>/dev/null || true)
           if [[ -n "$existing_fork_main" && "$existing_fork_main" != "$FORK_MAIN_SHA" ]]; then
             echo "::error::fork main baseline changed during recovery"
             exit 1
           fi
           git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin +refs/heads/patched:refs/remotes/origin/patched
          git fetch --no-tags "https://github.com/${UPSTREAM_REPO}.git" \
            +refs/heads/main:refs/remotes/upstream/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$FORK_MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/patched)" = "$PATCHED_SHA"
          test "$(git rev-parse refs/remotes/upstream/main)" = "$UPSTREAM_SHA"
          git merge-base --is-ancestor "$FORK_MAIN_SHA" "$UPSTREAM_SHA"
          git ls-remote --exit-code origin "refs/heads/$candidate_branch" >/dev/null
          git fetch --no-tags origin \
            "+refs/heads/$candidate_branch:refs/remotes/origin/$candidate_branch"
          actual_candidate_oid=$(git rev-parse "refs/remotes/origin/$candidate_branch")
          test "$actual_candidate_oid" = "$CANDIDATE_BRANCH_OID"
          git merge-base --is-ancestor "$PATCHED_SHA" "$actual_candidate_oid"

          git switch --detach "$PATCHED_SHA"
          expected_file="$RUNNER_TEMP/expected-candidate.json"
           python3 "$trusted_helper" prepare-candidate \
             --repo . \
             --upstream-ref "$UPSTREAM_SHA" \
             --base-ref HEAD > "$expected_file"
           test "$(jq -r '.status' "$expected_file")" = clean
           candidate_classification=$(jq -r '.classification' "$expected_file")
            expected_tree=$(jq -r '.validated_tree // empty' "$expected_file")
           test -n "$expected_tree"
            actual_tree=$(git rev-parse "refs/remotes/origin/$candidate_branch^{tree}")
           upstream_version_file="$RUNNER_TEMP/upstream-app-build.gradle"
           git show "$UPSTREAM_SHA:app/build.gradle" > "$upstream_version_file"
           upstream_version_json=$(python3 scripts/u2_release.py parse-app-version --file "$upstream_version_file")
            provenance_marker=$(python3 scripts/u2_release.py provenance-marker \
              --upstream "$UPSTREAM_SHA" \
              --candidate "$CANDIDATE_BRANCH_OID" \
              --tree "$expected_tree" \
              --fork-main "$UPSTREAM_SHA" \
              --upstream-version "$(jq -r '.versionName' <<<"$upstream_version_json")" \
             --upstream-code "$(jq -r '.versionCode' <<<"$upstream_version_json")")
           if ! python3 "$trusted_helper" tree-check --actual "$actual_tree" --expected "$expected_tree"; then
             echo 'failure_reason=validated-tree-mismatch' >> "$GITHUB_OUTPUT"
             echo "Validated tree mismatch during recovery: $actual_tree != $expected_tree"
             exit 1
           fi
          git push origin "refs/remotes/upstream/main:refs/heads/main"
          git fetch --no-tags origin \
            "+refs/heads/$candidate_branch:refs/remotes/origin/$candidate_branch"
           actual_candidate_oid=$(git rev-parse "refs/remotes/origin/$candidate_branch")
           test "$actual_candidate_oid" = "$CANDIDATE_BRANCH_OID"
           git merge-base --is-ancestor "$PATCHED_SHA" "$actual_candidate_oid"
           actual_tree=$(git rev-parse "refs/remotes/origin/$candidate_branch^{tree}")
           if ! python3 "$trusted_helper" tree-check --actual "$actual_tree" --expected "$expected_tree"; then
             echo 'failure_reason=validated-tree-mismatch' >> "$GITHUB_OUTPUT"
             echo "Validated tree changed during recovery: $actual_tree != $expected_tree"
             exit 1
           fi

          changed_paths=$(git diff --name-only "$PATCHED_SHA...refs/remotes/origin/$candidate_branch")
          candidate_diff_stat=$(git diff --stat "$PATCHED_SHA...refs/remotes/origin/$candidate_branch")
          commit_summary=$(git log --format='- %h %s' "$FORK_MAIN_SHA..$UPSTREAM_SHA" | awk 'NR <= 50 {print}')
          if [[ "$candidate_classification" == "docs-only" ]]; then
            candidate_build_status="skipped: docs-only"
          else
            candidate_build_status="PASS: prior read-only validation"
          fi
          cat > "$RUNNER_TEMP/recovery-pr-body.md" <<EOF
          ## 上游候选 PR 恢复

          - upstream：kukuqi666/TVBoxOS-Mobile
          - upstream SHA：$FORK_MAIN_SHA → $UPSTREAM_SHA
          - existing candidate：$candidate_branch
           - candidate merge SHA：$CANDIDATE_BRANCH_OID
           - candidate tree：${expected_tree:0:12}
           <!-- tvbox-upstream-candidate-tree:$expected_tree -->
           $provenance_marker
          - 风险分类：$candidate_classification
          - recovery：复用已推送分支；不 force-update，不执行 candidate code
          - candidate validation：此前 run 已完成；本次重新校验 branch OID/tree；只恢复 PR 入口
          - candidate build：$candidate_build_status

          ### 上游提交

          $commit_summary

          ### Candidate diff stat

          $candidate_diff_stat

          ### 候选变更文件

          $changed_paths

          请把 PR 交给 ChatGPT/OC 复核，再决定是否 Merge 到 patched。
          EOF
            python3 "$trusted_helper" create-pr \
             --repo "$GITHUB_REPOSITORY" \
             --base patched \
             --head "$candidate_branch" \
             --title "chore: recover upstream candidate ${UPSTREAM_SHA:0:12}" \
             --body-file "$RUNNER_TEMP/recovery-pr-body.md" \
             --expected-oid "$CANDIDATE_BRANCH_OID" \
             --reviewer slashinchi

  notify:
    name: Notify and fail closed
    needs: [event_gate, date_gate, fixture_tests, probe, candidate_validation, write_candidate, repair_candidate_pr]
    if: >-
      always() &&
      needs.event_gate.result == 'success' &&
      needs.event_gate.outputs.accepted == 'true' &&
      (
        needs.date_gate.result != 'success' ||
        (
          needs.date_gate.outputs.active == 'true' &&
          (
            needs.fixture_tests.result != 'success' ||
            needs.probe.result != 'success' ||
            (needs.probe.outputs.state != 'no-change' &&
             needs.probe.outputs.state != 'already-open' &&
             needs.probe.outputs.state != 'fast-forward' &&
             needs.probe.outputs.state != 'actionable-main-ahead' &&
             needs.probe.outputs.state != 'no-actionable-delta' &&
             needs.probe.outputs.state != 'candidate-branch-no-pr' &&
             needs.probe.outputs.state != 'candidate-branch-missing-after-main') ||
             needs.candidate_validation.result == 'failure' ||
             needs.candidate_validation.result == 'cancelled' ||
             needs.candidate_validation.outputs.validation == 'fail' ||
             needs.write_candidate.result == 'failure' ||
             needs.write_candidate.result == 'cancelled' ||
             needs.repair_candidate_pr.result == 'failure' ||
             needs.repair_candidate_pr.result == 'cancelled' ||
             (needs.probe.outputs.state == 'no-actionable-delta' && needs.write_candidate.result == 'success')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out trusted monitor code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Create or update a deduplicated issue
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_RESULT: ${{ needs.fixture_tests.result }}
          DATE_GATE_RESULT: ${{ needs.date_gate.result }}
          PROBE_STATE: ${{ needs.probe.outputs.state }}
          VALIDATION: ${{ needs.candidate_validation.outputs.validation }}
          VALIDATION_RESULT: ${{ needs.candidate_validation.result }}
          WRITE_RESULT: ${{ needs.write_candidate.result }}
          WRITE_FAILURE_REASON: ${{ needs.write_candidate.outputs.failure_reason }}
          REPAIR_RESULT: ${{ needs.repair_candidate_pr.result }}
          REPAIR_FAILURE_REASON: ${{ needs.repair_candidate_pr.outputs.failure_reason }}
          FORK_MAIN_SHA: ${{ needs.probe.outputs.fork_main_sha }}
          UPSTREAM_SHA: ${{ needs.probe.outputs.upstream_sha }}
          PATCHED_SHA: ${{ needs.probe.outputs.patched_sha }}
          CLASSIFICATION: ${{ needs.candidate_validation.outputs.classification }}
          CANDIDATE_SHA: ${{ needs.candidate_validation.outputs.candidate_sha }}
          VALIDATED_TREE: ${{ needs.candidate_validation.outputs.validated_tree }}
          CHANGED_PATHS_B64: ${{ needs.candidate_validation.outputs.changed_paths_b64 }}
          PRESERVED_PATHS_B64: ${{ needs.candidate_validation.outputs.preserved_paths_b64 }}
          CANDIDATE_DIFF_STAT_B64: ${{ needs.candidate_validation.outputs.candidate_diff_stat_b64 }}
          COMMIT_SUMMARY_B64: ${{ needs.probe.outputs.commit_summary_b64 }}
          SOURCE_DIFF_STAT_B64: ${{ needs.probe.outputs.source_diff_stat_b64 }}
        run: |
          set -euo pipefail
           trusted_helper="$RUNNER_TEMP/trusted-upstream-monitor.py"
           cp scripts/upstream_monitor.py "$trusted_helper"
           reason=$(python3 "$trusted_helper" notification-reason \
             --fixture-result "$FIXTURE_RESULT" \
             --date-gate-result "$DATE_GATE_RESULT" \
             --probe-state "$PROBE_STATE" \
             --validation "$VALIDATION" \
             --validation-result "$VALIDATION_RESULT" \
             --write-result "$WRITE_RESULT" \
             --write-failure-reason "$WRITE_FAILURE_REASON" \
             --repair-result "$REPAIR_RESULT" \
             --repair-failure-reason "$REPAIR_FAILURE_REASON")
           issue_key="${UPSTREAM_SHA:-global}"
           [[ -n "$issue_key" ]] || issue_key=global
           display_key="${issue_key:0:12}"
           title="[upstream-monitor] $reason $display_key"
          changed_paths="not available"
          if [[ -n "$CHANGED_PATHS_B64" ]]; then
            changed_paths=$(printf '%s' "$CHANGED_PATHS_B64" | base64 --decode | tr '\0' ',')
          fi
          preserved_paths="none"
          if [[ -n "$PRESERVED_PATHS_B64" ]]; then
            preserved_paths=$(printf '%s' "$PRESERVED_PATHS_B64" | base64 --decode | tr '\0' ',')
          fi
          commit_summary="not available"
          if [[ -n "$COMMIT_SUMMARY_B64" ]]; then
            commit_summary=$(printf '%s' "$COMMIT_SUMMARY_B64" | base64 --decode)
          fi
          source_diff_stat="not available"
          if [[ -n "$SOURCE_DIFF_STAT_B64" ]]; then
            source_diff_stat=$(printf '%s' "$SOURCE_DIFF_STAT_B64" | base64 --decode)
          fi
          candidate_diff_stat="not available (candidate not produced)"
          if [[ -n "$CANDIDATE_DIFF_STAT_B64" ]]; then
            candidate_diff_stat=$(printf '%s' "$CANDIDATE_DIFF_STAT_B64" | base64 --decode)
          fi
          if [[ "$CLASSIFICATION" == "docs-only" ]]; then
            candidate_build_status="skipped: docs-only"
          elif [[ "$VALIDATION_RESULT" == "success" && "$VALIDATION" == "pass" ]]; then
            candidate_build_status="PASS: assembleDebug"
          else
            candidate_build_status="not run / failed closed"
          fi
           comment_marker="<!-- tvbox-upstream-monitor:$reason:$issue_key -->"
           if [[ "$reason" == "no-actionable-delta" ]]; then
             body=$(cat <<EOF
           $comment_marker
           @slashinchi upstream 已更新，main 已同步；这是 information-only 通知，fork candidate 为空，无需 Merge/发版。

           - upstream full SHA：${UPSTREAM_SHA:-unknown}
           - source diff stat：$source_diff_stat
           - fork-owned preserved：$preserved_paths
           - candidate：none（仅 fork-owned 文件变化）
           - signed RC / Release：not run
           - workflow run：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
             )
           else
             body=$(cat <<EOF
           $comment_marker
           @slashinchi U1 upstream monitor 已 fail closed。

           - reason：$reason
           - upstream full SHA：${UPSTREAM_SHA:-unknown}
           - fork main SHA：${FORK_MAIN_SHA:-unknown}
           - patched SHA：${PATCHED_SHA:-unknown}
           - candidate SHA：${CANDIDATE_SHA:-none}
           - validated tree：${VALIDATED_TREE:-none}
           - risk classification：${CLASSIFICATION:-unknown/high-risk}
           - candidate build/validation：$candidate_build_status / ${VALIDATION:-unknown}
           - changed files：$changed_paths
           - source diff stat：$source_diff_stat
           - candidate diff stat：$candidate_diff_stat
           - fork-owned preserved：$preserved_paths
           - workflow run：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
           - probe state：${PROBE_STATE:-unknown}

           ### Upstream commit summary

           $commit_summary

           请把本 Issue 交给 ChatGPT/OC 复核；automation 不会自动合并 patched。
          EOF
             )
           fi
           issue_body_file="$RUNNER_TEMP/upstream-monitor-issue.md"
           printf '%s' "$body" > "$issue_body_file"
           existing_issue=$(python3 "$trusted_helper" find-issue \
             --repo "$GITHUB_REPOSITORY" \
             --marker "$comment_marker" \
             --state all)
           if [[ -z "${existing_issue:-}" ]]; then
             existing_issue='null'
           fi
           existing=$(jq -r '.number // empty' <<<"$existing_issue")
           if [[ -n "$existing" ]]; then
             python3 "$trusted_helper" issue-comment \
               --repo "$GITHUB_REPOSITORY" \
               --number "$existing" \
               --body-file "$issue_body_file" \
               --marker "$comment_marker"
             python3 "$trusted_helper" issue-edit \
               --repo "$GITHUB_REPOSITORY" \
               --number "$existing" \
               --assignee slashinchi
           else
             python3 "$trusted_helper" issue-create \
               --repo "$GITHUB_REPOSITORY" \
               --title "$title" \
               --body-file "$issue_body_file" \
               --assignee slashinchi
           fi
           if [[ "$reason" == "no-actionable-delta" ]]; then
             exit 0
           fi
           exit 1

  recover:
    name: Close recovered automation issues
    needs: [fixture_tests, date_gate, probe, candidate_validation, write_candidate, repair_candidate_pr, notify]
    if: >-
      always() &&
      needs.fixture_tests.result == 'success' &&
      needs.date_gate.result == 'success' &&
      needs.date_gate.outputs.active == 'true' &&
      needs.probe.result == 'success' &&
      (needs.notify.result == 'success' || needs.notify.result == 'skipped') &&
      needs.candidate_validation.result != 'cancelled' &&
      needs.write_candidate.result != 'cancelled' &&
      needs.repair_candidate_pr.result != 'cancelled' &&
      (
        needs.probe.outputs.state == 'no-change' ||
        needs.probe.outputs.state == 'no-actionable-delta' ||
        needs.probe.outputs.state == 'already-open' ||
        needs.repair_candidate_pr.result == 'success' ||
        needs.write_candidate.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out trusted monitor code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Close resolved U1 automation issues
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ needs.probe.outputs.upstream_sha }}
        run: |
          set -euo pipefail
           trusted_helper="$RUNNER_TEMP/trusted-upstream-monitor.py"
           cp scripts/upstream_monitor.py "$trusted_helper"
           recovery_key="${UPSTREAM_SHA:-global}"
           [[ -n "$recovery_key" ]] || recovery_key=global
           open_issues=$(python3 "$trusted_helper" list-issues --repo "$GITHUB_REPOSITORY" --state open)
           resolved_issue_numbers=$(python3 "$trusted_helper" recoverable-issues \
             --recovery-key "$recovery_key" <<<"$open_issues" | jq -r '.[]')
           while IFS= read -r number; do
             [[ -z "$number" ]] && continue
             recovery_marker=$(python3 "$trusted_helper" recovery-marker --number "$number")
             recovery_body_file="$RUNNER_TEMP/recovery-comment-$number.md"
             printf '%s\nU1 已恢复；本次检查通过，自动关闭该去重 Issue。\n' \
               "$recovery_marker" > "$recovery_body_file"
             python3 "$trusted_helper" issue-comment \
               --repo "$GITHUB_REPOSITORY" \
               --number "$number" \
               --body-file "$recovery_body_file" \
               --marker "$recovery_marker"
             python3 "$trusted_helper" issue-close \
               --repo "$GITHUB_REPOSITORY" \
               --number "$number"
           done <<<"$resolved_issue_numbers"
