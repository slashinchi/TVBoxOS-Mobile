name: Upstream Maintenance Monitor

on:
  schedule:
    - cron: '22 12 * * *'
      timezone: Asia/Shanghai
    - cron: '22 22 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      force_check:
        description: Run the upstream check even on an off day
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: upstream-maintenance-monitor
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  fixture_tests:
    name: U1 fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out trusted monitor code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run deterministic fixtures
        run: python3 scripts/upstream_monitor.py fixture-test

  date_gate:
    name: Check schedule gate
    needs: fixture_tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      active: ${{ steps.gate.outputs.active }}
      local_date: ${{ steps.gate.outputs.local_date }}
    steps:
      - name: Check out trusted monitor code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - id: gate
        name: Apply strict every-two-days gate
        env:
          FORCE_CHECK: ${{ inputs.force_check || false }}
        run: |
          set -euo pipefail
          local_date=$(TZ=Asia/Shanghai date +%F)
          args=(date-gate --date "$local_date")
          if [[ "$FORCE_CHECK" == "true" ]]; then
            args+=(--force-check)
          fi
          result=$(python3 scripts/upstream_monitor.py "${args[@]}")
          active=$(jq -r '.active' <<<"$result")
          echo "local_date=$local_date" >> "$GITHUB_OUTPUT"
          echo "active=$active" >> "$GITHUB_OUTPUT"
          if [[ "$active" != "true" ]]; then
            echo "Off-day: no upstream repository check will run."
          fi

  probe:
    name: Probe upstream and repository state
    needs: date_gate
    if: needs.date_gate.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      state: ${{ steps.probe.outputs.state }}
      upstream_sha: ${{ steps.probe.outputs.upstream_sha }}
      fork_main_sha: ${{ steps.probe.outputs.fork_main_sha }}
      patched_sha: ${{ steps.probe.outputs.patched_sha }}
      candidate_branch_oid: ${{ steps.probe.outputs.candidate_branch_oid }}
      commit_summary_b64: ${{ steps.probe.outputs.commit_summary_b64 }}
      source_diff_stat_b64: ${{ steps.probe.outputs.source_diff_stat_b64 }}
    steps:
      - name: Check out trusted monitor code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - id: probe
        name: Compare upstream, main, patched, and open candidates
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: kukuqi666/TVBoxOS-Mobile
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags "https://github.com/${UPSTREAM_REPO}.git" \
            +refs/heads/main:refs/remotes/upstream/main

          upstream_sha=$(git rev-parse refs/remotes/upstream/main)
          fork_main_sha=$(git rev-parse refs/remotes/origin/main)
          patched_sha=$(git rev-parse HEAD)
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "fork_main_sha=$fork_main_sha" >> "$GITHUB_OUTPUT"
          echo "patched_sha=$patched_sha" >> "$GITHUB_OUTPUT"
          commit_summary=$(git log --format='- %h %s' "$fork_main_sha..$upstream_sha" 2>/dev/null | awk 'NR <= 50 {print}' || true)
          source_diff_stat=$(git diff --stat "$fork_main_sha...$upstream_sha" 2>/dev/null || true)
          commit_summary_b64=$(printf '%s' "$commit_summary" | base64 -w 0)
          source_diff_stat_b64=$(printf '%s' "$source_diff_stat" | base64 -w 0)
          echo "commit_summary_b64=$commit_summary_b64" >> "$GITHUB_OUTPUT"
          echo "source_diff_stat_b64=$source_diff_stat_b64" >> "$GITHUB_OUTPUT"

          main_is_ancestor=false
          patched_contains_main=false
          if git merge-base --is-ancestor "$fork_main_sha" "$upstream_sha"; then
            main_is_ancestor=true
          fi
          if git merge-base --is-ancestor "$fork_main_sha" "$patched_sha"; then
            patched_contains_main=true
          fi

          preview_status=not-run
          preview_candidate_needed=unknown
          if [[ "$main_is_ancestor" == "true" && ( "$fork_main_sha" != "$upstream_sha" || "$patched_contains_main" != "true" ) ]]; then
            preview_file="$RUNNER_TEMP/candidate-preview.json"
            set +e
            python3 scripts/upstream_monitor.py prepare-candidate \
              --repo . \
              --upstream-ref "$upstream_sha" \
              --base-ref "$patched_sha" > "$preview_file" 2> "$RUNNER_TEMP/candidate-preview.log"
            preview_exit=$?
            set -e
            if jq -e . "$preview_file" >/dev/null 2>&1; then
              preview_status=$(jq -r '.status' "$preview_file")
              preview_candidate_needed=$(jq -r '.candidate_needed' "$preview_file")
            else
              preview_status=error
              echo "Candidate preview failed (exit $preview_exit):"
              cat "$RUNNER_TEMP/candidate-preview.log"
            fi
          fi

          list_all_prs() {
            local pages normalized attempt
            for attempt in 1 2 3; do
              if pages=$(timeout 30s gh api \
                --paginate \
                --slurp \
                "repos/$GITHUB_REPOSITORY/pulls?state=all&per_page=100"); then
                if normalized=$(jq -c '[.[][] | {
                  number,
                  url: .html_url,
                  state: (if .merged_at != null then "MERGED" elif .state == "open" then "OPEN" else "CLOSED" end),
                  headRefName: .head.ref,
                  headRefOid: .head.sha,
                  headRepository: {nameWithOwner: (.head.repo.full_name // "")},
                  baseRefName: .base.ref
                }]' <<<"$pages"); then
                  printf '%s' "$normalized"
                  return 0
                fi
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          policy=none
          candidate_branch_exists=false
          candidate_branch_oid=
          if [[ "$preview_candidate_needed" == "true" ]]; then
            exact_branch="automation/upstream-${upstream_sha:0:7}"
            candidate_branch_oid=$(git ls-remote origin "refs/heads/$exact_branch" | awk 'NR == 1 {print $1}')
            if [[ -n "$candidate_branch_oid" ]]; then
              candidate_branch_exists=true
            fi
            open_prs=$(list_all_prs)
            policy=$(jq -r \
              --arg exact "$exact_branch" \
              --arg oid "$candidate_branch_oid" \
              --arg repository "$GITHUB_REPOSITORY" \
              'def ours: (.headRepository.nameWithOwner // "") == $repository;
               if any(.[]; ours and .headRefName == $exact and .baseRefName == "patched" and .state == "OPEN" and $oid != "" and .headRefOid == $oid) then "already-open"
               elif any(.[]; ours and .headRefName == $exact and .state == "OPEN") then "stale-open"
               elif any(.[]; ours and .headRefName == $exact and .state != "OPEN") then "closed-or-merged"
               elif any(.[]; ours and .state == "OPEN" and (.headRefName | startswith("automation/upstream-"))) then "stale-open"
               else "create" end' \
              <<<"$open_prs")
          fi

          if [[ "$main_is_ancestor" != "true" ]]; then
            state=main-divergence
          elif [[ "$preview_status" == "conflict" ]]; then
            state=candidate-conflict
          elif [[ "$preview_status" == "error" ]]; then
            state=candidate-preview-error
          elif [[ "$preview_candidate_needed" == "false" ]]; then
            state=no-actionable-delta
          elif [[ "$policy" == "closed-or-merged" ]]; then
            state=candidate-closed-or-merged
          elif [[ "$candidate_branch_exists" == "true" && "$policy" == "create" ]]; then
            state=candidate-branch-no-pr
          elif [[ "$fork_main_sha" == "$upstream_sha" && "$patched_contains_main" != "true" && "$candidate_branch_exists" != "true" && "$policy" == "create" ]]; then
            state=candidate-branch-missing-after-main
          elif [[ "$fork_main_sha" == "$upstream_sha" && "$patched_contains_main" != "true" ]]; then
            state=$([[ "$policy" == "create" ]] && echo patched-behind-main || echo "$policy")
          elif [[ "$patched_contains_main" != "true" ]]; then
            state=patched-behind-main
          elif [[ "$fork_main_sha" == "$upstream_sha" ]]; then
            state=no-change
          else
            state=$([[ "$policy" == "create" ]] && echo fast-forward || echo "$policy")
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "candidate_branch_oid=$candidate_branch_oid" >> "$GITHUB_OUTPUT"
          echo "Probe state: $state"

  candidate_validation:
    name: Validate upstream candidate without write or signing access
    needs: [date_gate, probe]
    if: needs.probe.result == 'success' && (needs.probe.outputs.state == 'fast-forward' || needs.probe.outputs.state == 'no-actionable-delta' || needs.probe.outputs.state == 'candidate-branch-missing-after-main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      validation: ${{ steps.prepare.outputs.validation }}
      classification: ${{ steps.prepare.outputs.classification }}
      candidate_needed: ${{ steps.prepare.outputs.candidate_needed }}
      candidate_sha: ${{ steps.prepare.outputs.candidate_sha }}
      changed_paths_b64: ${{ steps.prepare.outputs.changed_paths_b64 }}
      preserved_paths_b64: ${{ steps.prepare.outputs.preserved_paths_b64 }}
      candidate_diff_stat_b64: ${{ steps.prepare.outputs.candidate_diff_stat_b64 }}
    steps:
      - name: Check out trusted monitor code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.probe.outputs.patched_sha }}
          fetch-depth: 0
          persist-credentials: false

      - id: prepare
        name: Prepare candidate merge and classify changes
        env:
          UPSTREAM_REPO: kukuqi666/TVBoxOS-Mobile
          UPSTREAM_SHA: ${{ needs.probe.outputs.upstream_sha }}
        run: |
          set +e
          git fetch --no-tags "https://github.com/${UPSTREAM_REPO}.git" \
            +refs/heads/main:refs/remotes/upstream/main
          if [[ "$(git rev-parse refs/remotes/upstream/main)" != "$UPSTREAM_SHA" ]]; then
            echo "Candidate upstream SHA changed during validation."
            echo 'validation=fail' >> "$GITHUB_OUTPUT"
            echo 'classification=unknown/high-risk' >> "$GITHUB_OUTPUT"
            echo 'candidate_needed=false' >> "$GITHUB_OUTPUT"
            echo 'candidate_sha=' >> "$GITHUB_OUTPUT"
            echo 'candidate_diff_stat_b64=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base_sha=$(git rev-parse HEAD)
          result_file="$RUNNER_TEMP/candidate-result.json"
          error_file="$RUNNER_TEMP/candidate-error.log"
          python3 scripts/upstream_monitor.py prepare-candidate \
            --repo . \
            --upstream-ref "$UPSTREAM_SHA" \
            --base-ref HEAD > "$result_file" 2> "$error_file"
          prepare_status=$?
          set -e
          if ! jq -e . "$result_file" >/dev/null 2>&1; then
            cat "$error_file"
            echo 'validation=fail' >> "$GITHUB_OUTPUT"
            echo 'classification=unknown/high-risk' >> "$GITHUB_OUTPUT"
            echo 'candidate_needed=false' >> "$GITHUB_OUTPUT"
            echo 'candidate_sha=' >> "$GITHUB_OUTPUT"
            echo 'candidate_diff_stat_b64=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          classification=$(jq -r '.classification' "$result_file")
          status=$(jq -r '.status' "$result_file")
          candidate_needed=$(jq -r '.candidate_needed' "$result_file")
          candidate_sha=$(jq -r '.candidate_sha // empty' "$result_file")
          changed_paths_b64=$(jq -jr '.changed_paths | join("\u0000")' "$result_file" | base64 -w 0)
          preserved_paths_b64=$(jq -jr '.preserved | join("\u0000")' "$result_file" | base64 -w 0)
          candidate_diff_stat_b64=$(git diff --stat "$base_sha...HEAD" | base64 -w 0)
          echo "classification=$classification" >> "$GITHUB_OUTPUT"
          echo "candidate_needed=$candidate_needed" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "changed_paths_b64=$changed_paths_b64" >> "$GITHUB_OUTPUT"
          echo "preserved_paths_b64=$preserved_paths_b64" >> "$GITHUB_OUTPUT"
          echo "candidate_diff_stat_b64=$candidate_diff_stat_b64" >> "$GITHUB_OUTPUT"
          if [[ "$prepare_status" -eq 0 && "$status" == "clean" ]]; then
            echo 'validation=pass' >> "$GITHUB_OUTPUT"
          else
            echo 'validation=fail' >> "$GITHUB_OUTPUT"
          fi
          cat "$result_file"

      - name: Set up JDK 17 for candidate build
        if: steps.prepare.outputs.validation == 'pass' && steps.prepare.outputs.classification != 'docs-only'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK for candidate build
        if: steps.prepare.outputs.validation == 'pass' && steps.prepare.outputs.classification != 'docs-only'
        uses: android-actions/setup-android@v3

      - name: Install Android API 34 for candidate build
        if: steps.prepare.outputs.validation == 'pass' && steps.prepare.outputs.classification != 'docs-only'
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle for candidate build
        if: steps.prepare.outputs.validation == 'pass' && steps.prepare.outputs.classification != 'docs-only'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build candidate with read-only job permissions
        if: steps.prepare.outputs.validation == 'pass' && steps.prepare.outputs.classification != 'docs-only'
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: |
          chmod +x gradlew
          mkdir -p build
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

  write_candidate:
    name: Fast-forward main and open candidate PR
    needs: [probe, candidate_validation]
    if: needs.probe.result == 'success' && (needs.probe.outputs.state == 'fast-forward' || needs.probe.outputs.state == 'no-actionable-delta' || needs.probe.outputs.state == 'candidate-branch-missing-after-main') && needs.candidate_validation.result == 'success' && needs.candidate_validation.outputs.validation == 'pass'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out patched without executing candidate code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fast-forward main and create candidate branch
        env:
          UPSTREAM_REPO: kukuqi666/TVBoxOS-Mobile
          UPSTREAM_SHA: ${{ needs.probe.outputs.upstream_sha }}
          FORK_MAIN_SHA: ${{ needs.probe.outputs.fork_main_sha }}
          PATCHED_SHA: ${{ needs.probe.outputs.patched_sha }}
          PROBE_STATE: ${{ needs.probe.outputs.state }}
          EXPECTED_CLASSIFICATION: ${{ needs.candidate_validation.outputs.classification }}
          EXPECTED_CANDIDATE_NEEDED: ${{ needs.candidate_validation.outputs.candidate_needed }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin +refs/heads/patched:refs/remotes/origin/patched
          git fetch --no-tags "https://github.com/${UPSTREAM_REPO}.git" \
            +refs/heads/main:refs/remotes/upstream/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$FORK_MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/patched)" = "$PATCHED_SHA"
          test "$(git rev-parse refs/remotes/upstream/main)" = "$UPSTREAM_SHA"
          test "$(git rev-parse "$PATCHED_SHA")" = "$PATCHED_SHA"
          git merge-base --is-ancestor "$FORK_MAIN_SHA" "$UPSTREAM_SHA"
          if [[ "$PROBE_STATE" != "no-actionable-delta" && "$PROBE_STATE" != "candidate-branch-missing-after-main" ]]; then
            git merge-base --is-ancestor "$FORK_MAIN_SHA" "$PATCHED_SHA"
          fi

          git switch --detach "$PATCHED_SHA"
          result_file="$RUNNER_TEMP/candidate-result.json"
          python3 scripts/upstream_monitor.py prepare-candidate \
            --repo . \
            --upstream-ref "$UPSTREAM_SHA" \
            --base-ref HEAD > "$result_file"
          candidate_status=$(jq -r '.status' "$result_file")
          candidate_classification=$(jq -r '.classification' "$result_file")
          candidate_needed=$(jq -r '.candidate_needed' "$result_file")
          test "$candidate_status" = clean
          test "$candidate_classification" = "$EXPECTED_CLASSIFICATION"
          test "$candidate_needed" = "$EXPECTED_CANDIDATE_NEEDED"

          if [[ "$candidate_needed" != "true" ]]; then
            git push origin "refs/remotes/upstream/main:refs/heads/main"
            echo "Upstream is already integrated into patched; main fast-forwarded without opening an empty PR."
            exit 0
          fi

          candidate_branch="automation/upstream-${UPSTREAM_SHA:0:7}"
          git branch "$candidate_branch" HEAD
          git switch "$candidate_branch"
          expected_candidate_oid=$(git rev-parse HEAD)

          changed_paths=$(jq -r '.changed_paths[]?' "$result_file")
          candidate_diff_stat=$(git diff --stat "$PATCHED_SHA...HEAD")
          commit_summary=$(git log --format='- %h %s' "$FORK_MAIN_SHA..$UPSTREAM_SHA" | awk 'NR <= 50 {print}')
          preserved_paths=$(jq -r '.preserved[]?' "$result_file")
          if [[ "$candidate_classification" == "docs-only" ]]; then
            candidate_build_status="skipped: docs-only"
          else
            candidate_build_status="PASS: assembleDebug"
          fi
          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          ## 上游更新候选

          - upstream：kukuqi666/TVBoxOS-Mobile
          - upstream SHA：$FORK_MAIN_SHA → $UPSTREAM_SHA
          - candidate：$candidate_branch
          - candidate merge SHA：$(jq -r '.candidate_sha' "$result_file")
          - 风险分类：$candidate_classification
          - candidate validation：PASS（独立 read-only job；$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID）
          - candidate build：$candidate_build_status

          ### 上游提交

          $commit_summary

          ### 候选变更文件

          $changed_paths

          ### Candidate diff stat

          $candidate_diff_stat

          ### 按 fork policy 保留

          ${preserved_paths:-无}

          下一步请把 PR 交给 ChatGPT/OC 复核，再决定是否 Merge 到 patched。U1 不自动合并 patched，也不执行签名或正式发布。
          EOF
          git push origin "refs/remotes/upstream/main:refs/heads/main"
          git push origin "HEAD:refs/heads/$candidate_branch"
          git fetch --no-tags origin \
            "+refs/heads/$candidate_branch:refs/remotes/origin/$candidate_branch"
          actual_candidate_oid=$(git rev-parse "refs/remotes/origin/$candidate_branch")
          test "$actual_candidate_oid" = "$expected_candidate_oid"
          git merge-base --is-ancestor "$PATCHED_SHA" "$actual_candidate_oid"
          expected_candidate_tree=$(git rev-parse "$expected_candidate_oid^{tree}")
          actual_candidate_tree=$(git rev-parse "refs/remotes/origin/$candidate_branch^{tree}")
          test "$actual_candidate_tree" = "$expected_candidate_tree"

          list_open_prs() {
            local pages prs attempt
            for attempt in 1 2 3; do
              if pages=$(timeout 30s gh api \
                --paginate \
                --slurp \
                "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100"); then
                if prs=$(jq -c '[.[][] | {
                  number,
                  url: .html_url,
                  state: "OPEN",
                  headRefName: .head.ref,
                  headRefOid: .head.sha,
                  headRepository: {nameWithOwner: (.head.repo.full_name // "")},
                  baseRefName: .base.ref
                }]' <<<"$pages"); then
                  printf '%s' "$prs"
                  return 0
                fi
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          find_open_candidate_pr() {
            local prs
            if ! prs=$(list_open_prs); then
              return 1
            fi
            jq -r \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg branch "$candidate_branch" \
              --arg oid "$1" \
              'map(select(.state == "OPEN" and (.headRepository.nameWithOwner // "") == $repository and .headRefName == $branch and .baseRefName == "patched" and .headRefOid == $oid)) | .[0].url // empty' \
              <<<"$prs"
          }

          close_pr_with_retry() {
            local number="$1"
            local attempt
            for attempt in 1 2 3; do
              if timeout 30s gh pr close "$number" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "U1 closed this PR because its head was not the validated candidate."; then
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          close_unvalidated_candidate_prs() {
            local prs unvalidated_numbers number
            if ! prs=$(list_open_prs); then
              return 1
            fi
            if ! unvalidated_numbers=$(jq -r \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg branch "$candidate_branch" \
              --arg oid "$1" \
              '.[] | select(.state == "OPEN" and (.headRepository.nameWithOwner // "") == $repository and .headRefName == $branch and (.headRefOid != $oid or .baseRefName != "patched")) | .number' \
              <<<"$prs"); then
              return 1
            fi
            while IFS= read -r number; do
              [[ -z "$number" ]] && continue
              close_pr_with_retry "$number"
            done <<<"$unvalidated_numbers"
          }

          pr_create_error="$RUNNER_TEMP/pr-create.error"
          pr_create_output="$RUNNER_TEMP/pr-create.output"
          set +e
          pr_create_status=1
          for attempt in 1 2 3; do
            timeout 60s gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base patched \
              --head "$candidate_branch" \
              --title "chore: upstream candidate ${UPSTREAM_SHA:0:7}" \
              --body-file "$RUNNER_TEMP/pr-body.md" \
              --reviewer slashinchi >"$pr_create_output" 2>"$pr_create_error"
            pr_create_status=$?
            [[ "$pr_create_status" -eq 0 ]] && break
            sleep $((attempt * 2))
          done
          set -e
          pr_url=$(awk 'NF {last=$0} END {print last}' "$pr_create_output")
          if [[ "$pr_create_status" -ne 0 || -z "$pr_url" ]]; then
            recovered_pr_url=""
            if recovered_pr_url=$(find_open_candidate_pr "$expected_candidate_oid"); then
              :
            else
              recovered_pr_url=""
            fi
            if [[ -n "$recovered_pr_url" ]]; then
              pr_url="$recovered_pr_url"
            else
              close_unvalidated_candidate_prs "$expected_candidate_oid"
              cat "$pr_create_error"
              exit 1
            fi
          fi

          pr_view_error="$RUNNER_TEMP/pr-view.error"
          set +e
          pr_view_status=1
          for attempt in 1 2 3; do
            pr_view_json=$(timeout 30s gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json state,headRefName,headRefOid,headRepository,baseRefName 2>"$pr_view_error")
            pr_view_status=$?
            [[ "$pr_view_status" -eq 0 ]] && break
            sleep $((attempt * 2))
          done
          set -e
          if [[ "$pr_view_status" -ne 0 ]]; then
            recovered_pr_url=""
            if recovered_pr_url=$(find_open_candidate_pr "$expected_candidate_oid"); then
              :
            else
              recovered_pr_url=""
            fi
            if [[ -n "$recovered_pr_url" ]]; then
              pr_url="$recovered_pr_url"
              pr_view_json=$(jq -n \
                --arg branch "$candidate_branch" \
                --arg oid "$expected_candidate_oid" \
                --arg repository "$GITHUB_REPOSITORY" \
                '{state: "OPEN", headRefName: $branch, headRefOid: $oid, headRepository: {nameWithOwner: $repository}, baseRefName: "patched"}')
            else
              close_unvalidated_candidate_prs "$expected_candidate_oid"
              cat "$pr_view_error"
              exit 1
            fi
          fi
          if ! jq -e 'type == "object"' <<<"$pr_view_json" >/dev/null; then
            close_unvalidated_candidate_prs "$expected_candidate_oid"
            echo "The PR view response was not a JSON object."
            exit 1
          fi
          pr_state=$(jq -r '.state // empty' <<<"$pr_view_json")
          pr_head_name=$(jq -r '.headRefName // empty' <<<"$pr_view_json")
          pr_head_oid=$(jq -r '.headRefOid // empty' <<<"$pr_view_json")
          pr_head_repository=$(jq -r '.headRepository.nameWithOwner // empty' <<<"$pr_view_json")
          pr_base_name=$(jq -r '.baseRefName // empty' <<<"$pr_view_json")
          if [[ "$pr_state" != "OPEN" || "$pr_head_name" != "$candidate_branch" || "$pr_head_oid" != "$expected_candidate_oid" || "$pr_head_repository" != "$GITHUB_REPOSITORY" || "$pr_base_name" != "patched" ]]; then
            close_unvalidated_candidate_prs "$expected_candidate_oid"
            echo "Candidate branch changed while opening the PR."
            exit 1
          fi
          close_unvalidated_candidate_prs "$expected_candidate_oid"

  repair_candidate_pr:
    name: Recover existing candidate branch PR
    needs: [probe]
    if: needs.probe.result == 'success' && needs.probe.outputs.state == 'candidate-branch-no-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out trusted monitor code without executing candidate code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reuse existing candidate branch without force update
        env:
          UPSTREAM_REPO: kukuqi666/TVBoxOS-Mobile
          UPSTREAM_SHA: ${{ needs.probe.outputs.upstream_sha }}
          FORK_MAIN_SHA: ${{ needs.probe.outputs.fork_main_sha }}
          PATCHED_SHA: ${{ needs.probe.outputs.patched_sha }}
          CANDIDATE_BRANCH_OID: ${{ needs.probe.outputs.candidate_branch_oid }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate_branch="automation/upstream-${UPSTREAM_SHA:0:7}"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin +refs/heads/patched:refs/remotes/origin/patched
          git fetch --no-tags "https://github.com/${UPSTREAM_REPO}.git" \
            +refs/heads/main:refs/remotes/upstream/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$FORK_MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/patched)" = "$PATCHED_SHA"
          test "$(git rev-parse refs/remotes/upstream/main)" = "$UPSTREAM_SHA"
          git merge-base --is-ancestor "$FORK_MAIN_SHA" "$UPSTREAM_SHA"
          git ls-remote --exit-code origin "refs/heads/$candidate_branch" >/dev/null
          git fetch --no-tags origin \
            "+refs/heads/$candidate_branch:refs/remotes/origin/$candidate_branch"
          actual_candidate_oid=$(git rev-parse "refs/remotes/origin/$candidate_branch")
          test "$actual_candidate_oid" = "$CANDIDATE_BRANCH_OID"
          git merge-base --is-ancestor "$PATCHED_SHA" "$actual_candidate_oid"

          git switch --detach "$PATCHED_SHA"
          expected_file="$RUNNER_TEMP/expected-candidate.json"
          python3 scripts/upstream_monitor.py prepare-candidate \
            --repo . \
            --upstream-ref "$UPSTREAM_SHA" \
            --base-ref HEAD > "$expected_file"
          test "$(jq -r '.status' "$expected_file")" = clean
          candidate_classification=$(jq -r '.classification' "$expected_file")
          expected_tree=$(git rev-parse HEAD^{tree})
          actual_tree=$(git rev-parse "refs/remotes/origin/$candidate_branch^{tree}")
          test "$actual_tree" = "$expected_tree"
          git push origin "refs/remotes/upstream/main:refs/heads/main"
          git fetch --no-tags origin \
            "+refs/heads/$candidate_branch:refs/remotes/origin/$candidate_branch"
          actual_candidate_oid=$(git rev-parse "refs/remotes/origin/$candidate_branch")
          test "$actual_candidate_oid" = "$CANDIDATE_BRANCH_OID"
          git merge-base --is-ancestor "$PATCHED_SHA" "$actual_candidate_oid"
          actual_tree=$(git rev-parse "refs/remotes/origin/$candidate_branch^{tree}")
          test "$actual_tree" = "$expected_tree"

          changed_paths=$(git diff --name-only "$PATCHED_SHA...refs/remotes/origin/$candidate_branch")
          candidate_diff_stat=$(git diff --stat "$PATCHED_SHA...refs/remotes/origin/$candidate_branch")
          commit_summary=$(git log --format='- %h %s' "$FORK_MAIN_SHA..$UPSTREAM_SHA" | awk 'NR <= 50 {print}')
          if [[ "$candidate_classification" == "docs-only" ]]; then
            candidate_build_status="skipped: docs-only"
          else
            candidate_build_status="PASS: prior read-only validation"
          fi
          cat > "$RUNNER_TEMP/recovery-pr-body.md" <<EOF
          ## 上游候选 PR 恢复

          - upstream：kukuqi666/TVBoxOS-Mobile
          - upstream SHA：$FORK_MAIN_SHA → $UPSTREAM_SHA
          - existing candidate：$candidate_branch
          - candidate merge SHA：$CANDIDATE_BRANCH_OID
          - 风险分类：$candidate_classification
          - recovery：复用已推送分支；不 force-update，不执行 candidate code
          - candidate validation：此前 run 已完成；本次重新校验 branch OID/tree；只恢复 PR 入口
          - candidate build：$candidate_build_status

          ### 上游提交

          $commit_summary

          ### Candidate diff stat

          $candidate_diff_stat

          ### 候选变更文件

          $changed_paths

          请把 PR 交给 ChatGPT/OC 复核，再决定是否 Merge 到 patched。
          EOF
          list_open_prs() {
            local pages prs attempt
            for attempt in 1 2 3; do
              if pages=$(timeout 30s gh api \
                --paginate \
                --slurp \
                "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100"); then
                if prs=$(jq -c '[.[][] | {
                  number,
                  url: .html_url,
                  state: "OPEN",
                  headRefName: .head.ref,
                  headRefOid: .head.sha,
                  headRepository: {nameWithOwner: (.head.repo.full_name // "")},
                  baseRefName: .base.ref
                }]' <<<"$pages"); then
                  printf '%s' "$prs"
                  return 0
                fi
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          find_open_candidate_pr() {
            local prs
            if ! prs=$(list_open_prs); then
              return 1
            fi
            jq -r \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg branch "$candidate_branch" \
              --arg oid "$1" \
              'map(select(.state == "OPEN" and (.headRepository.nameWithOwner // "") == $repository and .headRefName == $branch and .baseRefName == "patched" and .headRefOid == $oid)) | .[0].url // empty' \
              <<<"$prs"
          }

          close_pr_with_retry() {
            local number="$1"
            local attempt
            for attempt in 1 2 3; do
              if timeout 30s gh pr close "$number" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "U1 closed this PR because its head was not the validated candidate."; then
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          close_unvalidated_candidate_prs() {
            local prs unvalidated_numbers number
            if ! prs=$(list_open_prs); then
              return 1
            fi
            if ! unvalidated_numbers=$(jq -r \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg branch "$candidate_branch" \
              --arg oid "$1" \
              '.[] | select(.state == "OPEN" and (.headRepository.nameWithOwner // "") == $repository and .headRefName == $branch and (.headRefOid != $oid or .baseRefName != "patched")) | .number' \
              <<<"$prs"); then
              return 1
            fi
            while IFS= read -r number; do
              [[ -z "$number" ]] && continue
              close_pr_with_retry "$number"
            done <<<"$unvalidated_numbers"
          }

          pr_create_error="$RUNNER_TEMP/recovery-pr-create.error"
          pr_create_output="$RUNNER_TEMP/recovery-pr-create.output"
          set +e
          pr_create_status=1
          for attempt in 1 2 3; do
            timeout 60s gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base patched \
              --head "$candidate_branch" \
              --title "chore: recover upstream candidate ${UPSTREAM_SHA:0:7}" \
              --body-file "$RUNNER_TEMP/recovery-pr-body.md" \
              --reviewer slashinchi >"$pr_create_output" 2>"$pr_create_error"
            pr_create_status=$?
            [[ "$pr_create_status" -eq 0 ]] && break
            sleep $((attempt * 2))
          done
          set -e
          pr_url=$(awk 'NF {last=$0} END {print last}' "$pr_create_output")
          if [[ "$pr_create_status" -ne 0 || -z "$pr_url" ]]; then
            recovered_pr_url=""
            if recovered_pr_url=$(find_open_candidate_pr "$CANDIDATE_BRANCH_OID"); then
              :
            else
              recovered_pr_url=""
            fi
            if [[ -n "$recovered_pr_url" ]]; then
              pr_url="$recovered_pr_url"
            else
              close_unvalidated_candidate_prs "$CANDIDATE_BRANCH_OID"
              cat "$pr_create_error"
              exit 1
            fi
          fi
          pr_view_error="$RUNNER_TEMP/recovery-pr-view.error"
          set +e
          pr_view_status=1
          for attempt in 1 2 3; do
            pr_view_json=$(timeout 30s gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json state,headRefName,headRefOid,headRepository,baseRefName 2>"$pr_view_error")
            pr_view_status=$?
            [[ "$pr_view_status" -eq 0 ]] && break
            sleep $((attempt * 2))
          done
          set -e
          if [[ "$pr_view_status" -ne 0 ]]; then
            recovered_pr_url=""
            if recovered_pr_url=$(find_open_candidate_pr "$CANDIDATE_BRANCH_OID"); then
              :
            else
              recovered_pr_url=""
            fi
            if [[ -n "$recovered_pr_url" ]]; then
              pr_url="$recovered_pr_url"
              pr_view_json=$(jq -n \
                --arg branch "$candidate_branch" \
                --arg oid "$CANDIDATE_BRANCH_OID" \
                --arg repository "$GITHUB_REPOSITORY" \
                '{state: "OPEN", headRefName: $branch, headRefOid: $oid, headRepository: {nameWithOwner: $repository}, baseRefName: "patched"}')
            else
              close_unvalidated_candidate_prs "$CANDIDATE_BRANCH_OID"
              cat "$pr_view_error"
              exit 1
            fi
          fi
          if ! jq -e 'type == "object"' <<<"$pr_view_json" >/dev/null; then
            close_unvalidated_candidate_prs "$CANDIDATE_BRANCH_OID"
            echo "The recovery PR view response was not a JSON object."
            exit 1
          fi
          pr_state=$(jq -r '.state // empty' <<<"$pr_view_json")
          pr_head_name=$(jq -r '.headRefName // empty' <<<"$pr_view_json")
          pr_head_oid=$(jq -r '.headRefOid // empty' <<<"$pr_view_json")
          pr_head_repository=$(jq -r '.headRepository.nameWithOwner // empty' <<<"$pr_view_json")
          pr_base_name=$(jq -r '.baseRefName // empty' <<<"$pr_view_json")
          if [[ "$pr_state" != "OPEN" || "$pr_head_name" != "$candidate_branch" || "$pr_head_oid" != "$CANDIDATE_BRANCH_OID" || "$pr_head_repository" != "$GITHUB_REPOSITORY" || "$pr_base_name" != "patched" ]]; then
            close_unvalidated_candidate_prs "$CANDIDATE_BRANCH_OID"
            echo "Candidate branch changed while recovering the PR."
            exit 1
          fi
          close_unvalidated_candidate_prs "$CANDIDATE_BRANCH_OID"

  notify:
    name: Notify and fail closed
    needs: [fixture_tests, date_gate, probe, candidate_validation, write_candidate, repair_candidate_pr]
    if: >-
      always() &&
      (
        needs.fixture_tests.result != 'success' ||
        needs.date_gate.result != 'success' ||
        (
          needs.date_gate.outputs.active == 'true' &&
          (
            needs.probe.result != 'success' ||
            (needs.probe.outputs.state != 'no-change' &&
             needs.probe.outputs.state != 'already-open' &&
             needs.probe.outputs.state != 'fast-forward' &&
             needs.probe.outputs.state != 'no-actionable-delta' &&
             needs.probe.outputs.state != 'candidate-branch-no-pr' &&
             needs.probe.outputs.state != 'candidate-branch-missing-after-main') ||
             needs.candidate_validation.result == 'failure' ||
             needs.candidate_validation.result == 'cancelled' ||
             needs.candidate_validation.outputs.validation == 'fail' ||
             needs.write_candidate.result == 'failure' ||
             needs.write_candidate.result == 'cancelled' ||
             needs.repair_candidate_pr.result == 'failure' ||
             needs.repair_candidate_pr.result == 'cancelled'
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Create or update a deduplicated issue
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_RESULT: ${{ needs.fixture_tests.result }}
          DATE_GATE_RESULT: ${{ needs.date_gate.result }}
          PROBE_STATE: ${{ needs.probe.outputs.state }}
          VALIDATION: ${{ needs.candidate_validation.outputs.validation }}
          VALIDATION_RESULT: ${{ needs.candidate_validation.result }}
          WRITE_RESULT: ${{ needs.write_candidate.result }}
          REPAIR_RESULT: ${{ needs.repair_candidate_pr.result }}
          FORK_MAIN_SHA: ${{ needs.probe.outputs.fork_main_sha }}
          UPSTREAM_SHA: ${{ needs.probe.outputs.upstream_sha }}
          PATCHED_SHA: ${{ needs.probe.outputs.patched_sha }}
          CLASSIFICATION: ${{ needs.candidate_validation.outputs.classification }}
          CANDIDATE_SHA: ${{ needs.candidate_validation.outputs.candidate_sha }}
          CHANGED_PATHS_B64: ${{ needs.candidate_validation.outputs.changed_paths_b64 }}
          PRESERVED_PATHS_B64: ${{ needs.candidate_validation.outputs.preserved_paths_b64 }}
          CANDIDATE_DIFF_STAT_B64: ${{ needs.candidate_validation.outputs.candidate_diff_stat_b64 }}
          COMMIT_SUMMARY_B64: ${{ needs.probe.outputs.commit_summary_b64 }}
          SOURCE_DIFF_STAT_B64: ${{ needs.probe.outputs.source_diff_stat_b64 }}
        run: |
          set -euo pipefail
          reason=probe-error
          if [[ "$FIXTURE_RESULT" != "success" ]]; then
            reason=fixture-tests-failure
          elif [[ "$DATE_GATE_RESULT" != "success" ]]; then
            reason=date-gate-failure
          elif [[ "$REPAIR_RESULT" == "failure" || "$REPAIR_RESULT" == "cancelled" ]]; then
            reason=repair-failure
          elif [[ "$WRITE_RESULT" == "failure" || "$WRITE_RESULT" == "cancelled" ]]; then
            reason=write-failure
          elif [[ "$VALIDATION_RESULT" == "failure" || "$VALIDATION_RESULT" == "cancelled" || "$VALIDATION" == "fail" ]]; then
            reason=candidate-validation-failure
          elif [[ -n "$PROBE_STATE" ]]; then
            reason="$PROBE_STATE"
          fi
          issue_key="${UPSTREAM_SHA:0:7}"
          [[ -n "$issue_key" ]] || issue_key=global
          title="[upstream-monitor] $reason $issue_key"
          changed_paths="not available"
          if [[ -n "$CHANGED_PATHS_B64" ]]; then
            changed_paths=$(printf '%s' "$CHANGED_PATHS_B64" | base64 --decode | tr '\0' ',')
          fi
          preserved_paths="none"
          if [[ -n "$PRESERVED_PATHS_B64" ]]; then
            preserved_paths=$(printf '%s' "$PRESERVED_PATHS_B64" | base64 --decode | tr '\0' ',')
          fi
          commit_summary="not available"
          if [[ -n "$COMMIT_SUMMARY_B64" ]]; then
            commit_summary=$(printf '%s' "$COMMIT_SUMMARY_B64" | base64 --decode)
          fi
          source_diff_stat="not available"
          if [[ -n "$SOURCE_DIFF_STAT_B64" ]]; then
            source_diff_stat=$(printf '%s' "$SOURCE_DIFF_STAT_B64" | base64 --decode)
          fi
          candidate_diff_stat="not available (candidate not produced)"
          if [[ -n "$CANDIDATE_DIFF_STAT_B64" ]]; then
            candidate_diff_stat=$(printf '%s' "$CANDIDATE_DIFF_STAT_B64" | base64 --decode)
          fi
          if [[ "$CLASSIFICATION" == "docs-only" ]]; then
            candidate_build_status="skipped: docs-only"
          elif [[ "$VALIDATION_RESULT" == "success" && "$VALIDATION" == "pass" ]]; then
            candidate_build_status="PASS: assembleDebug"
          else
            candidate_build_status="not run / failed closed"
          fi
          comment_marker="<!-- tvbox-upstream-monitor:$reason:$issue_key -->"
          body=$(cat <<EOF
          $comment_marker
          @slashinchi U1 upstream monitor 已 fail closed。

          - reason：$reason
          - upstream SHA：${FORK_MAIN_SHA:-unknown} → ${UPSTREAM_SHA:-unknown}
          - patched SHA：${PATCHED_SHA:-unknown}
          - candidate SHA：${CANDIDATE_SHA:-none}
          - risk classification：${CLASSIFICATION:-unknown/high-risk}
          - candidate build/validation：$candidate_build_status / ${VALIDATION:-unknown}
          - changed files：$changed_paths
          - source diff stat：$source_diff_stat
          - candidate diff stat：$candidate_diff_stat
          - fork-owned preserved：$preserved_paths
          - workflow run：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - probe state：${PROBE_STATE:-unknown}

          ### Upstream commit summary

          $commit_summary

          请把本 Issue 交给 ChatGPT/OC 复核；automation 不会自动合并 patched。
          EOF
          )
          list_open_issues() {
            local issues attempt
            for attempt in 1 2 3; do
              if issues=$(timeout 30s gh issue list \
                --repo "$GITHUB_REPOSITORY" \
                --state open \
                --limit 1000 \
                --json number,title); then
                printf '%s' "$issues"
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          list_issue_comments() {
            local number="$1"
            local comments attempt
            for attempt in 1 2 3; do
              if comments=$(timeout 30s gh api \
                --paginate \
                --slurp \
                "repos/$GITHUB_REPOSITORY/issues/$number/comments?per_page=100"); then
                printf '%s' "$comments"
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          issue_has_marker() {
            local number="$1"
            local marker="$2"
            local comments
            if ! comments=$(list_issue_comments "$number"); then
              return 1
            fi
            jq -e --arg marker "$marker" 'any(.[][]; (.body // "") | contains($marker))' <<<"$comments" >/dev/null
          }

          comment_issue_idempotent() {
            local number="$1"
            local comment="$2"
            local marker="$3"
            if issue_has_marker "$number" "$marker"; then
              return 0
            fi
            if timeout 30s gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$comment"; then
              return 0
            fi
            issue_has_marker "$number" "$marker"
          }

          edit_issue_with_retry() {
            local number="$1"
            local attempt
            for attempt in 1 2 3; do
              if timeout 30s gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --add-assignee slashinchi; then
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          create_issue_with_reconcile() {
            local issue_title="$1"
            local issue_body="$2"
            if timeout 30s gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$issue_title" \
              --assignee slashinchi \
              --body "$issue_body"; then
              return 0
            fi
            local existing_after_failure
            if ! existing_after_failure=$(list_open_issues | jq -r --arg title "$issue_title" 'map(select(.title == $title)) | .[0].number // empty'); then
              return 1
            fi
            [[ -n "$existing_after_failure" ]]
          }

          existing=$(list_open_issues | jq -r --arg title "$title" 'map(select(.title == $title)) | .[0].number // empty')
          if [[ -n "$existing" ]]; then
            comment_issue_idempotent "$existing" "$body" "$comment_marker"
            edit_issue_with_retry "$existing"
          else
            create_issue_with_reconcile "$title" "$body"
          fi
          exit 1

  recover:
    name: Close recovered automation issues
    needs: [fixture_tests, date_gate, probe, candidate_validation, write_candidate, repair_candidate_pr, notify]
    if: >-
      always() &&
      needs.fixture_tests.result == 'success' &&
      needs.date_gate.result == 'success' &&
      needs.date_gate.outputs.active == 'true' &&
      needs.probe.result == 'success' &&
      (needs.notify.result == 'success' || needs.notify.result == 'skipped') &&
      needs.candidate_validation.result != 'cancelled' &&
      needs.write_candidate.result != 'cancelled' &&
      needs.repair_candidate_pr.result != 'cancelled' &&
      (
        needs.probe.outputs.state == 'no-change' ||
        needs.probe.outputs.state == 'no-actionable-delta' ||
        needs.probe.outputs.state == 'already-open' ||
        needs.repair_candidate_pr.result == 'success' ||
        needs.write_candidate.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Close resolved U1 automation issues
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ needs.probe.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          recovery_key="${UPSTREAM_SHA:0:7}"
          [[ -n "$recovery_key" ]] || recovery_key=global
          list_open_issues() {
            local issues attempt
            for attempt in 1 2 3; do
              if issues=$(timeout 30s gh issue list \
                --repo "$GITHUB_REPOSITORY" \
                --state open \
                --limit 1000 \
                --json number,title); then
                printf '%s' "$issues"
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          list_issue_comments() {
            local number="$1"
            local comments attempt
            for attempt in 1 2 3; do
              if comments=$(timeout 30s gh api \
                --paginate \
                --slurp \
                "repos/$GITHUB_REPOSITORY/issues/$number/comments?per_page=100"); then
                printf '%s' "$comments"
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          issue_has_marker() {
            local number="$1"
            local marker="$2"
            local comments
            if ! comments=$(list_issue_comments "$number"); then
              return 1
            fi
            jq -e --arg marker "$marker" 'any(.[][]; (.body // "") | contains($marker))' <<<"$comments" >/dev/null
          }

          comment_issue_idempotent() {
            local number="$1"
            local comment="$2"
            local marker="$3"
            if issue_has_marker "$number" "$marker"; then
              return 0
            fi
            if timeout 30s gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$comment"; then
              return 0
            fi
            issue_has_marker "$number" "$marker"
          }

          close_issue_with_retry() {
            local number="$1"
            local attempt
            for attempt in 1 2 3; do
              if timeout 30s gh issue close "$number" --repo "$GITHUB_REPOSITORY"; then
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          open_issues=$(list_open_issues)
          resolved_issue_numbers=$(jq -r --arg recovery_key "$recovery_key" '
            .[]
            | select(.title | startswith("[upstream-monitor] "))
            | (try (.title | capture("^\\[upstream-monitor\\] (?<reason>[^ ]+) (?<sha>[^ ]+)$")) catch null) as $parts
            | select($parts != null)
            | select(
                $parts.sha == $recovery_key
                or ($parts.sha == "global" and ($parts.reason == "fixture-tests-failure" or $parts.reason == "date-gate-failure" or $parts.reason == "probe-error"))
              )
            | select([
                "fixture-tests-failure",
                "date-gate-failure",
                "probe-error",
                "candidate-preview-error",
                "candidate-conflict",
                "main-divergence",
                "candidate-validation-failure",
                "write-failure",
                "repair-failure",
                "candidate-branch-no-pr",
                "candidate-branch-missing-after-main",
                "candidate-closed-or-merged",
                "stale-open",
                "patched-behind-main",
                "no-actionable-delta"
              ] | index($parts.reason))
            | .number
          ' <<<"$open_issues")
          while IFS= read -r number; do
            [[ -z "$number" ]] && continue
            recovery_marker="<!-- tvbox-upstream-recovery:$number -->"
            comment_issue_idempotent "$number" \
              "$recovery_marker
              U1 已恢复；本次检查通过，自动关闭该去重 Issue。" \
              "$recovery_marker"
            close_issue_with_retry "$number"
          done <<<"$resolved_issue_numbers"
