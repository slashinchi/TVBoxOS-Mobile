name: Foundation GITHUB_TOKEN Canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-pr-canary:
    if: github.ref == 'refs/heads/patched' && github.actor == 'slashinchi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}

    steps:
      - name: Check out patched source
        uses: actions/checkout@v4
        with:
          ref: patched
          fetch-depth: 0

      - name: Create shadow refs and harmless upstream change
        id: shadow
        shell: bash
        run: |
          set -euo pipefail
          real_main=$(git rev-parse origin/main)
          real_patched=$(git rev-parse origin/patched)
          real_tag=$(gh api "repos/$REPOSITORY/git/ref/tags/v2.1.26.1" --jq '.object.sha')
          real_update=$(gh api "repos/$REPOSITORY/contents/update.json?ref=patched" --jq '.sha')
          shadow_main="automation/foundation-canary-main-${GITHUB_RUN_ID}"
          shadow_patched="automation/foundation-canary-patched-${GITHUB_RUN_ID}"
          shadow_upstream="automation/foundation-canary-upstream-${GITHUB_RUN_ID}"
          candidate_branch="automation/foundation-canary-candidate-${GITHUB_RUN_ID}"

          git push origin "$real_main:refs/heads/$shadow_main"
          git push origin "$real_patched:refs/heads/$shadow_patched"

          git switch --detach "$real_main"
          mkdir -p docs
          printf 'Foundation canary run %s.\n' "$GITHUB_RUN_ID" > "docs/foundation-canary-${GITHUB_RUN_ID}.md"
          git add "docs/foundation-canary-${GITHUB_RUN_ID}.md"
          git -c user.name='foundation-canary' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "test: foundation canary shadow upstream change"
          upstream_oid=$(git rev-parse HEAD)
          git push origin "HEAD:refs/heads/$shadow_upstream"
          git push origin "$upstream_oid:refs/heads/$shadow_main"

          {
            echo "real_main=$real_main"
            echo "real_patched=$real_patched"
            echo "real_tag=$real_tag"
            echo "real_update=$real_update"
            echo "shadow_main=$shadow_main"
            echo "shadow_patched=$shadow_patched"
            echo "shadow_upstream=$shadow_upstream"
            echo "candidate_branch=$candidate_branch"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare and validate shadow candidate
        id: candidate
        shell: bash
        env:
          SHADOW_PATCHED: ${{ steps.shadow.outputs.shadow_patched }}
          SHADOW_UPSTREAM: ${{ steps.shadow.outputs.shadow_upstream }}
        run: |
          set -euo pipefail
          result=$(python3 scripts/upstream_monitor.py prepare-candidate \
            --repo . \
            --upstream-ref "origin/$SHADOW_UPSTREAM" \
            --base-ref "origin/$SHADOW_PATCHED")
          echo "$result" | jq -e '.status == "clean" and .candidate_needed == true and (.changed_paths == ["docs/foundation-canary-'"$GITHUB_RUN_ID"'.md"]) and (.preserved | length == 0)' >/dev/null
          candidate_sha=$(echo "$result" | jq -r '.candidate_sha')
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "$result"

      - name: Push only the shadow candidate branch
        shell: bash
        env:
          CANDIDATE_BRANCH: ${{ steps.shadow.outputs.candidate_branch }}
        run: git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"

      - name: Create and reconcile the real PR path on shadow refs
        id: pr
        shell: bash
        env:
          SHADOW_PATCHED: ${{ steps.shadow.outputs.shadow_patched }}
          CANDIDATE_BRANCH: ${{ steps.shadow.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          pr_json=$(python3 - <<'PY'
          import json
          from scripts.upstream_monitor import create_pr_with_reconcile

          url = create_pr_with_reconcile(
              repository="${{ github.repository }}",
              base="${{ env.SHADOW_PATCHED }}",
              head="${{ env.CANDIDATE_BRANCH }}",
              title="[Foundation Canary] shadow candidate ${{ github.run_id }}",
              body=(
                  "<!-- FOUNDATION_CANARY_PR_V1 -->\n"
                  "run_id=${{ github.run_id }}\n"
                  "candidate_sha=${{ env.CANDIDATE_SHA }}\n"
                  "This is disposable shadow state; do not merge."
              ),
              expected_oid="${{ env.CANDIDATE_SHA }}",
              reviewer="slashinchi",
          )
          print(json.dumps({"url": url}))
          PY
          )
          pr_url=$(echo "$pr_json" | jq -r '.url')
          pr_number=$(gh pr view "$pr_url" --repo "$REPOSITORY" --json number --jq '.number')
          second_url=$(python3 - <<'PY'
          from scripts.upstream_monitor import create_pr_with_reconcile

          print(create_pr_with_reconcile(
              repository="${{ github.repository }}",
              base="${{ env.SHADOW_PATCHED }}",
              head="${{ env.CANDIDATE_BRANCH }}",
              title="[Foundation Canary] shadow candidate ${{ github.run_id }}",
              body=(
                  "<!-- FOUNDATION_CANARY_PR_V1 -->\n"
                  "run_id=${{ github.run_id }}\n"
                  "candidate_sha=${{ env.CANDIDATE_SHA }}\n"
                  "This is disposable shadow state; do not merge."
              ),
              expected_oid="${{ env.CANDIDATE_SHA }}",
              reviewer="slashinchi",
          ))
          PY
          )
          test "$second_url" = "$pr_url"
          gh pr view "$pr_url" --repo "$REPOSITORY" --json state,headRefName,headRefOid,headRepository,baseRefName,reviewRequests
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Verify pull request workflow behavior without approval
        shell: bash
        env:
          CANDIDATE_BRANCH: ${{ steps.shadow.outputs.candidate_branch }}
        run: |
          set -euo pipefail
          runs=$(gh run list --repo "$REPOSITORY" --workflow build.yml --event pull_request --limit 20 --json databaseId,headBranch,status,conclusion,url)
          matching=$(echo "$runs" | jq --arg branch "$CANDIDATE_BRANCH" '[.[] | select(.headBranch == $branch)]')
          if [ "$(echo "$matching" | jq 'length')" -gt 0 ]; then
            echo "$matching"
            echo "Pull request workflow was created; it remains unapproved and unexecuted by this canary."
          else
            echo "No pull_request workflow run was created by the GITHUB_TOKEN event; no PR workflow was approved or executed."
          fi

      - name: Close PR and remove every shadow ref
        if: always()
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          SHADOW_MAIN: ${{ steps.shadow.outputs.shadow_main }}
          SHADOW_PATCHED: ${{ steps.shadow.outputs.shadow_patched }}
          SHADOW_UPSTREAM: ${{ steps.shadow.outputs.shadow_upstream }}
          CANDIDATE_BRANCH: ${{ steps.shadow.outputs.candidate_branch }}
        run: |
          set -euo pipefail
          SHADOW_MAIN="${SHADOW_MAIN:-automation/foundation-canary-main-${GITHUB_RUN_ID}}"
          SHADOW_PATCHED="${SHADOW_PATCHED:-automation/foundation-canary-patched-${GITHUB_RUN_ID}}"
          SHADOW_UPSTREAM="${SHADOW_UPSTREAM:-automation/foundation-canary-upstream-${GITHUB_RUN_ID}}"
          CANDIDATE_BRANCH="${CANDIDATE_BRANCH:-automation/foundation-canary-candidate-${GITHUB_RUN_ID}}"
          PR_NUMBER="${PR_NUMBER:-}"
          if [ -z "$PR_NUMBER" ] && git ls-remote --exit-code --heads origin "$CANDIDATE_BRANCH" >/dev/null 2>&1; then
            PR_NUMBER=$(gh pr list --repo "$REPOSITORY" --state open --head "$CANDIDATE_BRANCH" --json number --jq '.[0].number // empty')
          fi
          if [ -n "${PR_NUMBER:-}" ]; then
            pr_state=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json state --jq '.state')
            if [ "$pr_state" = "OPEN" ]; then
              gh pr close "$PR_NUMBER" --repo "$REPOSITORY" --comment "Foundation canary cleanup; do not merge."
            fi
          fi
          for branch in "$SHADOW_MAIN" "$SHADOW_PATCHED" "$SHADOW_UPSTREAM" "$CANDIDATE_BRANCH"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done

      - name: Verify real state and canary cleanup
        if: always()
        shell: bash
        env:
          REAL_MAIN: ${{ steps.shadow.outputs.real_main }}
          REAL_PATCHED: ${{ steps.shadow.outputs.real_patched }}
          REAL_TAG: ${{ steps.shadow.outputs.real_tag }}
          REAL_UPDATE: ${{ steps.shadow.outputs.real_update }}
          SHADOW_MAIN: ${{ steps.shadow.outputs.shadow_main }}
          SHADOW_PATCHED: ${{ steps.shadow.outputs.shadow_patched }}
          SHADOW_UPSTREAM: ${{ steps.shadow.outputs.shadow_upstream }}
          CANDIDATE_BRANCH: ${{ steps.shadow.outputs.candidate_branch }}
        run: |
          set -euo pipefail
          SHADOW_MAIN="${SHADOW_MAIN:-automation/foundation-canary-main-${GITHUB_RUN_ID}}"
          SHADOW_PATCHED="${SHADOW_PATCHED:-automation/foundation-canary-patched-${GITHUB_RUN_ID}}"
          SHADOW_UPSTREAM="${SHADOW_UPSTREAM:-automation/foundation-canary-upstream-${GITHUB_RUN_ID}}"
          CANDIDATE_BRANCH="${CANDIDATE_BRANCH:-automation/foundation-canary-candidate-${GITHUB_RUN_ID}}"
          test "$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$REAL_MAIN"
          test "$(gh api "repos/$REPOSITORY/git/ref/heads/patched" --jq '.object.sha')" = "$REAL_PATCHED"
          test "$(gh api "repos/$REPOSITORY/git/ref/tags/v2.1.26.1" --jq '.object.sha')" = "$REAL_TAG"
          test "$(gh api "repos/$REPOSITORY/contents/update.json?ref=patched" --jq '.sha')" = "$REAL_UPDATE"
          for branch in "$SHADOW_MAIN" "$SHADOW_PATCHED" "$SHADOW_UPSTREAM" "$CANDIDATE_BRANCH"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Shadow ref remains: $branch" >&2
              exit 1
            fi
          done
          open_canary_prs=$(gh pr list --repo "$REPOSITORY" --state open --search "Foundation Canary" --json number)
          test "$(echo "$open_canary_prs" | jq 'length')" -eq 0
          echo "Real refs/tag/update metadata unchanged; no open canary PR or shadow ref remains."
