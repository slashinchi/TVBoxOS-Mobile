name: Scheduler Transport Probe

on:
  schedule:
    - cron: '*/5 * * * *'
      timezone: Asia/Shanghai

permissions:
  contents: read

jobs:
  probe:
    name: Record scheduler event
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Record schedule evidence
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf 'event_name=%s\n' "$EVENT_NAME"
          printf 'event_schedule=%s\n' "$SCHEDULE"
          printf 'commit_sha=%s\n' "$COMMIT_SHA"
          printf 'utc_time='; date -u '+%Y-%m-%dT%H:%M:%SZ'
          printf 'asia_shanghai_time='; TZ=Asia/Shanghai date '+%Y-%m-%dT%H:%M:%S%z'
