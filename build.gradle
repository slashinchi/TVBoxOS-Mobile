// GitHub Actions uses only official HTTPS repositories and a filtered JitPack
// fallback. Local development keeps the mainland mirror preference.
// The buildscript block is evaluated before the rest of this file.
buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        gradlePluginPortal()
        if (System.getenv("GITHUB_ACTIONS") == "true") {
            google()
            mavenCentral()
            maven {
                url "https://jitpack.io"
                content { includeGroupByRegex "com\\.github\\..*" }
            }
        } else {
            maven { url "https://maven.aliyun.com/repository/releases" }
            maven { url "https://maven.aliyun.com/repository/public" }
            google()
            mavenCentral()
            maven {
                url "https://jitpack.io"
                content { includeGroupByRegex "com\\.github\\..*" }
            }
        }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.5.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

def tvboxLegacyRepo = System.getenv("TVBOX_LEGACY_REPO")

allprojects {
    repositories {
        gradlePluginPortal()
        if (System.getenv("GITHUB_ACTIONS") == "true") {
            if (!tvboxLegacyRepo) {
                throw new GradleException("TVBOX_LEGACY_REPO is required for trusted Actions builds")
            }
            google()
            mavenCentral()
            maven {
                url "https://jitpack.io"
                content { includeGroupByRegex "com\\.github\\..*" }
            }
            exclusiveContent {
                forRepository {
                    maven {
                        url = uri(tvboxLegacyRepo)
                        metadataSources {
                            mavenPom()
                            artifact()
                        }
                    }
                }
                filter {
                    includeVersion("com.kingja.loadsir", "loadsir", "1.3.8")
                    includeVersion("com.lzy.net", "okgo", "3.0.4")
                    includeVersion("com.owen", "tv-recyclerview", "3.0.0")
                    includeVersion("com.hyman", "flowlayout-lib", "1.1.2")
                }
            }
        } else {
            maven { url "https://maven.aliyun.com/repository/releases" }
            maven { url "https://maven.aliyun.com/repository/public" }
            //dlna-cast中cling仓
            maven {
                url 'http://4thline.org/m2'
                allowInsecureProtocol true
            }
            maven {
                url "https://jitpack.io"
                content { includeGroupByRegex "com\\.github\\..*" }
            }
            google()
            mavenCentral()
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
